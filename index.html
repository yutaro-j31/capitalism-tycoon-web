    if (ui.officeTab === "board") return `<div class="grid two">${card("\u53D6\u7DE0\u5F79\u4F1A", g.boardEstablished ? `${badge("\u8A2D\u7F6E\u6E08\u307F", "good")}${g.boardAgendas.map((a) => `<article class="item"><div><h3>${a.title}</h3><p>${a.detail}</p></div>${badge(a.effect)}</article>`).join("") || empty("\u73FE\u5728\u306E\u8B70\u984C\u306A\u3057")}` : `<p>CEO\u3068CFO\u3092\u63A1\u7528\u5F8C\u3001\u53D6\u7DE0\u5F79\u4F1A\u3092\u8A2D\u7F6E\u3067\u304D\u307E\u3059\u3002</p>${btn("\u53D6\u7DE0\u5F79\u4F1A\u3092\u8A2D\u7F6E", "establish-board", { kind: "primary" })}`)}${card("IPO\u6E96\u5099", g.publicCompany ? `<div class="kpi-grid">${stat("\u5E02\u5834", g.selectedListingMarket)}${stat("\u30C6\u30A3\u30C3\u30AB\u30FC", g.ticker)}${stat("\u682A\u4FA1", yen(g.stockPrice))}${stat("\u5275\u696D\u8005\u6301\u682A", pct(g.founderOwnershipRatio))}</div><div class="button-row">${btn("\u914D\u5F53\u8A2D\u5B9A", "set-dividend", { kind: "secondary" })}${btn("\u81EA\u793E\u682A\u8CB7\u3044", "buyback", { kind: "secondary" })}</div>` : `<p>\u4E0D\u8DB3\u6761\u4EF6\uFF1A${engine.ipoMissingReasons().join("\u3001") || "\u306A\u3057"}</p>${btn("IPO\u3092\u5B9F\u884C", "execute-ipo", { kind: "primary", disabled: engine.ipoMissingReasons().length > 0 })}`)}</div>`;

  function renderSettings() {
    const g = engine.g;
    return `<div class="grid two">${card("\u30B2\u30FC\u30E0\u8A2D\u5B9A", `<label class="switch-row"><span>\u81EA\u52D5\u7D4C\u55B6</span><input type="checkbox" data-setting="autoManage" ${g.autoManage ? "checked" : ""}></label><label class="field"><span>\u81EA\u52D5\u7D4C\u55B6\u65B9\u91DD</span><select data-setting="autoManageStyle"><option value="aggressive" ${g.autoManageStyle === "aggressive" ? "selected" : ""}>\u6210\u9577\u91CD\u8996</option><option value="balanced" ${g.autoManageStyle === "balanced" ? "selected" : ""}>\u30D0\u30E9\u30F3\u30B9</option><option value="defensive" ${g.autoManageStyle === "defensive" ? "selected" : ""}>\u5B88\u5099\u91CD\u8996</option></select></label><label class="switch-row"><span>\u52D5\u304D\u3092\u6E1B\u3089\u3059</span><input type="checkbox" data-setting="reducedMotion" ${g.settings.reducedMotion ? "checked" : ""}></label>`)}${card("\u30BB\u30FC\u30D6\u7BA1\u7406", `<div class="button-grid">${btn("\u73FE\u5728\u30C7\u30FC\u30BF\u3092\u4FDD\u5B58", "save-now", { kind: "primary" })}${btn("JSON\u66F8\u304D\u51FA\u3057", "export-save", { kind: "secondary" })}${btn("JSON\u8AAD\u307F\u8FBC\u307F", "import-save", { kind: "secondary" })}</div><h3>\u30BB\u30FC\u30D6\u30B9\u30ED\u30C3\u30C8</h3><div class="button-grid">${[1, 2, 3].map((i) => `${btn(`\u30B9\u30ED\u30C3\u30C8${i}\u4FDD\u5B58`, "save-slot", { kind: "ghost small", data: `data-id="${i}"` })}${btn(`\u8AAD\u8FBC`, "load-slot", { kind: "ghost small", data: `data-id="${i}"` })}`).join("")}</div><input id="import-file" type="file" accept="application/json" hidden>`)}
  ${card("\u30C7\u30FC\u30BF\u60C5\u5831", `${stat("\u30BB\u30FC\u30D6\u30D0\u30FC\u30B8\u30E7\u30F3", String(g.saveVersion))}${stat("\u6700\u7D42\u4FDD\u5B58", new Date(g.lastSaveDate).toLocaleString("ja-JP"))}${stat("\u30B2\u30FC\u30E0\u9031", String(g.week))}${stat("\u30CB\u30E5\u30FC\u30B9\u4EF6\u6570", String(g.news.length))}`)}${card("\u5371\u967A\u306A\u64CD\u4F5C", `${btn("\u6700\u521D\u304B\u3089\u3084\u308A\u76F4\u3059", "reset-game", { kind: "danger" })}`)}</div>${card("\u4F1A\u793E\u58F2\u5374\u30FB\u30A8\u30F3\u30C7\u30A3\u30F3\u30B0", `<p>\u4F01\u696D\u4FA1\u5024\u304C\u5341\u5206\u306B\u6210\u9577\u3057\u305F\u5F8C\u3001\u4F1A\u793E\u5168\u4F53\u3092\u58F2\u5374\u3057\u3066\u500B\u4EBA\u8CC7\u7523\u30E2\u30FC\u30C9\u3078\u79FB\u884C\u3067\u304D\u307E\u3059\u3002</p>${btn("\u4F1A\u793E\u58F2\u5374\u3092\u691C\u8A0E", "company-buyout", { kind: "danger", disabled: engine.companyValue() < 2e8 || g.isCompanySold })}`)}`;
  }
  function renderGameOver() {
    return `<div class="game-over"><div><h2>\u5012\u7523</h2><p>${esc(engine.g.gameOverReason)}</p>${btn("\u8A2D\u5B9A\u3092\u958B\u304F", "tab", { kind: "primary", data: 'data-tab="settings"' })}</div></div>`;
  }
  function showWeeklySummary(summary) {
    if (!summary) return;
    modal(`<div class="summary-head"><span>\u7B2C${summary.week}\u9031</span><h2>\u9031\u9593\u7D4C\u55B6\u30EC\u30DD\u30FC\u30C8</h2></div><div class="kpi-grid">${stat("\u58F2\u4E0A", compactYen(summary.sales))}${stat("\u8CBB\u7528", compactYen(summary.expenses))}${stat("\u5229\u76CA", compactYen(summary.profit))}${stat("\u4F1A\u793E\u73FE\u91D1", compactYen(summary.companyCash))}${stat("\u4F01\u696D\u4FA1\u5024", compactYen(summary.companyValue))}${stat("\u500B\u4EBA\u8CC7\u7523", compactYen(summary.personalNetWorth))}</div><h3>\u4E3B\u306A\u30CB\u30E5\u30FC\u30B9</h3>${summary.newNews.map((n) => `<div class="news-line">${esc(n)}</div>`).join("")}<div class="modal-actions">${btn("\u9589\u3058\u308B", "close-modal", { kind: "primary" })}</div>`, "summary-modal");
  }
  function askMoney(title, defaultValue, callback) {
    modal(`<h2>${esc(title)}</h2>${moneyInput("modal-money", defaultValue, "\u91D1\u984D\uFF08\u5186\uFF09")}<div class="modal-actions">${btn("\u30AD\u30E3\u30F3\u30BB\u30EB", "close-modal", { kind: "ghost" })}<button class="btn primary" id="modal-ok">\u5B9F\u884C</button></div>`);
    $("#modal-ok").onclick = () => {
      const v = Number($("#modal-money").value.replace(/,/g, ""));
      closeModal();
      callback(v);
    };
    setTimeout(() => $("#modal-money")?.select(), 0);
  }
  function askText(title, label, defaultValue, callback) {
    modal(`<h2>${esc(title)}</h2><label class="field"><span>${esc(label)}</span><input id="modal-text" value="${esc(defaultValue)}"></label><div class="modal-actions">${btn("\u30AD\u30E3\u30F3\u30BB\u30EB", "close-modal", { kind: "ghost" })}<button class="btn primary" id="modal-ok">\u5B9F\u884C</button></div>`);
    $("#modal-ok").onclick = () => {
      const v = $("#modal-text").value;
      closeModal();
      callback(v);
    };
  }
  function action(name, el) {
    const id = el.dataset.id, kind = el.dataset.kind;
    switch (name) {
      case "tab":
        engine.g.selectedTab = el.dataset.tab;
        engine.save();
        render();
        break;
      case "advance-week":
        engine.advanceWeek(true);
        break;
      case "advance-4":
        for (let i = 0; i < 4 && !engine.g.gameOver; i++) engine.advanceWeek(false);
        showWeeklySummary(engine.g.lastWeeklySummary);
        render();
        break;
      case "close-modal":
        closeModal();
        break;
      case "open-store": {
        const businessID = $(`#business-${id}`).value;
        askText("\u65B0\u5E97\u8217", "\u5E97\u8217\u540D", `${engine.g.companyName} ${engine.g.stores.length + 1}\u53F7\u5E97`, (name2) => engine.openStore({ tenantID: id, businessID, name: name2, operatingHours: 3 }));
        break;
      }
      case "contract-office":
        engine.contractOffice(id);
        break;
      case "cancel-office":
        confirmModal("\u30AA\u30D5\u30A3\u30B9\u5951\u7D04\u89E3\u9664", "\u90E8\u9580\u3084CXO\u304C\u3044\u308B\u5834\u5408\u306F\u89E3\u9664\u3067\u304D\u307E\u305B\u3093\u3002", "confirm-cancel-office");
        break;
      case "confirm-cancel-office":
        engine.cancelOffice();
        closeModal();
        break;
      case "buy-property-company":
        engine.buyProperty(id, "company");
        break;
      case "buy-property-personal":
        engine.buyProperty(id, "personal");
        break;
      case "sell-property":
        engine.sellProperty(id);
        break;
      case "build-property":
        askText("\u571F\u5730\u958B\u767A", "\u5EFA\u7269\u7A2E\u5225", "\u672C\u793E\u30D3\u30EB", (v) => engine.buildOnLand(id, v));
        break;
      case "business-invest":
        askMoney("\u4E8B\u696D\u6295\u8CC7", 1e6, (v) => engine.investBusiness(id, kind, v));
        break;
      case "business-price":
        askMoney("\u4FA1\u683C\u5909\u66F4", engine.business(id)?.price || 1e3, (v) => engine.adjustPrice(id, v));
        break;
      case "start-franchise":
        engine.startFranchise(id);
        break;
      case "recruit-franchise":
        askMoney("\u52A0\u76DF\u5E97\u52DF\u96C6\u6570", 1, (v) => engine.recruitFranchise(id, Math.max(1, Math.floor(v))));
        break;
      case "launch-product":
        askText("\u30D7\u30ED\u30C0\u30AF\u30C8\u958B\u767A", "\u30D7\u30ED\u30C0\u30AF\u30C8\u540D", PRODUCT_BLUEPRINTS.find((p) => p.id === id)?.name || "", (v) => engine.launchProduct(id, v));
        break;
      case "product-action":
        askMoney("\u30D7\u30ED\u30C0\u30AF\u30C8\u8FFD\u52A0\u6295\u8CC7", 2e6, (v) => engine.productAction(id, kind, v));
        break;
      case "sell-product":
        engine.sellProduct(id);
        break;
      case "office-tab":
        ui.officeTab = id;
        render();
        break;
      case "asset-tab":
        ui.assetTab = id;
        render();
        break;
      case "establish-department":
        engine.establishDepartment(id);
        break;
      case "hire-staff":
        engine.hireDepartmentStaff(id, 1);
        break;
      case "refresh-executives":
        engine.refreshExecutives();
        break;
      case "hire-executive": {
        const c = engine.g.executiveMarket.find((x) => x.id === id);
        if (!c) break;
        modal(`<h2>${c.role} ${esc(c.name)}\u3068\u4EA4\u6E09</h2>${moneyInput("salary", Math.round(c.desiredSalary || c.salary), "\u5E74\u4FF8")}${moneyInput("so", ((c.desiredSO || 5e-3) * 100).toFixed(2), "SO\uFF08%\uFF09")}<div class="modal-actions">${btn("\u30AD\u30E3\u30F3\u30BB\u30EB", "close-modal", { kind: "ghost" })}<button class="btn primary" id="hire-ok">\u6761\u4EF6\u63D0\u793A</button></div>`);
        $("#hire-ok").onclick = () => {
          const salary = Number($("#salary").value.replace(/,/g, "")), so = Number($("#so").value) / 100;
          closeModal();
          engine.hireExecutive(id, salary, so);
        };
        break;
      }
      case "dismiss-executive":
        engine.dismissExecutive(id);
        break;
      case "establish-board":
        engine.establishBoard();
        break;
      case "execute-ipo":
        modal(`<h2>IPO\u6761\u4EF6\u8A2D\u5B9A</h2><label class="field"><span>\u5E02\u5834</span><select id="ipo-market"><option>\u6771\u8A3C\u30B0\u30ED\u30FC\u30B9</option><option>\u6771\u8A3C\u30B9\u30BF\u30F3\u30C0\u30FC\u30C9</option><option>\u6771\u8A3C\u30D7\u30E9\u30A4\u30E0</option></select></label>${moneyInput("ipo-shares", 1e5, "\u5275\u696D\u8005\u58F2\u51FA\u682A\u6570")}<div class="modal-actions">${btn("\u30AD\u30E3\u30F3\u30BB\u30EB", "close-modal", { kind: "ghost" })}<button class="btn primary" id="ipo-ok">\u4E0A\u5834\u5B9F\u884C</button></div>`);
        $("#ipo-ok").onclick = () => {
          const m = $("#ipo-market").value, s = Number($("#ipo-shares").value);
          closeModal();
          engine.executeIPO(m, s);
        };
        break;
      case "set-dividend":
        askMoney("\u56DB\u534A\u671F\u914D\u5F53\u8A2D\u5B9A", engine.g.dividendPerShare || 10, (v) => engine.setDividend(v));
        break;
      case "buyback":
        askMoney("\u81EA\u793E\u682A\u8CB7\u3044", 1e7, (v) => engine.buybackOwnShares(v));
        break;
      case "workforce-invest":
        askMoney("\u798F\u5229\u539A\u751F\u6295\u8CC7", 1e6, (v) => {
          if (engine.g.companyCash < v) return engine.fail("\u8CC7\u91D1\u4E0D\u8DB3\u3067\u3059\u3002");
          engine.g.companyCash -= v;
          engine.g.employeeSatisfaction = Math.min(100, engine.g.employeeSatisfaction + Math.log10(1 + v / 1e5) * 2);
          engine.g.benefitLevel += v / 1e7;
          engine.save();
          engine.emit();
        });
        break;
      case "toggle-remote":
        engine.g.remoteWorkEnabled = !engine.g.remoteWorkEnabled;
        engine.save();
        render();
        break;
      case "add-directive":
        askText("CXO\u6307\u793A", "\u6307\u793A\u5185\u5BB9", "\u6210\u9577\u6295\u8CC7", (type) => askMoney("\u6307\u793A\u4E88\u7B97", 5e6, (v) => engine.addDirective(id, type, v)));
        break;
      case "start-campaign":
        askText("\u90E8\u9580\u65BD\u7B56", "\u65BD\u7B56\u540D", "\u91CD\u70B9\u6539\u5584\u30AD\u30E3\u30F3\u30DA\u30FC\u30F3", (type) => askMoney("\u65BD\u7B56\u4E88\u7B97", 3e6, (v) => engine.startCampaign(id, type, v)));
        break;
      case "propose-internal":
        engine.proposeInternalVenture();
        break;
      case "approve-internal":
        engine.approveInternalVenture(id);
        break;
      case "buy-stock":
        askMoney("\u8CFC\u5165\u682A\u6570", 100, (v) => engine.buyStock(id, v, ui.selectedAccount));
        break;
      case "sell-stock":
        askMoney("\u58F2\u5374\u682A\u6570", 100, (v) => engine.sellStock(id, v, ui.selectedAccount));
        break;
      case "favorite-stock":
        engine.toggleFavorite(id);
        break;
      case "invest-startup-company":
        askMoney("\u4F1A\u793EVC\u6295\u8CC7", engine.g.startups.find((s) => s.id === id)?.minTicket || 5e6, (v) => engine.investStartup(id, v, "company"));
        break;
      case "invest-startup-personal":
        askMoney("\u500B\u4EBAVC\u6295\u8CC7", engine.g.startups.find((s) => s.id === id)?.minTicket || 5e6, (v) => engine.investStartup(id, v, "personal"));
        break;
      case "make-subsidiary":
        engine.makeSubsidiary(id);
        break;
      case "ipo-subsidiary":
        engine.ipoSubsidiary(id);
        break;
      case "generate-ma":
        engine.generateMATargets(true);
        break;
      case "acquire-friendly":
        engine.acquireTarget(id, "friendly");
        break;
      case "acquire-hostile":
        engine.acquireTarget(id, "hostile");
        break;
      case "acquire-swap":
        engine.acquireTarget(id, "shareSwap");
        break;
      case "sell-ma":
        engine.sellMASubsidiary(id);
        break;
      case "open-overseas":
        engine.openOverseas(id, $(`#overseas-business-${id}`).value);
        break;
      case "overseas-action":
        askMoney("\u6D77\u5916\u4E8B\u696D\u6295\u8CC7", 5e6, (v) => engine.overseasAction(id, kind, v));
        break;
      case "buy-personal-investment":
        askMoney("\u6295\u8CC7\u984D", PERSONAL_INVESTMENT_OFFERS.find((o) => o.id === id)?.minAmount || 1e6, (v) => engine.buyPersonalInvestment(id, v));
        break;
      case "sell-personal-investment":
        engine.sellPersonalInvestment(id);
        break;
      case "buy-luxury":
        engine.buyLuxury(id);
        break;
      case "sell-luxury":
        engine.sellLuxury(id);
        break;
      case "buy-team-personal":
        engine.buySportsTeam(id, "personal");
        break;
      case "buy-team-company":
        engine.buySportsTeam(id, "company");
        break;
      case "sell-team":
        engine.sellSportsTeam(id);
        break;
      case "borrow-company":
        askMoney("\u4F1A\u793E\u501F\u5165", 1e7, (v) => engine.borrow(v, "company"));
        break;
      case "repay-company":
        askMoney("\u4F1A\u793E\u8FD4\u6E08", Math.min(engine.g.companyDebt, 1e7), (v) => engine.repay(v, "company"));
        break;
      case "borrow-personal":
        askMoney("\u500B\u4EBA\u501F\u5165", 5e6, (v) => engine.borrow(v, "personal"));
        break;
      case "repay-personal":
        askMoney("\u500B\u4EBA\u8FD4\u6E08", Math.min(engine.g.personalDebt, 5e6), (v) => engine.repay(v, "personal"));
        break;
      case "save-now":
        engine.save();
        toast("\u4FDD\u5B58\u3057\u307E\u3057\u305F\u3002", "success");
        break;
      case "save-slot":
        engine.save(id);
        toast(`\u30B9\u30ED\u30C3\u30C8${id}\u306B\u4FDD\u5B58\u3057\u307E\u3057\u305F\u3002`, "success");
        break;
      case "load-slot":
        if (engine.loadSlot(id)) toast(`\u30B9\u30ED\u30C3\u30C8${id}\u3092\u8AAD\u307F\u8FBC\u307F\u307E\u3057\u305F\u3002`, "success");
        else toast("\u30BB\u30FC\u30D6\u304C\u3042\u308A\u307E\u305B\u3093\u3002", "error");
        break;
      case "export-save": {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(engine.exportSave());
        a.download = `capitalism-tycoon-week-${engine.g.week}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1e3);
        break;
      }
      case "import-save":
        $("#import-file").click();
        break;
      case "reset-game":
        confirmModal("\u5B8C\u5168\u521D\u671F\u5316", "\u73FE\u5728\u306E\u9032\u884C\u72B6\u6CC1\u3092\u3059\u3079\u3066\u524A\u9664\u3057\u307E\u3059\u3002\u3053\u306E\u64CD\u4F5C\u306F\u53D6\u308A\u6D88\u305B\u307E\u305B\u3093\u3002", "confirm-reset");
        break;
      case "confirm-reset":
        closeModal();
        engine.reset();
        ui.showSetup = true;
        render();
        break;
      case "company-buyout":
        confirmModal("\u4F1A\u793E\u58F2\u5374", "\u4F1A\u793E\u3092\u58F2\u5374\u3059\u308B\u3068\u4E8B\u696D\u7D4C\u55B6\u306F\u7D42\u4E86\u3057\u3001\u500B\u4EBA\u8CC7\u7523\u30E2\u30FC\u30C9\u3078\u79FB\u884C\u3057\u307E\u3059\u3002", "confirm-buyout");
        break;
      case "confirm-buyout":
        engine.acceptBuyoutOffer(1.2);
        closeModal();
        break;
    }
  }
  app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (el && !el.disabled) action(el.dataset.action, el);
  });
  modalRoot.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (el) action(el.dataset.action, el);
    if (e.target.classList.contains("modal-backdrop")) closeModal();
  });
  app.addEventListener("change", (e) => {
    const bind = e.target.dataset.bind;
    if (bind) {
      ui[bind] = e.target.value;
      if (bind === "selectedPref") engine.g.selectedPref = e.target.value;
      if (bind === "selectedBusiness") engine.g.selectedBusiness = e.target.value;
      render();
    }
    const setting = e.target.dataset.setting;
    if (setting) {
      let v = e.target.type === "checkbox" ? e.target.checked : e.target.value;
      if (setting in engine.g) engine.g[setting] = v;
      else engine.g.settings[setting] = v;
      engine.save();
      render();
    }
  });
  app.addEventListener("submit", (e) => {
    if (e.target.id === "setup-form") {
      e.preventDefault();
      const fd = new FormData(e.target);
      ui.showSetup = false;
      engine.configure(Object.fromEntries(fd.entries()));
    }
  });
  app.addEventListener("change", async (e) => {
    if (e.target.id === "import-file" && e.target.files[0]) {
      try {
        engine.importSave(await e.target.files[0].text());
        toast("\u30BB\u30FC\u30D6\u3092\u8AAD\u307F\u8FBC\u307F\u307E\u3057\u305F\u3002", "success");
      } catch (err) {
        toast(err.message || "\u8AAD\u307F\u8FBC\u307F\u5931\u6557", "error");
      }
    }
  });
  engine.addEventListener("notify", (e) => toast(e.detail.message, e.detail.severity));
  engine.addEventListener("change", render);
  engine.addEventListener("week", (e) => {
    render();
    if (e.detail.summary) showWeeklySummary(e.detail.summary);
  });
  function drawLine(canvas, values) {
    if (!canvas || !values?.length) return;
    const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth || 600, h = Number(canvas.getAttribute("height")) || 160;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const c = canvas.getContext("2d");
    c.scale(dpr, dpr);
    c.clearRect(0, 0, w, h);
    const min = Math.min(...values), max = Math.max(...values), range = max - min || 1;
    c.strokeStyle = "rgba(255,255,255,.12)";
    c.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      c.beginPath();
      c.moveTo(0, h * i / 4);
      c.lineTo(w, h * i / 4);
      c.stroke();
    }
    c.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--gold").trim() || "#efb85b";
    c.lineWidth = 2;
    c.beginPath();
    values.forEach((v, i) => {
      const x = i / (values.length - 1 || 1) * (w - 12) + 6, y = h - 8 - (v - min) / range * (h - 20);
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    });
    c.stroke();
  }
  function drawCharts() {
    drawLine($("#home-chart"), engine.g.companyValueHistory.slice(-52));
    let vals = ui.reportMetric === "sales" ? engine.g.weeklySalesHistory : ui.reportMetric === "value" ? engine.g.companyValueHistory : ui.reportMetric === "networth" ? engine.g.personalNetWorthHistory : engine.g.weeklyProfitHistory;
    drawLine($("#report-chart"), vals.slice(-104));
  }
  window.addEventListener("resize", () => requestAnimationFrame(drawCharts));
