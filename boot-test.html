<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#08101f">
  <meta name="description" content="Capitalism Tycoon observer isolation boot test">
  <title>資本主義ポケット TYCOON 起動切り分け</title>
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/mobile-release.css">
  <link rel="stylesheet" href="./css/iphone-playtest-fixes.css">
  <style>
    #boot-test-status{position:fixed;z-index:2147483646;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));padding:8px 10px;border-radius:10px;background:#7c2d12;color:#fff;font:700 12px/1.35 -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.28);pointer-events:none}
    #boot-test-status.ok{background:#166534}
    #boot-test-status.error{background:#991b1b;pointer-events:auto;overflow-wrap:anywhere}
    body{padding-top:44px}
  </style>
  <script>
    (function(){
      'use strict';
      const SAVE_PREFIX='capitalism_tycoon_web';
      const report=(message,kind='')=>{
        const node=document.getElementById('boot-test-status');
        if(!node)return;
        node.textContent=message;
        node.className=kind;
      };
      window.__bootTestReport=report;

      // Keep this diagnostic page isolated from normal game saves.
      try{
        const proto=Storage.prototype;
        const getItem=proto.getItem,setItem=proto.setItem,removeItem=proto.removeItem;
        proto.getItem=function(key){return String(key||'').startsWith(SAVE_PREFIX)?null:getItem.call(this,key);};
        proto.setItem=function(key,value){if(String(key||'').startsWith(SAVE_PREFIX))return;return setItem.call(this,key,value);};
        proto.removeItem=function(key){if(String(key||'').startsWith(SAVE_PREFIX))return;return removeItem.call(this,key);};
      }catch(error){window.__bootTestStorageGuardError=error;}

      addEventListener('error',event=>{
        const source=event?.filename||event?.target?.src||event?.target?.href||'';
        const message=event?.message||'resource load error';
        report(`BOOT TEST ERROR: ${message}${source?` / ${source}`:''}`,'error');
      },true);
      addEventListener('unhandledrejection',event=>{
        const reason=event?.reason?.message||event?.reason||'unhandled rejection';
        report(`BOOT TEST REJECTION: ${reason}`,'error');
      });
    })();
  </script>
</head>
<body>
  <noscript>このゲームをプレイするにはJavaScriptを有効にしてください。</noscript>
  <div id="boot-test-status">BOOT TEST: コア起動中（通常セーブは読み書きしません）</div>
  <div id="app"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <!-- Core runtime and app dependencies only. Observer-based UI enhancer modules are intentionally omitted. -->
  <script src="./js/boot-recovery.js"></script>
  <script src="./js/runtime.js"></script>
  <script src="./js/data.js"></script>
  <script data-business-master-compat>(function(){'use strict';const m=globalThis.__capitalismTycoonModules?.data?.MASTER,b=m?.businesses;if(!Array.isArray(b))return;for(let i=b.length-1;i>=0;i--){const x=b[i];if(!x||typeof x.id!=='string'||!x.id.trim())b.splice(i,1)}})();</script>
  <script src="./js/workforce.js"></script>
  <script src="./js/supply.js"></script>
  <script src="./js/competitor.js"></script>
  <script src="./js/competitor-projects.js"></script>

  <script src="./js/finance.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/real-estate.js"></script>
  <script src="./js/save-v9.js"></script>
  <script src="./js/ma-integration.js"></script>
  <script src="./js/ma-deal-room.js"></script>
  <script src="./js/expansion.js"></script>
  <script src="./js/competitor-media.js"></script>
  <script src="./js/completion.js"></script>
  <script src="./js/parity.js"></script>
  <script src="./js/ceo-dashboard.js"></script>
  <script src="./js/executive-secretary.js"></script>
  <script src="./js/competitor-parity.js"></script>
  <script src="./js/competitor-dashboard.js"></script>
  <script src="./js/competitor-dashboard-status.js"></script>
  <script src="./js/player-engine-bridge.js"></script>
  <script src="./js/board-governance-resolution.js"></script>

  <script src="./js/ma-portfolio-summary.js"></script>

  <script>
    (function(){
      'use strict';
      const rendered=document.querySelector('#setup-form,#screen');
      if(rendered){
        window.__bootTestReport?.('BOOT TEST OK: コア画面の描画完了。後半UI拡張群は未読込です。','ok');
      }else{
        window.__bootTestReport?.('BOOT TEST ERROR: app.js到達後も画面要素が生成されませんでした。','error');
      }
    })();
  </script>
