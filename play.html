<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#08101f">
  <title>資本主義ポケット TYCOONを起動中</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#07101e;color:#f4f7fb}.launcher{width:min(480px,100%);padding:28px;border:1px solid rgba(255,255,255,.14);border-radius:22px;background:#101f36;text-align:center}.mark{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 18px;border-radius:18px;background:#efb85b;color:#07101e;font-size:40px;font-weight:900}h1{font-size:22px;margin:0 0 10px}p{color:#b9c7d8;line-height:1.7}.fallback{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:10px 18px;border-radius:12px;background:#efb85b;color:#07101e;font-weight:800;text-decoration:none}.error{color:#ffc3c8}
  </style>
</head>
<body>
  <main class="launcher" id="launcher">
    <div class="mark">¥</div>
    <h1>資本主義ポケット TYCOON</h1>
    <p id="launch-status">最新版を確認して起動しています…</p>
    <a class="fallback" id="launch-fallback" href="./">通常ページを開く</a>
  </main>
  <script>
  (function(){'use strict';
    const token=`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    const fallback=document.getElementById('launch-fallback');
    const fallbackUrl=new URL('./',location.href);fallbackUrl.searchParams.set('launch',token);fallback.href=fallbackUrl.toString();
    const indexUrl=new URL('./index.html',location.href);indexUrl.searchParams.set('launch',token);
    fetch(indexUrl,{cache:'no-store',credentials:'same-origin'})
      .then(response=>{if(!response.ok)throw new Error(`起動ページの取得に失敗しました (${response.status})`);return response.text();})
      .then(html=>{
        let fresh=html.replace(/\b(src|href)="(\.\/(?:js|css)\/[^"?]+)(?:\?[^"#]*)?"/g,(_,attribute,url)=>`${attribute}="${url}?launch=${encodeURIComponent(token)}"`);
        if(!fresh.includes('id="app"'))throw new Error('ゲーム画面の読み込みデータが不正です。');
        const saveV9=`<script src="./js/save-v9.js?launch=${encodeURIComponent(token)}"><\/script>`;
        const appBootstrap=`<script src="./js/app.js?launch=${encodeURIComponent(token)}"><\/script>`;
        const bootstrapAnchor=`<script src="./js/capital-allocation-policy.js?launch=${encodeURIComponent(token)}"><\/script>`;
        const prerequisitePaths=['difficulty-scenario-balance.js','player-crisis.js','player-crisis-actions.js','player-crisis-restructuring.js','player-crisis-creditor.js','player-debt-service.js'];
        const prerequisiteTags=prerequisitePaths.map(path=>`<script src="./js/${path}?launch=${encodeURIComponent(token)}"><\/script>`);
        if(prerequisiteTags.some(tag=>!fresh.includes(tag)))throw new Error('アプリ起動前の負債管理依存関係を確認できませんでした。');
        for(const tag of prerequisiteTags)fresh=fresh.replace(tag,'');
        const prerequisiteBlock=prerequisiteTags.join('');
        const queueBridge=`<script data-play-dynamic-script-queue>(function(){'use strict';const q=[],p=Node.prototype.appendChild,b=Node.prototype.insertBefore,a=Element.prototype.append,r=Element.prototype.prepend,targets=[document.head,document.body,document.documentElement].filter(Boolean),direct=targets.map(t=>({t,appendChild:t.appendChild,insertBefore:t.insertBefore,append:t.append,prepend:t.prepend}));function hold(n){return n&&n.tagName==='SCRIPT'&&n.src&&/\\/js\\//.test(n.src)}function queue(parent,n,before){if(!hold(n))return false;q.push({parent,node:n,before:before||null});return true}function installTarget(t){t.appendChild=function(n){if(queue(this,n,null))return n;return p.call(this,n)};t.insertBefore=function(n,ref){if(queue(this,n,ref))return n;return b.call(this,n,ref)};t.append=function(){const pass=[];for(const n of arguments){if(!queue(this,n,null))pass.push(n)}if(pass.length)return a.apply(this,pass)};t.prepend=function(){const pass=[];for(const n of arguments){if(!queue(this,n,this.firstChild))pass.push(n)}if(pass.length)return r.apply(this,pass)}}Node.prototype.appendChild=function(n){if(queue(this,n,null))return n;return p.call(this,n)};Node.prototype.insertBefore=function(n,ref){if(queue(this,n,ref))return n;return b.call(this,n,ref)};Element.prototype.append=function(){const pass=[];for(const n of arguments){if(!queue(this,n,null))pass.push(n)}if(pass.length)return a.apply(this,pass)};Element.prototype.prepend=function(){const pass=[];for(const n of arguments){if(!queue(this,n,this.firstChild))pass.push(n)}if(pass.length)return r.apply(this,pass)};for(const t of targets)installTarget(t);globalThis.__ctFlushDynamicScripts=function(){Node.prototype.appendChild=p;Node.prototype.insertBefore=b;Element.prototype.append=a;Element.prototype.prepend=r;for(const x of direct){x.t.appendChild=x.appendChild;x.t.insertBefore=x.insertBefore;x.t.append=x.append;x.t.prepend=x.prepend}let chain=Promise.resolve();for(const item of q){chain=chain.then(()=>new Promise((resolve,reject)=>{const n=item.node,ok=n.onload,fail=n.onerror;n.async=false;n.onload=function(e){try{ok&&ok.call(this,e)}finally{resolve()}};n.onerror=function(e){try{fail&&fail.call(this,e)}finally{reject(new Error('動的モジュールの読み込みに失敗しました: '+(n.src||'unknown')))}};if(item.before&&item.before.parentNode===item.parent)b.call(item.parent,n,item.before);else p.call(item.parent,n)}))}return chain};})();<\/script>`;
        const flushBridge=`<script data-play-dynamic-script-flush>globalThis.__ctFlushDynamicScripts?.().catch(error=>setTimeout(()=>{throw error},0));<\/script>`;
        if(!fresh.includes(appBootstrap)||!fresh.includes(bootstrapAnchor))throw new Error('アプリ起動依存関係を確認できませんでした。');
        fresh=fresh.replace(appBootstrap,`${prerequisiteBlock}${queueBridge}${appBootstrap}`).replace(bootstrapAnchor,`${bootstrapAnchor}${flushBridge}`);
        fresh=fresh
          .replace(saveV9,`${saveV9}<script src="./js/save-storage.js?launch=${encodeURIComponent(token)}"><\/script>`)
          .replace('</head>',`<link rel="stylesheet" href="./css/iphone-playtest-fixes.css?launch=${encodeURIComponent(token)}"></head>`)
          .replace('</body>',`<script src="./js/play-runtime-compat.js?launch=${encodeURIComponent(token)}"><\/script><script src="./js/save-storage-ui.js?launch=${encodeURIComponent(token)}"><\/script><script src="./js/physical-iphone-playtest.js?launch=${encodeURIComponent(token)}"><\/script><script src="./js/iphone-playtest-fixes.js?launch=${encodeURIComponent(token)}"><\/script></body>`);
        if(!fresh.includes('./js/save-storage.js?launch='))throw new Error('セーブ容量保護モジュールを起動順へ追加できませんでした。');
        if(!fresh.includes('./js/physical-iphone-playtest.js?launch='))throw new Error('物理iPhone試しプレイ機能を起動順へ追加できませんでした。');
        if(fresh.indexOf(prerequisiteBlock)>fresh.indexOf(appBootstrap)||fresh.indexOf(queueBridge)>fresh.indexOf(appBootstrap)||fresh.indexOf(flushBridge)<fresh.indexOf(bootstrapAnchor))throw new Error('動的モジュールの起動順を構成できませんでした。');
        document.open();document.write(fresh);document.close();
      })
      .catch(error=>{
        const status=document.getElementById('launch-status');
        if(status){status.className='error';status.textContent=`自動起動に失敗しました。下のボタンから再度開いてください。 ${error.message||error}`;}
      });
  })();
  </script>
</body>
</html>
