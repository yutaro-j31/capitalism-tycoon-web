<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="theme-color" content="#08101f"><title>資本主義ポケット TYCOONを起動中</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07101e;color:#f4f7fb}.launcher{padding:28px;text-align:center}a{display:inline-flex;min-height:46px;align-items:center;padding:10px 18px;border-radius:12px;background:#efb85b;color:#07101e;font-weight:800;text-decoration:none}</style></head><body><main class="launcher"><h1>資本主義ポケット TYCOON</h1><p>最新版へ移動しています…</p><a id="fallback" href="./index.html">ゲームを開く</a></main><script>(function(){'use strict';const current=new URL(location.href),target=new URL('./index.html',location.href),existing=current.searchParams.get('launch'),token=existing||`${Date.now().toString(36)}-${globalThis.crypto?.randomUUID?.()||'launch'}`;target.searchParams.set('launch',token);document.getElementById('fallback').href=target.toString();location.replace(target.toString());})();</script></body></html>
