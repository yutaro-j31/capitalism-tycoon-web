name: Hall Of Fame Generations
on:
  pull_request:
    paths:
      - 'js/hall-of-fame-generations.js'
      - 'js/pmi-100-day-loader.js'
      - 'tests/hall-of-fame-generations-test.js'
      - '.github/workflows/hall-of-fame-generations.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check js/hall-of-fame-generations.js
      - run: node tests/hall-of-fame-generations-test.js
      - run: npm run test:static
      - name: Production wiring
        run: |
          grep -q 'hall-of-fame-generations.js' js/pmi-100-day-loader.js
          grep -q 'hallOfFameGenerations' js/pmi-100-day-loader.js