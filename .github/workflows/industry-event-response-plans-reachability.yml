name: Industry Event Response Plan Reachability
on:
  pull_request:
    paths:
      - js/industry-event-response-plans.js
      - js/industry-specific-events.js
      - js/engine.js
      - js/finance.js
      - tests/industry-event-response-plans-reachability-test.js
      - tests/run-all.js
      - tests/run-all-shards.json
      - .github/workflows/industry-event-response-plans-reachability.yml
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/industry-event-response-plans-reachability-test.js
