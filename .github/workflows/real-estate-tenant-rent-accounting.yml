name: Real Estate Tenant Rent Accounting
on:
  pull_request:
    paths:
      - 'js/real-estate-tenant-contracts.js'
      - 'tests/real-estate-tenant-contracts-test.js'
      - 'docs/audits/tenant-rent-accounting-invariants.md'
      - '.github/workflows/real-estate-tenant-rent-accounting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/real-estate-tenant-contracts-test.js
