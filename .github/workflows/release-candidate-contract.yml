name: Release Candidate Contract

on:
  pull_request:
    paths:
      - 'release-*.json'
      - 'docs/**'
      - 'scripts/release-*.js'
      - 'tests/release-candidate-*.js'
      - 'js/engine.js'
      - 'js/finance.js'
      - 'js/save*.js'
      - 'js/*normalize*.js'
      - 'index.html'
      - 'package.json'
      - 'tests/harness.js'
      - 'tests/run-all.js'
      - '.github/workflows/release-candidate-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release candidate metadata and compatibility
        run: node tests/release-candidate-contract-test.js
