name: Founding Tutorial

on:
  push:
    branches: [ main ]
    paths:
      - 'js/founding-tutorial.js'
      - 'js/app.js'
      - 'js/ceo-dashboard.js'
      - 'index.html'
      - 'css/app.css'
      - 'tests/founding-tutorial-test.js'
      - 'tests/founding-tutorial-ui-test.js'
      - 'tests/founding-tutorial-webkit-test.js'
      - 'tests/published-founding-tutorial-webkit-test.js'
      - 'tests/founding-tutorial-workflow-test.js'
      - 'tests/pages-deployment-smoke-test.js'
      - '.github/workflows/iphone-webkit-smoke.yml'
      - '.github/workflows/pages-deployment-smoke.yml'
      - 'tests/fixtures/extracted-css-baseline.css'
      - 'package.json'
      - 'tests/run-all.js'
      - '.github/workflows/founding-tutorial.yml'
  pull_request:
    paths:
      - 'js/founding-tutorial.js'
      - 'js/app.js'
      - 'js/ceo-dashboard.js'
      - 'index.html'
      - 'css/app.css'
      - 'tests/founding-tutorial-test.js'
      - 'tests/founding-tutorial-ui-test.js'
      - 'tests/founding-tutorial-webkit-test.js'
      - 'tests/published-founding-tutorial-webkit-test.js'
      - 'tests/founding-tutorial-workflow-test.js'
      - 'tests/pages-deployment-smoke-test.js'
      - '.github/workflows/iphone-webkit-smoke.yml'
      - '.github/workflows/pages-deployment-smoke.yml'
      - 'tests/fixtures/extracted-css-baseline.css'
      - 'package.json'
      - 'tests/run-all.js'
      - '.github/workflows/founding-tutorial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  founding-tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FOUNDING_TUTORIAL_ARTIFACT_DIR: artifacts/founding-tutorial-webkit
      SAVE_KEY: capitalism_tycoon_web_v1
      SAVE_VERSION: '9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run founding tutorial model and UI gates
        run: npm run test:founding-tutorial
      - name: Run related regression gates
        run: |
          npm run test:ceo-dashboard
          npm run test:weekly-impact
          npm run test:syntax
          npm run test:javascript
          npm run test:modules
          npm run test:static
          npm run test:css
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Verify founding tutorial in iPhone WebKit
        run: node tests/founding-tutorial-webkit-test.js
      - name: Retain founding tutorial WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founding-tutorial-webkit-${{ github.sha }}
          path: artifacts/founding-tutorial-webkit
          if-no-files-found: error
          retention-days: 30
