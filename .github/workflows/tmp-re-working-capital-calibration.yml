name: Temporary RE Working Capital Calibration

on:
  push:
    branches:
      - tmp/founding-re-financing-calibration

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        principal: [2000000, 3000000]
        grace: [0, 8, 12, 16, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure RE principal grace candidate
        env:
          WORKING_CAPITAL: ${{ matrix.principal }}
          PRINCIPAL_GRACE_WEEKS: ${{ matrix.grace }}
        run: node tests/tmp-re-working-capital-calibration.js
