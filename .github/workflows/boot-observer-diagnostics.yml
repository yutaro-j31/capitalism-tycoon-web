name: Boot Observer Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boot-observer-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOOT_DIAGNOSTICS_ARTIFACT_DIR: artifacts/boot-observer-diagnostics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Measure observer and microtask boot activity
        timeout-minutes: 12
        run: node tests/boot-observer-diagnostics-test.js
      - name: Retain boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-observer-diagnostics-${{ github.sha }}
          path: artifacts/boot-observer-diagnostics
          if-no-files-found: error
          retention-days: 30
