name: Progression Balance
on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'js/**'
      - 'index.html'
      - 'package.json'
      - 'tests/harness.js'
      - 'tests/run-all.js'
      - 'tests/strategy-balance-runner.js'
      - 'tests/normal-start-ipo-balance-audit-test.js'
      - 'tests/**/*progression*'
      - 'tests/v1-progression-gate-test.js'
      - '.github/workflows/progression-balance.yml'
jobs:
  normal-start-ipo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:progression-balance
