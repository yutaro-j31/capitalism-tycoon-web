name: Subsidiary IPO Preparation

on:
  pull_request:
    paths:
      - 'js/subsidiary-ipo-preparation.js'
      - 'tests/subsidiary-ipo-preparation-test.js'
      - '.github/workflows/subsidiary-ipo-preparation.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/subsidiary-ipo-preparation.js
      - run: node tests/subsidiary-ipo-preparation-test.js
