name: Real Estate Safety Certification

on:
  pull_request:
    paths:
      - 'js/real-estate-safety-certification.js'
      - 'js/real-estate-risk-mitigation.js'
      - 'js/real-estate-insurance-risk.js'
      - 'js/real-estate-ui.js'
      - 'tests/real-estate-safety-certification-test.js'
      - '.github/workflows/real-estate-safety-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run safety certification regression
        run: node tests/real-estate-safety-certification-test.js
      - name: Run mitigation regression
        run: node tests/real-estate-risk-mitigation-test.js
      - name: Run insurance risk regression
        run: node tests/real-estate-insurance-risk-test.js
      - name: Run insurance claims regression
        run: node tests/real-estate-insurance-claims-test.js
      - name: Run transaction safety regression
        run: node tests/week-test.js
