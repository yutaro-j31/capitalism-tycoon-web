name: Run All Gap Audit
on:
  pull_request:
    paths:
      - '.github/workflows/run-all-gap-audit.yml'
      - 'tests/**'
      - 'js/**'
      - 'index.html'
      - 'package.json'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute tests omitted from Test workflow
        shell: bash
        run: |
          mkdir -p run-all-gap-logs
          overall=0
          set +e
          commands=(
            'npm run test:store-weekly-integer-yen --silent'
            'npm run test:vertical-integration-determinism --silent'
            'npm run test:ceo-dashboard --silent'
            'npm run test:ma-acquisition-financing --silent'
            'npm run test:weekly-impact --silent'
            'npm run test:founding-tutorial --silent'
            'npm run test:ma-deal-room --silent'
            'npm run test:ma-integration --silent'
            'npm run test:ma-portfolio-summary --silent'
            'npm run test:ma-portfolio-summary-ui --silent'
            'npm run test:ma-board-approval --silent'
            'node tests/save-storage-quota-test.js'
            'node tests/save-storage-recovery-actions-test.js'
            'node tests/d-ui-context-tabs-test.js'
            'node tests/shareholder-activism-test.js'
            'node tests/capital-allocation-recovery-target-selector-test.js'
            'node tests/capital-allocation-management-guide-test.js'
            'node tests/capital-allocation-section-nav-test.js'
            'node tests/ma-exit-readiness-test.js'
            'node tests/internal-venture-business-test.js'
            'node tests/subsidiary-ipo-preparation-test.js'
            'node tests/listed-subsidiary-market-test.js'
            'node tests/listed-subsidiary-portfolio-dashboard-test.js'
            'node tests/listed-subsidiary-control-actions-test.js'
            'node tests/subsidiary-integration-synergy-test.js'
            'node tests/inter-subsidiary-synergy-allocation-test.js'
            'node tests/inter-subsidiary-synergy-performance-test.js'
            'node tests/group-capital-allocation-actions-test.js'
            'node tests/group-restructuring-candidates-test.js'
            'node tests/group-restructuring-progress-test.js'
            'node tests/subsidiary-relisting-options-test.js'
            'node tests/listed-subsidiary-follow-on-offering-test.js'
            'node tests/executive-secretary-test.js'
            'node tests/executive-secretary-ui-test.js'
            'node tests/executive-secretary-purity-test.js'
          )
          index=0
          for command in "${commands[@]}"; do
            index=$((index+1))
            name="$(printf '%02d' "$index")-$(echo "$command" | tr ' /:' '---' | tr -cd '[:alnum:]_.-')"
            bash -lc "$command" > "run-all-gap-logs/${name}.log" 2>&1
            status=$?
            echo "$status" > "run-all-gap-logs/${name}.status"
            printf '%s\t%s\t%s\n' "$status" "$name" "$command" >> run-all-gap-logs/summary.tsv
            if [ "$status" -ne 0 ]; then overall=1; fi
          done
          echo "$overall" > run-all-gap-logs/overall.status
          exit 0
      - name: Print audit summary
        if: always()
        run: |
          cat run-all-gap-logs/summary.tsv
          for status in run-all-gap-logs/*.status; do
            if [ "$(cat "$status")" != "0" ]; then
              log="${status%.status}.log"
              echo "===== FAILURE: $(basename "$log") ====="
              cat "$log"
            fi
          done
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-all-gap-audit
          path: run-all-gap-logs
          retention-days: 14
      - name: Enforce audit
        run: test "$(cat run-all-gap-logs/overall.status)" = "0"
