name: Group Restructuring Candidates

on:
  pull_request:
    paths:
      - 'js/group-restructuring-candidates.js'
      - 'tests/group-restructuring-candidates-test.js'
      - 'play.html'
      - 'tests/run-all.js'
      - '.github/workflows/group-restructuring-candidates.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/group-restructuring-candidates.js
      - run: node tests/group-restructuring-candidates-test.js
