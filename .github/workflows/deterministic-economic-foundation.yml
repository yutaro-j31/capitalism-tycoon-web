name: Deterministic Economic Foundation
on:
  pull_request:
    paths:
      - 'js/deterministic-economic-foundation.js'
      - 'js/pmi-100-day-loader.js'
      - 'tests/deterministic-economic-foundation-test.js'
      - '.github/workflows/deterministic-economic-foundation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check js/deterministic-economic-foundation.js
      - run: node tests/deterministic-economic-foundation-test.js
      - run: npm run test:static
      - name: Production wiring
        run: |
          grep -q 'deterministic-economic-foundation.js' js/pmi-100-day-loader.js
          grep -q 'deterministicEconomicFoundation' js/pmi-100-day-loader.js
