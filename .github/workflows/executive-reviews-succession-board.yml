name: Executive Reviews Succession Board
on:
  pull_request:
    paths:
      - 'js/executive-reviews-succession-board.js'
      - 'index.html'
      - 'tests/executive-reviews-succession-board-test.js'
      - '.github/workflows/executive-reviews-succession-board.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check js/executive-reviews-succession-board.js
      - run: node tests/executive-reviews-succession-board-test.js
      - run: npm run test:static
      - name: Production wiring
        run: grep -q 'js/executive-reviews-succession-board.js' index.html
