name: Temporary Conveni Scale Revalidation

on:
  push:
    branches:
      - tmp/conveni-scale-revalidation

jobs:
  cap-matrix:
    strategy:
      fail-fast: false
      matrix:
        cap: [0.13, 0.14]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate 500-week standard expansion by procurement cap
        env:
          SEED: 190826041
          HORIZON: 500
          CAP: ${{ matrix.cap }}
        run: node tests/tmp-conveni-procurement-cap-matrix.js
