name: New Business Commercialization
on:
  pull_request:
    paths:
      - 'js/new-business-commercialization.js'
      - 'index.html'
      - 'tests/new-business-commercialization-test.js'
      - '.github/workflows/new-business-commercialization.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check js/new-business-commercialization.js
      - run: node tests/new-business-commercialization-test.js
      - run: npm run test:static
      - name: Production wiring
        run: grep -q 'js/new-business-commercialization.js' index.html
