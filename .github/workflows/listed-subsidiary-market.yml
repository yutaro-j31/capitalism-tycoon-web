name: Listed Subsidiary Market

on:
  pull_request:
    paths:
      - 'js/listed-subsidiary-market.js'
      - 'js/subsidiary-ipo-preparation.js'
      - 'index.html'
      - 'tests/listed-subsidiary-market-test.js'
      - 'tests/run-all.js'
      - '.github/workflows/listed-subsidiary-market.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/listed-subsidiary-market.js
      - run: node tests/listed-subsidiary-market-test.js
