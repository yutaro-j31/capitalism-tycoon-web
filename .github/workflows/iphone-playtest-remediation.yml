name: iPhone Playtest Remediation
on:
  pull_request:
    paths:
      - 'play.html'
      - 'js/iphone-playtest-fixes.js'
      - 'css/iphone-playtest-fixes.css'
      - 'tests/iphone-playtest-remediation-test.js'
      - 'tests/iphone-playtest-webkit-test.js'
      - '.github/workflows/iphone-playtest-remediation.yml'
  push:
    branches: [main]
    paths:
      - 'play.html'
      - 'js/iphone-playtest-fixes.js'
      - 'css/iphone-playtest-fixes.css'
      - 'tests/iphone-playtest-remediation-test.js'
      - 'tests/iphone-playtest-webkit-test.js'
      - '.github/workflows/iphone-playtest-remediation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and static contract
        run: |
          node --check js/iphone-playtest-fixes.js
          node --check tests/iphone-playtest-webkit-test.js
          node tests/iphone-playtest-remediation-test.js
      - name: Save and accounting regressions
        run: |
          npm run test:save-v9
          npm run test:finance
          npm run test:supply
          npm run test:player-crisis-ui
          npm run test:static
      - name: Install pinned Playwright WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.61.0
          npx playwright install --with-deps webkit
      - name: Exercise physical-playtest workflows in WebKit
        shell: bash
        run: |
          mkdir -p artifacts/iphone-playtest-remediation
          set -o pipefail
          node tests/iphone-playtest-webkit-test.js 2>&1 | tee artifacts/iphone-playtest-remediation/webkit.log
      - name: Retain iPhone remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-playtest-remediation-${{ github.sha }}
          path: artifacts/iphone-playtest-remediation
          if-no-files-found: warn
          retention-days: 14
