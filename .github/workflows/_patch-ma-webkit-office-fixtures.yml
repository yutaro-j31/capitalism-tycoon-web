name: Patch M&A WebKit office fixture
on:
  push:
    branches:
      - feature/founding-routes-complete-v2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/founding-routes-complete-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch exact stale WebKit fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/ma-deal-room-webkit-test.js')
          if not p.exists(): raise SystemExit('ma-deal-room-webkit-test.js missing')
          t=p.read_text()
          old="e.g.selectedTab='ma';e.g.companyCash=2_000_000_000;e.g.departments.investment={name:'投資部',established:true};"
          new="e.g.selectedTab='ma';e.g.companyCash=2_000_000_000;e.g.hasHeadOffice=true;e.g.departments.investment={name:'投資部',established:true};"
          if t.count(old)!=1: raise SystemExit(f'expected one stale fixture marker, got {t.count(old)}')
          p.write_text(t.replace(old,new,1))
          PY
          node tests/syntax-check.js
          node tests/static-check.js
      - name: Commit fixture and self-remove
        shell: bash
        run: |
          rm -f .github/workflows/_patch-ma-webkit-office-fixtures.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          python - <<'PY'
          import subprocess
          got=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().split())
          expected={'.github/workflows/_patch-ma-webkit-office-fixtures.yml','tests/ma-deal-room-webkit-test.js'}
          if got!=expected: raise SystemExit(f'unexpected staged paths: {sorted(got)}')
          PY
          git commit -m 'test: align M&A WebKit fixture with office capability gate'
          git push origin HEAD:feature/founding-routes-complete-v2
