name: Temporary Founding Gym Calibration

on:
  push:
    branches:
      - tmp/founding-gym-calibration

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        price: ['7800','9000','10000','11000','12000']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure mature single-store gym economics
        env:
          GYM_PRICE: ${{ matrix.price }}
        run: node tests/tmp-founding-gym-economics.js
