name: Subsidiary Budget KPI

on:
  pull_request:
    paths:
      - 'js/subsidiary-budget-kpi.js'
      - 'js/pmi-100-day-loader.js'
      - 'tests/subsidiary-budget-kpi-test.js'
      - '.github/workflows/subsidiary-budget-kpi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subsidiary-budget-kpi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/subsidiary-budget-kpi.js
      - run: node tests/subsidiary-budget-kpi-test.js
      - run: node tests/group-holding-governance-test.js
      - run: npm run test:static --silent
      - name: Verify production wiring
        run: |
          grep -q 'subsidiary-budget-kpi.js' js/pmi-100-day-loader.js
          grep -q 'subsidiaryBudgetKpi' js/pmi-100-day-loader.js