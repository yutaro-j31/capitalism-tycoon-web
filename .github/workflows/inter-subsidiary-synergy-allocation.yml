name: Inter Subsidiary Synergy Allocation

on:
  pull_request:
    paths:
      - 'js/inter-subsidiary-synergy-allocation.js'
      - 'tests/inter-subsidiary-synergy-allocation-test.js'
      - 'play.html'
      - 'tests/run-all.js'
      - '.github/workflows/inter-subsidiary-synergy-allocation.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/inter-subsidiary-synergy-allocation.js
      - run: node tests/inter-subsidiary-synergy-allocation-test.js
