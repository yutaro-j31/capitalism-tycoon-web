name: Stage 1 Integer Yen Patcher PR

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved patch
        run: python scripts/apply-stage1-integer-yen-patch.py
      - name: Verify focused regression
        run: npm run test:store-weekly-integer-yen
      - name: Commit generated patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/engine.js tests/store-weekly-integer-yen-test.js tests/supply-long-run-test.js tests/run-all.js package.json
          git commit -m "fix: integerize store weekly cash postings [stage1-applied]"
          git push origin HEAD:${{ github.head_ref }}
