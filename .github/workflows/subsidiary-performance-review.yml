name: Subsidiary Performance Review

on:
  pull_request:
    paths:
      - 'js/subsidiary-performance-review.js'
      - 'js/pmi-100-day-loader.js'
      - 'tests/subsidiary-performance-review-test.js'
      - '.github/workflows/subsidiary-performance-review.yml'
  workflow_dispatch:

jobs:
  subsidiary-performance-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: node --check js/subsidiary-performance-review.js
      - name: Run subsidiary performance review tests
        run: node tests/subsidiary-performance-review-test.js
      - name: Run subsidiary budget KPI regression
        run: node tests/subsidiary-budget-kpi-test.js
      - name: Run group holding governance regression
        run: node tests/group-holding-governance-test.js
      - name: Validate static safety
        run: npm run test:static
      - name: Validate production wiring
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('js/pmi-100-day-loader.js','utf8');
          if(!source.includes('subsidiary-performance-review.js')) throw new Error('performance review module is not wired');
          if(!source.includes('subsidiaryPerformanceReview')) throw new Error('performance review fail-closed contract is missing');
          NODE