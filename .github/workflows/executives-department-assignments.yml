name: Executives Department Assignments
on:
  pull_request:
    paths:
      - 'js/executives-department-assignments.js'
      - 'js/pmi-100-day-loader.js'
      - 'tests/executives-department-assignments-test.js'
      - '.github/workflows/executives-department-assignments.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check js/executives-department-assignments.js
      - run: node tests/executives-department-assignments-test.js
      - run: npm run test:static
      - name: Production wiring
        run: |
          grep -q 'executives-department-assignments.js' js/pmi-100-day-loader.js
          grep -q 'executivesDepartmentAssignments' js/pmi-100-day-loader.js