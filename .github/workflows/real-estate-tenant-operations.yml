name: Real Estate Tenant Operations

on:
  pull_request:
    paths:
      - 'js/real-estate-tenant-operations.js'
      - 'js/real-estate-tenant-leasing.js'
      - 'js/real-estate-ui.js'
      - 'tests/real-estate-tenant-operations-test.js'
      - '.github/workflows/real-estate-tenant-operations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tenant operations regression
        run: node tests/real-estate-tenant-operations-test.js
      - name: Run tenant leasing regression
        run: node tests/real-estate-tenant-leasing-test.js
      - name: Run tenant contracts regression
        run: node tests/real-estate-tenant-contracts-test.js
      - name: Run insurance risk regression
        run: node tests/real-estate-insurance-risk-test.js
      - name: Run transaction safety regression
        run: node tests/week-test.js