name: RC Manual Smoke Gate

on:
  pull_request:
    paths:
      - 'release-candidate.json'
      - 'index.html'
      - 'play.html'
      - 'js/**'
      - 'tests/rc-manual-smoke-gate-test.js'
      - 'tests/harness.js'
      - '.github/workflows/rc-manual-smoke-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate RC save and progression smoke path
        run: node tests/rc-manual-smoke-gate-test.js
      - name: Validate save, week and static regressions
        run: |
          npm run test:save-v9 --silent
          npm run test:week --silent
          npm run test:load --silent
          npm run test:static --silent
