name: Listed Subsidiary Control Actions

on:
  pull_request:
    paths:
      - 'js/listed-subsidiary-control-actions.js'
      - 'tests/listed-subsidiary-control-actions-test.js'
      - '.github/workflows/listed-subsidiary-control-actions.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/listed-subsidiary-control-actions.js
      - run: node tests/listed-subsidiary-control-actions-test.js
