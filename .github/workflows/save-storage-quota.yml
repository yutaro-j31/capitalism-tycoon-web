name: Save Storage Quota
on:
  pull_request:
    paths:
      - 'play.html'
      - 'js/save-storage.js'
      - 'tests/save-storage-quota-test.js'
      - 'tests/run-all.js'
      - '.github/workflows/save-storage-quota.yml'
  push:
    branches: [main]
    paths:
      - 'play.html'
      - 'js/save-storage.js'
      - 'tests/save-storage-quota-test.js'
      - 'tests/run-all.js'
      - '.github/workflows/save-storage-quota.yml'
permissions:
  contents: read
jobs:
  quota-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and quota regression
        run: |
          node --check js/save-storage.js
          node --check tests/save-storage-quota-test.js
          node tests/save-storage-quota-test.js
      - name: Save and accounting regressions
        run: |
          npm run test:save-v9
          npm run test:finance
          npm run test:finance-archive-rollforward
          npm run test:static
