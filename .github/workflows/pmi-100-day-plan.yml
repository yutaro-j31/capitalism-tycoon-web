name: PMI 100 Day Plan

on:
  pull_request:
    paths:
      - 'js/pmi-100-day-plan.js'
      - 'js/pmi-long-run-guard.js'
      - 'js/pmi-100-day-loader.js'
      - 'tests/pmi-100-day-plan-test.js'
      - 'play.html'
      - '.github/workflows/pmi-100-day-plan.yml'
  workflow_dispatch:

jobs:
  pmi-100-day-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/pmi-100-day-plan.js
      - run: node --check js/pmi-long-run-guard.js
      - run: node --check js/pmi-100-day-loader.js
      - name: Run PMI lifecycle tests
        id: pmi
        continue-on-error: true
        run: node tests/pmi-100-day-plan-test.js > pmi-test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmi-100-day-plan-diagnostics
          path: pmi-test.log
      - name: Enforce PMI lifecycle tests
        if: ${{ steps.pmi.outcome != 'success' }}
        run: |
          cat pmi-test.log
          exit 1
      - run: node tests/ma-integration-test.js
      - run: node tests/finance-ma-accounting-test.js
      - run: node tests/save-v9-migration-test.js
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const play=fs.readFileSync('play.html','utf8');
          if(!play.includes('./js/pmi-100-day-loader.js?launch='))throw new Error('PMI production wiring missing');
          if(!play.includes('追加資本政策モジュールを公開起動順へ追加できませんでした'))throw new Error('existing fail-closed contract missing');
          if(Buffer.byteLength(play)>7000)throw new Error(`play.html exceeds 7KB contract: ${Buffer.byteLength(play)}`);
          NODE
