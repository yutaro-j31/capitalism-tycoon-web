name: PMI 100 Day Plan

on:
  pull_request:
    paths:
      - 'js/pmi-100-day-plan.js'
      - 'js/pmi-long-run-guard.js'
      - 'js/pmi-100-day-loader.js'
      - 'tests/pmi-100-day-plan-test.js'
      - 'index.html'
      - 'play.html'
      - '.github/workflows/pmi-100-day-plan.yml'
  workflow_dispatch:

jobs:
  pmi-100-day-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/pmi-100-day-plan.js
      - run: node --check js/pmi-long-run-guard.js
      - run: node --check js/pmi-100-day-loader.js
      - name: Run PMI lifecycle tests
        id: pmi
        continue-on-error: true
        run: node tests/pmi-100-day-plan-test.js > pmi-test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmi-100-day-plan-diagnostics
          path: pmi-test.log
      - name: Enforce PMI lifecycle tests
        if: ${{ steps.pmi.outcome != 'success' }}
        run: |
          cat pmi-test.log
          exit 1
      - run: node tests/ma-integration-test.js
      - run: node tests/finance-ma-accounting-test.js
      - run: node tests/save-v9-migration-test.js
      - name: Verify direct production wiring
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('index.html','utf8');
          const play=fs.readFileSync('play.html','utf8');
          const loader=fs.readFileSync('js/pmi-100-day-loader.js','utf8');
          const plan='./js/pmi-100-day-plan.js';
          const guard='./js/pmi-long-run-guard.js';
          const compatibility='./js/pmi-100-day-loader.js';
          const planAt=index.indexOf(plan);
          const guardAt=index.indexOf(guard);
          const loaderAt=index.indexOf(compatibility);
          if(planAt<0||guardAt<0||loaderAt<0)throw new Error('PMI direct production wiring missing from index.html');
          if(!(planAt<guardAt&&guardAt<loaderAt))throw new Error('PMI production load order is invalid');
          if(/document\.write\s*\(/.test(loader))throw new Error('PMI compatibility loader must remain side-effect free');
          if(!loader.includes('dynamic document.write loading is intentionally unnecessary'))throw new Error('PMI compatibility-boundary rationale missing');
          if(!play.includes("new URL('./index.html',location.href)"))throw new Error('play.html must redirect to index.html');
          if(Buffer.byteLength(play)>3000)throw new Error(`play.html exceeds redirect launcher contract: ${Buffer.byteLength(play)}`);
          NODE
