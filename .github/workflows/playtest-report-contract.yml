name: Playtest Report Contract

on:
  pull_request:
    paths:
      - 'js/playtest-report*.js'
      - 'js/engine.js'
      - 'js/finance.js'
      - 'js/save*.js'
      - 'js/*normalize*.js'
      - 'index.html'
      - 'play.html'
      - 'package.json'
      - 'tests/harness.js'
      - 'tests/run-all.js'
      - 'tests/playtest-report-*.js'
      - 'tests/static-check.js'
      - '.github/workflows/playtest-report-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playtest-report-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playtest-report-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify privacy-safe playtest report
        shell: bash
        run: |
          mkdir -p artifacts/playtest-report-contract
          set +e
          node tests/playtest-report-ui-test.js > artifacts/playtest-report-contract/unit.log 2>&1
          STATUS=$?
          cat artifacts/playtest-report-contract/unit.log
          exit "$STATUS"
      - name: Verify static and module integration
        shell: bash
        run: |
          set +e
          node tests/static-check.js > artifacts/playtest-report-contract/static.log 2>&1
          STATUS=$?
          cat artifacts/playtest-report-contract/static.log
          exit "$STATUS"
      - name: Retain playtest report contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-report-contract-${{ github.sha }}
          path: artifacts/playtest-report-contract
          if-no-files-found: error
          retention-days: 14
