name: Strategy Balance
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'js/**'
      - 'index.html'
      - 'package.json'
      - 'tests/harness.js'
      - 'tests/run-all.js'
      - 'tests/strategy-balance-runner.js'
      - 'tests/strategy-balance-matrix-test.js'
      - 'tests/strategy-balance-pr-smoke-test.js'
      - 'tests/**/*strategy*'
      - '.github/workflows/strategy-balance.yml'
jobs:
  strategy-balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:strategy-balance
