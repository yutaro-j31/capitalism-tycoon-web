name: Shareholder Activism Incidence

on:
  pull_request:
    paths:
      - 'js/shareholder-activism.js'
      - 'js/shareholder-returns.js'
      - 'tests/shareholder-activism-incidence-matrix-test.js'
      - 'tests/strategy-balance-runner.js'
      - 'tests/run-all.js'
      - 'tests/run-all-shards.json'
      - '.github/workflows/shareholder-activism-incidence.yml'
  workflow_dispatch:

jobs:
  incidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/shareholder-activism-incidence-matrix-test.js
