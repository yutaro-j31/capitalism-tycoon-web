name: Convertible Bonds Dilution
on:
  pull_request:
    paths:
      - 'js/convertible-bonds-dilution.js'
      - 'js/pmi-100-day-loader.js'
      - 'tests/convertible-bonds-dilution-test.js'
      - '.github/workflows/convertible-bonds-dilution.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check js/convertible-bonds-dilution.js
      - run: node tests/convertible-bonds-dilution-test.js
      - run: npm run test:static
      - name: Production wiring
        run: |
          grep -q 'convertible-bonds-dilution.js' js/pmi-100-day-loader.js
          grep -q 'convertibleBondsDilution' js/pmi-100-day-loader.js
