name: Group Holding Governance

on:
  pull_request:
    paths:
      - 'js/group-holding-governance.js'
      - 'index.html'
      - 'tests/group-holding-governance-test.js'
      - '.github/workflows/group-holding-governance.yml'
  workflow_dispatch:

jobs:
  group-holding-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/group-holding-governance.js
      - run: node tests/group-holding-governance-test.js
      - run: node tests/pmi-100-day-plan-test.js
      - run: npm run test:static --silent
      - name: Production wiring
        run: grep -q 'js/group-holding-governance.js' index.html
