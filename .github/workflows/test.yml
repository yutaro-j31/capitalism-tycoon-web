name: Test
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  competitor-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/competitor-price-ai-test.js
      - run: node tests/competitor-marketing-ai-test.js
      - run: node tests/competitor-quality-ai-test.js
      - run: node tests/competitor-capacity-test.js
      - run: node tests/competitor-public-signal-test.js
      - run: node tests/competitor-rivalry-ai-test.js
      - run: node tests/competitor-strategic-ai-test.js
      - name: Run competitor distress lifecycle regression
        shell: bash
        run: |
          set +e
          node tests/competitor-distress-lifecycle-test.js > competitor-distress.log 2>&1
          echo $? > competitor-distress.status
          exit 0
      - name: Retain competitor distress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-distress-regression
          path: |
            competitor-distress.log
            competitor-distress.status
          retention-days: 14
      - name: Enforce competitor distress lifecycle regression
        shell: bash
        run: |
          cat competitor-distress.log
          test "$(cat competitor-distress.status)" = "0"
  product-innovation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:product-innovation
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:syntax
      - run: npm run test:static
      - run: npm run test:save
      - run: npm run test:migration
      - run: npm run test:save-v9
      - run: npm run test:player-crisis
      - run: npm run test:player-crisis-actions
      - run: npm run test:player-crisis-ui
      - run: npm run test:player-crisis-restructuring
      - run: npm run test:player-crisis-restructuring-ui
      - run: node tests/player-debt-service-hook-test.js
      - run: npm run test:player-turnaround-plan
      - run: npm run test:load
      - run: npm run test:week
      - run: npm run test:transaction
      - run: npm run test:long
      - run: npm run test:css
      - run: npm run test:javascript
      - run: npm run test:modules
      - name: Run capital allocation regressions
        run: |
          node tests/treasury-prepayment-test.js
          node tests/treasury-refinancing-policy-test.js
          node tests/shareholder-returns-test.js
          node tests/capital-allocation-score-test.js
