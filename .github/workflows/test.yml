name: Test
on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: release-readiness
        options:
          - release-readiness
          - iphone-webkit
          - iphone-acceptance
          - phase0.5-nightly
          - phase0.5-deep-audit
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  competitor-ai:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/competitor-price-ai-test.js
      - run: node tests/competitor-marketing-ai-test.js
      - run: node tests/competitor-quality-ai-test.js
      - run: node tests/competitor-capacity-test.js
      - run: node tests/competitor-public-signal-test.js
      - run: node tests/competitor-rivalry-ai-test.js
      - run: node tests/competitor-strategic-ai-test.js
      - name: Run competitor distress lifecycle regression
        shell: bash
        run: |
          set +e
          node tests/competitor-distress-lifecycle-test.js > competitor-distress.log 2>&1
          echo $? > competitor-distress.status
          exit 0
      - name: Retain competitor distress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-distress-regression
          path: |
            competitor-distress.log
            competitor-distress.status
          retention-days: 14
      - name: Enforce competitor distress lifecycle regression
        shell: bash
        run: |
          cat competitor-distress.log
          test "$(cat competitor-distress.status)" = "0"
  product-innovation:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:product-innovation
  capital-allocation:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all capital allocation regressions
        shell: bash
        run: |
          mkdir -p capital-allocation-logs
          overall=0
          set +e
          for file in \
            tests/treasury-prepayment-test.js \
            tests/treasury-refinancing-policy-test.js \
            tests/shareholder-returns-test.js \
            tests/capital-allocation-score-test.js \
            tests/capital-allocation-policy-test.js \
            tests/capital-allocation-comparison-test.js \
            tests/capital-allocation-actions-test.js \
            tests/capital-allocation-breakdown-test.js \
            tests/capital-allocation-recovery-test.js \
            tests/capital-allocation-decision-memo-test.js \
            tests/capital-allocation-stress-test-test.js \
            tests/capital-allocation-resilience-memo-test.js \
            tests/capital-allocation-recovery-audit-test.js \
            tests/capital-allocation-recovery-funding-test.js \
            tests/capital-allocation-recovery-funding-options-test.js \
            tests/capital-allocation-recovery-funding-readiness-test.js \
            tests/capital-allocation-recovery-funding-reconciliation-test.js \
            tests/capital-allocation-recovery-funding-outcome-test.js \
            tests/capital-allocation-recovery-save-reload-test.js \
            tests/capital-allocation-production-wiring-test.js
          do
            name="$(basename "$file" .js)"
            node "$file" > "capital-allocation-logs/${name}.log" 2>&1
            status=$?
            echo "$status" > "capital-allocation-logs/${name}.status"
            if [ "$status" -ne 0 ]; then overall=1; fi
          done
          echo "$overall" > capital-allocation-logs/overall.status
          exit 0
      - name: Retain capital allocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capital-allocation-regressions
          path: capital-allocation-logs
          retention-days: 14
      - name: Enforce capital allocation regressions
        shell: bash
        run: |
          for log in capital-allocation-logs/*.log; do
            echo "===== $(basename "$log") ====="
            cat "$log"
          done
          test "$(cat capital-allocation-logs/overall.status)" = "0"
  test-shard-contract:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every canonical entry belongs to exactly one shard
        env:
          TEST_SHARD: A
          TEST_SHARD_CONTRACT: '1'
        run: node tests/run-all-shard.js
      - name: Verify the shard matrix covers every configured shard
        run: node tests/shard-matrix-contract.js
      - name: Verify byte-exact diagnostic output retention
        run: node scripts/parallel-shard-runner-process-diagnostic.js --self-test
      - name: Verify every browser-installing job is time-bounded
        run: node tests/workflow-browser-timeout-contract.js
      - name: Verify per-command write observation coverage
        run: node scripts/parallel-shard-write-observation.cjs
      - name: Verify optional shard write audit controls
        run: node scripts/parallel-shard-write-audit-test.cjs
      - name: Validate offline K evidence audit controls
        run: node scripts/parallel-shard-k-evidence-audit-test.cjs
      - name: Validate read-only CI timing analysis
        run: node scripts/parallel-shard-ci-timing-test.cjs
  test-shards:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: test-shard-${{ matrix.shard }}
    needs: test-shard-contract
    runs-on: ubuntu-latest
    # Measured on slow runners (#1178, #1180, #1181): shards B and K spent 1764.7-1787.5 s in tests, so a 30-minute job
    # was cancelled at 30:04; the same shards finish in about 17 minutes on fast runners. 40 keeps that variance inside
    # the budget without removing or skipping any test.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [A, B, C, D, E, F, G, H, I, J, K, L]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record runner resources (parallel pilot shards)
        if: matrix.shard == 'J' || matrix.shard == 'C'
        run: |
          echo "nproc: $(nproc)"
          free -m
          grep -m1 'model name' /proc/cpuinfo || true
          echo "cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a)"
          echo "memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
      - name: Run canonical test shard ${{ matrix.shard }}
        env:
          TEST_SHARD: ${{ matrix.shard }}
          # Serial unless the repository variable TEST_SHARD_PARALLELISM_J / _C is set; only shards J and C can use it (docs/parallel-shard-rollback.md).
          TEST_SHARD_PARALLELISM: ${{ matrix.shard == 'J' && (vars.TEST_SHARD_PARALLELISM_J || '1') || matrix.shard == 'C' && (vars.TEST_SHARD_PARALLELISM_C || '1') || '1' }}
          TEST_SHARD_PARALLEL_REPORT: artifacts/shard-parallel/${{ matrix.shard }}.json
        run: node tests/run-all-shard.js
      - name: Upload parallel shard report
        if: always() && ((matrix.shard == 'J' && vars.TEST_SHARD_PARALLELISM_J != '') || (matrix.shard == 'C' && vars.TEST_SHARD_PARALLELISM_C != ''))
        uses: actions/upload-artifact@v4
        with:
          name: shard-parallel-report-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/shard-parallel
          if-no-files-found: ignore
          retention-days: 14
  test:
    name: test
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
    needs: [test-shard-contract, test-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all canonical shards
        shell: bash
        run: |
          test "${{ needs.test-shard-contract.result }}" = "success"
          test "${{ needs.test-shards.result }}" = "success"
  phase0-5-acceptance:
    name: Phase 0.5 Acceptance Smoke
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fail-closed Phase 0.5 acceptance gate
        env:
          SOURCE_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node scripts/phase0-5-acceptance.js --tier smoke --source-main-sha "$SOURCE_MAIN_SHA"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-5-acceptance-${{ github.sha }}
          path: artifacts/phase0-5-acceptance
          if-no-files-found: error
          retention-days: 14
  phase0-5-extended-acceptance:
    name: Phase 0.5 Extended Acceptance
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'phase0.5-nightly' || inputs.mode == 'phase0.5-deep-audit'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run extended acceptance matrix
        env:
          SOURCE_MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ "${{ inputs.mode }}" = "phase0.5-deep-audit" ]; then
            node scripts/phase0-5-acceptance.js --tier deepAudit --seeds 83951617,83951618,83951619,83951620,83951621,83951622,83951623,83951624
          else
            node scripts/phase0-5-acceptance.js --tier nightly --seeds 83951617,83951618,83951619,83951620
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-5-extended-acceptance-${{ github.sha }}
          path: artifacts/phase0-5-acceptance
          if-no-files-found: error
          retention-days: 30
  release-readiness:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release-readiness')
    permissions:
      contents: read
    concurrency:
      group: release-readiness-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare release readiness diagnostics
        run: mkdir -p artifacts/release-readiness

      - name: Run release balance gate
        shell: bash
        run: |
          set -o pipefail
          node scripts/release-gate.js 2>&1 | tee artifacts/release-readiness/balance.log

      - name: Run release hardening gate
        shell: bash
        run: |
          set -o pipefail
          node scripts/release-hardening-gate.js 2>&1 | tee artifacts/release-readiness/hardening.log

      - name: Run release delivery gate
        shell: bash
        run: |
          set -o pipefail
          node scripts/release-delivery-gate.js 2>&1 | tee artifacts/release-readiness/delivery.log

      - name: Upload release readiness diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness-${{ github.sha }}
          path: artifacts/release-readiness
          if-no-files-found: error
          retention-days: 7
  iphone-acceptance-playthrough:
    name: iPhone Acceptance Playthrough
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'iphone-acceptance')
    permissions:
      contents: read
    concurrency:
      group: iphone-acceptance-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IPHONE_ACCEPTANCE_ARTIFACT_DIR: artifacts/iphone-acceptance
      D_UI_ARTIFACT_DIR: artifacts/iphone-acceptance/pe
      MA_DEAL_ROOM_ARTIFACT_DIR: artifacts/iphone-acceptance/ma-deal-room
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        # Bounded retry: the install has stalled for the whole job budget several times (CLAUDE.md §7);
        # healthy installs have taken up to ~9 minutes, so each attempt gets 12 and the job budget fits two.
        run: |
          # apt mirrors have stalled mid-download: retry stalled connections instead of waiting forever.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
          for attempt in 1 2; do
            timeout --kill-after=30s 12m npx playwright install --with-deps webkit && exit 0
            echo "::warning::WebKit install attempt $attempt failed or stalled"
            # timeout kills npx, not the apt-get it started as root; free the dpkg lock before retrying.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=10s 2m dpkg --configure -a || true
            # A crawling Azure apt mirror is what stalls the install; retry against archive.ubuntu.com.
            sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          done
          exit 1
      - name: Validate iPhone acceptance scripts
        run: |
          node --check tests/iphone-full-acceptance-webkit-test.js
          node --check tests/iphone-baseline-probe-webkit-test.js
          node --check tests/pe-ui-screen-ownership-webkit-test.js
          node --check tests/ma-deal-room-webkit-test.js
      - name: Play every primary game screen in iPhone WebKit
        timeout-minutes: 5
        run: node tests/iphone-full-acceptance-webkit-test.js
      - name: Verify City Lab production map and financial UI
        timeout-minutes: 5
        env:
          CITY_LAB_ARTIFACT_DIR: artifacts/iphone-acceptance/city-lab
        run: node tests/city-lab-port-webkit-test.js
      - name: Verify iPhone playtest controls in City Lab and Canvas2D fallback
        timeout-minutes: 3
        run: node tests/iphone-playtest-webkit-test.js
      - name: Verify Gate C lifecycle probe in iPhone WebKit
        timeout-minutes: 3
        run: node tests/iphone-baseline-probe-webkit-test.js
      - name: Exercise PE ownership and management screens
        timeout-minutes: 3
        run: node tests/pe-ui-screen-ownership-webkit-test.js
      - name: Exercise M&A deal-room flow
        timeout-minutes: 5
        run: node tests/ma-deal-room-webkit-test.js
      - name: Retain iPhone acceptance screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-acceptance-${{ github.sha }}
          path: |
            artifacts/iphone-acceptance
            artifacts/iphone-baseline-probe
          if-no-files-found: error
          retention-days: 30

  iphone-webkit-smoke:
    name: iPhone WebKit Smoke
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'iphone-webkit')
    permissions:
      contents: read
    concurrency:
      group: iphone-webkit-smoke-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/iphone-webkit-smoke
      GAME_OVER_SETTINGS_ARTIFACT_DIR: artifacts/game-over-settings-webkit
      D_UI_ARTIFACT_DIR: artifacts/d-ui-webkit
      CEO_DASHBOARD_ARTIFACT_DIR: artifacts/ceo-dashboard-webkit
      FOUNDING_TUTORIAL_ARTIFACT_DIR: artifacts/founding-tutorial-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        # Bounded retry: the install has stalled for the whole job budget several times (CLAUDE.md §7);
        # healthy installs have taken up to ~9 minutes, so each attempt gets 12 and the job budget fits two.
        run: |
          # apt mirrors have stalled mid-download: retry stalled connections instead of waiting forever.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
          for attempt in 1 2; do
            timeout --kill-after=30s 12m npx playwright install --with-deps webkit && exit 0
            echo "::warning::WebKit install attempt $attempt failed or stalled"
            # timeout kills npx, not the apt-get it started as root; free the dpkg lock before retrying.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=10s 2m dpkg --configure -a || true
            # A crawling Azure apt mirror is what stalls the install; retry against archive.ubuntu.com.
            sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          done
          exit 1
      - name: Validate consolidated iPhone contracts
        run: |
          node --check js/play-runtime-compat.js
          node --check js/iphone-playtest-fixes.js
          node --check js/physical-iphone-playtest.js
          node --check tests/iphone-playtest-webkit-test.js
          node tests/iphone-playtest-remediation-test.js
      - name: Exercise iPhone playtest remediation in WebKit
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p artifacts/iphone-playtest-remediation
          set -o pipefail
          node tests/iphone-playtest-webkit-test.js 2>&1 | tee artifacts/iphone-playtest-remediation/webkit.log
      - name: Verify toast and fixed navigation geometry in WebKit
        timeout-minutes: 2
        run: node tests/iphone-toast-visible-nav-webkit-test.js
      - name: Validate physical iPhone playtest checklist
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p artifacts/physical-iphone-playtest
          set -o pipefail
          node tests/physical-iphone-playtest-test.js 2>&1 | tee artifacts/physical-iphone-playtest/physical-iphone-test.log
      - name: Run iPhone WebKit release smoke
        timeout-minutes: 3
        run: node tests/iphone-webkit-smoke-test.js
      - name: Verify CEO dashboard on iPhone
        timeout-minutes: 2
        run: node tests/ceo-dashboard-webkit-test.js
      - name: Verify founding tutorial on iPhone
        timeout-minutes: 2
        run: node tests/founding-tutorial-webkit-test.js
      - name: Verify D UI desktop and iPhone layouts
        timeout-minutes: 2
        run: node tests/d-ui-webkit-test.js
      - name: Verify PE screen ownership in WebKit
        timeout-minutes: 2
        run: node tests/pe-ui-screen-ownership-webkit-test.js
      - name: Verify recovery funding workflow on iPhone
        timeout-minutes: 2
        run: node tests/capital-allocation-recovery-webkit-test.js
      - name: Verify recovery funding outcome on iPhone
        timeout-minutes: 2
        run: node tests/capital-allocation-recovery-outcome-webkit-test.js
      - name: Verify bankruptcy settings recovery
        timeout-minutes: 2
        run: node tests/game-over-settings-webkit-test.js
      - name: Verify two-store first-week advance
        timeout-minutes: 2
        run: node tests/two-store-iphone-webkit-test.js
      - name: Verify release diagnostics recovery
        timeout-minutes: 2
        run: node tests/release-diagnostics-webkit-test.js
      - name: Verify playtest report download
        timeout-minutes: 2
        run: node tests/playtest-report-webkit-test.js
      - name: Verify boot failure recovery
        timeout-minutes: 2
        run: node tests/boot-recovery-webkit-test.js
      - name: Verify newest save copy boots
        timeout-minutes: 3
        run: node tests/save-newest-copy-boot-webkit-test.js
      - name: Verify uncaught runtime recovery
        timeout-minutes: 2
        run: node tests/runtime-recovery-webkit-test.js
      - name: Retain WebKit smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-webkit-smoke-${{ github.sha }}
          path: |
            artifacts/iphone-webkit-smoke
            artifacts/game-over-settings-webkit
            artifacts/d-ui-webkit
            artifacts/ceo-dashboard-webkit
            artifacts/founding-tutorial-webkit
            artifacts/iphone-playtest-remediation
            artifacts/iphone-toast-visible-nav
            artifacts/physical-iphone-playtest
          if-no-files-found: error
          retention-days: 30

  parallel-process-diagnostic:
    name: Parallel process diagnostic (Node ${{ matrix.node }})
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/parallel-shard-process-diagnostic'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Record Linux runtime identity
        run: |
          node --version
          nproc
          free -m
          uname -a
      - name: Reproduce and classify process groups
        run: node scripts/parallel-shard-runner-process-diagnostic.js --report artifacts/process-diagnostic/node-${{ matrix.node }}.json
      - name: Existing runner process integrity regression
        run: node tests/parallel-shard-runner-test.js
      - name: Checkout exact E HEAD for full reproduction
        uses: actions/checkout@v4
        with:
          ref: 20dcfe71a3fc5e8ad662c8f8497fac1120162ae1
          path: diagnostic-e-source
          persist-credentials: false
      - name: Compare all 33 E commands serial and parallel two
        run: >-
          node scripts/parallel-shard-runner-process-diagnostic.js --full-e
          --root diagnostic-e-source --source-sha 20dcfe71a3fc5e8ad662c8f8497fac1120162ae1
          --report artifacts/process-diagnostic/full-e-node-${{ matrix.node }}.json
      - name: Retain process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-diagnostic-node-${{ matrix.node }}-${{ github.run_id }}
          path: artifacts/process-diagnostic/
          if-no-files-found: error
          retention-days: 14


  parallel-k-diagnostic:
    name: K parallel diagnostic (Node ${{ matrix.node }})
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/shard-k-parallel-diagnostic'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Record K host resources
        run: |
          node --version
          nproc
          free -m
          uname -a
      - name: Diagnose process controls
        run: node scripts/parallel-shard-runner-process-diagnostic.js --report artifacts/k-diagnostic/controls-node-${{ matrix.node }}.json
      - name: Existing process integrity regression
        run: node tests/parallel-shard-runner-test.js
      - name: Checkout pinned K source
        uses: actions/checkout@v4
        with:
          ref: 165d924423f1e4bde8be8c801c28b15bbac76e72
          path: diagnostic-k-source
          persist-credentials: false
      - name: Compare all 29 K commands serial, parallel two and four
        run: >-
          node scripts/parallel-shard-runner-process-diagnostic.js --full-shard K
          --root diagnostic-k-source --source-sha 165d924423f1e4bde8be8c801c28b15bbac76e72
          --report artifacts/k-diagnostic/full-k-node-${{ matrix.node }}.json
      - name: Retain K diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k-diagnostic-node-${{ matrix.node }}-${{ github.run_id }}
          path: artifacts/k-diagnostic/
          if-no-files-found: error
          retention-days: 14

  parallel-k-write-observation:
    name: K write observation (Node ${{ matrix.node }})
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/k-source-freshness'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Record K host resources
        run: |
          node --version
          nproc
          free -m
          uname -a
      - name: Diagnose process controls
        run: node scripts/parallel-shard-runner-process-diagnostic.js --report artifacts/k-write-observation/controls-node-${{ matrix.node }}.json
      - name: Validate write observation controls
        run: node scripts/parallel-shard-write-observation.cjs
      - name: Existing process integrity regression
        run: node tests/parallel-shard-runner-test.js
      - name: Checkout pinned K source
        uses: actions/checkout@v4
        with:
          ref: 9223004d0bd2e9b0ebb435edf599d01b72020fd0
          path: diagnostic-k-source
          persist-credentials: false
      - name: Compare K clean reference and audited serial, two and four
        run: >-
          node scripts/parallel-shard-runner-process-diagnostic.js --full-shard K
          --root diagnostic-k-source --source-sha 9223004d0bd2e9b0ebb435edf599d01b72020fd0
          --retain-output --write-audit-root artifacts/k-write-observation/audit-node-${{ matrix.node }}
          --report artifacts/k-write-observation/full-k-node-${{ matrix.node }}.json
      - name: Retain K diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k-write-observation-node-${{ matrix.node }}-${{ github.run_id }}
          path: artifacts/k-write-observation/
          if-no-files-found: error
          retention-days: 14

  parallel-c-process-evidence:
    name: C process evidence (Node ${{ matrix.node }})
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/shard-c-process-evidence'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
