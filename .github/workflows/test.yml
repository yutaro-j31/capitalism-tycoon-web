name: Test
on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: release-readiness
        options:
          - release-readiness
          - iphone-webkit
jobs:
  competitor-ai:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/competitor-price-ai-test.js
      - run: node tests/competitor-marketing-ai-test.js
      - run: node tests/competitor-quality-ai-test.js
      - run: node tests/competitor-capacity-test.js
      - run: node tests/competitor-public-signal-test.js
      - run: node tests/competitor-rivalry-ai-test.js
      - run: node tests/competitor-strategic-ai-test.js
      - name: Run competitor distress lifecycle regression
        shell: bash
        run: |
          set +e
          node tests/competitor-distress-lifecycle-test.js > competitor-distress.log 2>&1
          echo $? > competitor-distress.status
          exit 0
      - name: Retain competitor distress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-distress-regression
          path: |
            competitor-distress.log
            competitor-distress.status
          retention-days: 14
      - name: Enforce competitor distress lifecycle regression
        shell: bash
        run: |
          cat competitor-distress.log
          test "$(cat competitor-distress.status)" = "0"
  product-innovation:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:product-innovation
  capital-allocation:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all capital allocation regressions
        shell: bash
        run: |
          mkdir -p capital-allocation-logs
          overall=0
          set +e
          for file in \
            tests/treasury-prepayment-test.js \
            tests/treasury-refinancing-policy-test.js \
            tests/shareholder-returns-test.js \
            tests/capital-allocation-score-test.js \
            tests/capital-allocation-policy-test.js \
            tests/capital-allocation-comparison-test.js \
            tests/capital-allocation-actions-test.js \
            tests/capital-allocation-breakdown-test.js \
            tests/capital-allocation-recovery-test.js \
            tests/capital-allocation-decision-memo-test.js \
            tests/capital-allocation-stress-test-test.js \
            tests/capital-allocation-resilience-memo-test.js \
            tests/capital-allocation-recovery-audit-test.js \
            tests/capital-allocation-recovery-funding-test.js \
            tests/capital-allocation-recovery-funding-options-test.js \
            tests/capital-allocation-recovery-funding-readiness-test.js \
            tests/capital-allocation-recovery-funding-reconciliation-test.js \
            tests/capital-allocation-recovery-funding-outcome-test.js \
            tests/capital-allocation-recovery-save-reload-test.js \
            tests/capital-allocation-production-wiring-test.js
          do
            name="$(basename "$file" .js)"
            node "$file" > "capital-allocation-logs/${name}.log" 2>&1
            status=$?
            echo "$status" > "capital-allocation-logs/${name}.status"
            if [ "$status" -ne 0 ]; then overall=1; fi
          done
          echo "$overall" > capital-allocation-logs/overall.status
          exit 0
      - name: Retain capital allocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capital-allocation-regressions
          path: capital-allocation-logs
          retention-days: 14
      - name: Enforce capital allocation regressions
        shell: bash
        run: |
          for log in capital-allocation-logs/*.log; do
            echo "===== $(basename "$log") ====="
            cat "$log"
          done
          test "$(cat capital-allocation-logs/overall.status)" = "0"
  test-shard-contract:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every canonical entry belongs to exactly one shard
        env:
          TEST_SHARD: A
          TEST_SHARD_CONTRACT: '1'
        run: node tests/run-all-shard.js
      - name: Verify the shard matrix covers every configured shard
        run: node tests/shard-matrix-contract.js
      - name: Verify every browser-installing job is time-bounded
        run: node tests/workflow-browser-timeout-contract.js
  test-shards:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: test-shard-${{ matrix.shard }}
    needs: test-shard-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [A, B, C, D, E, F, G, H]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run canonical test shard ${{ matrix.shard }}
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: node tests/run-all-shard.js
  test:
    name: test
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
    needs: [test-shard-contract, test-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all canonical shards
        shell: bash
        run: |
          test "${{ needs.test-shard-contract.result }}" = "success"
          test "${{ needs.test-shards.result }}" = "success"
  release-readiness:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release-readiness')
    permissions:
      contents: read
    concurrency:
      group: release-readiness-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare release readiness diagnostics
        run: mkdir -p artifacts/release-readiness

      - name: Run release balance gate
        shell: bash
        run: |
          set -o pipefail
          node scripts/release-gate.js 2>&1 | tee artifacts/release-readiness/balance.log

      - name: Run release hardening gate
        shell: bash
        run: |
          set -o pipefail
          node scripts/release-hardening-gate.js 2>&1 | tee artifacts/release-readiness/hardening.log

      - name: Run release delivery gate
        shell: bash
        run: |
          set -o pipefail
          node scripts/release-delivery-gate.js 2>&1 | tee artifacts/release-readiness/delivery.log

      - name: Upload release readiness diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness-${{ github.sha }}
          path: artifacts/release-readiness
          if-no-files-found: error
          retention-days: 7
  iphone-webkit-smoke:
    name: iPhone WebKit Smoke
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'iphone-webkit')
    permissions:
      contents: read
    concurrency:
      group: iphone-webkit-smoke-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/iphone-webkit-smoke
      GAME_OVER_SETTINGS_ARTIFACT_DIR: artifacts/game-over-settings-webkit
      D_UI_ARTIFACT_DIR: artifacts/d-ui-webkit
      CEO_DASHBOARD_ARTIFACT_DIR: artifacts/ceo-dashboard-webkit
      FOUNDING_TUTORIAL_ARTIFACT_DIR: artifacts/founding-tutorial-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Validate consolidated iPhone contracts
        run: |
          node --check js/play-runtime-compat.js
          node --check js/iphone-playtest-fixes.js
          node --check js/physical-iphone-playtest.js
          node --check tests/iphone-playtest-webkit-test.js
          node tests/iphone-playtest-remediation-test.js
      - name: Exercise iPhone playtest remediation in WebKit
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p artifacts/iphone-playtest-remediation
          set -o pipefail
          node tests/iphone-playtest-webkit-test.js 2>&1 | tee artifacts/iphone-playtest-remediation/webkit.log
      - name: Validate physical iPhone playtest checklist
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p artifacts/physical-iphone-playtest
          set -o pipefail
          node tests/physical-iphone-playtest-test.js 2>&1 | tee artifacts/physical-iphone-playtest/physical-iphone-test.log
      - name: Run iPhone WebKit release smoke
        timeout-minutes: 3
        run: node tests/iphone-webkit-smoke-test.js
      - name: Verify CEO dashboard on iPhone
        timeout-minutes: 2
        run: node tests/ceo-dashboard-webkit-test.js
      - name: Verify founding tutorial on iPhone
        timeout-minutes: 2
        run: node tests/founding-tutorial-webkit-test.js
      - name: Verify D UI desktop and iPhone layouts
        timeout-minutes: 2
        run: node tests/d-ui-webkit-test.js
      - name: Verify recovery funding workflow on iPhone
        timeout-minutes: 2
        run: node tests/capital-allocation-recovery-webkit-test.js
      - name: Verify recovery funding outcome on iPhone
        timeout-minutes: 2
        run: node tests/capital-allocation-recovery-outcome-webkit-test.js
      - name: Verify bankruptcy settings recovery
        timeout-minutes: 2
        run: node tests/game-over-settings-webkit-test.js
      - name: Verify two-store first-week advance
        timeout-minutes: 2
        run: node tests/two-store-iphone-webkit-test.js
      - name: Verify release diagnostics recovery
        timeout-minutes: 2
        run: node tests/release-diagnostics-webkit-test.js
      - name: Verify playtest report download
        timeout-minutes: 2
        run: node tests/playtest-report-webkit-test.js
      - name: Verify boot failure recovery
        timeout-minutes: 2
        run: node tests/boot-recovery-webkit-test.js
      - name: Verify uncaught runtime recovery
        timeout-minutes: 2
        run: node tests/runtime-recovery-webkit-test.js
      - name: Retain WebKit smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-webkit-smoke-${{ github.sha }}
          path: |
            artifacts/iphone-webkit-smoke
            artifacts/game-over-settings-webkit
            artifacts/d-ui-webkit
            artifacts/ceo-dashboard-webkit
            artifacts/founding-tutorial-webkit
            artifacts/iphone-playtest-remediation
            artifacts/physical-iphone-playtest
          if-no-files-found: error
          retention-days: 30
