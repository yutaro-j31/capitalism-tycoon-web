          node-version: ${{ matrix.node }}
      - name: Record C host resources
        run: |
          node --version
          nproc
          free -m
          uname -a
      - name: Process identity and cleanup controls
        run: node scripts/parallel-shard-runner-process-diagnostic.js --report artifacts/c-process/controls-node-${{ matrix.node }}.json
      - name: Existing process integrity regression
        run: node tests/parallel-shard-runner-test.js
      - name: Checkout pinned C source
        uses: actions/checkout@v4
        with:
          ref: d10a971eb99fb4111fd3a169ba9c34ccb7a81971
          path: diagnostic-c-source
          persist-credentials: false
      - name: Compare all 25 C commands and retain final groups
        run: >-
          node scripts/parallel-shard-runner-process-diagnostic.js --full-shard C
          --root diagnostic-c-source --source-sha d10a971eb99fb4111fd3a169ba9c34ccb7a81971
