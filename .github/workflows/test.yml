name: Test
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose supply exception recovery
        run: node tests/week-distress-diagnostic.js supply
      - name: Diagnose completion exception recovery
        run: node tests/week-distress-diagnostic.js completion
      - name: Diagnose parity exception recovery
        run: node tests/week-distress-diagnostic.js parity
      - name: Diagnose first normal week
        run: node tests/week-distress-diagnostic.js first
      - name: Diagnose distress validator
        run: node tests/week-distress-diagnostic.js distressValidator
      - name: Diagnose full competitor validator
        run: node tests/week-distress-diagnostic.js fullValidator
      - name: Diagnose 52-week progression
        id: week_long
        continue-on-error: true
        run: node tests/week-distress-diagnostic.js long > week-distress-diagnostic.log 2>&1
      - name: Upload week diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-distress-diagnostic
          path: week-distress-diagnostic.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce week diagnostic
        if: steps.week_long.outcome == 'failure'
        run: exit 1
      - name: Diagnose save round trip
        run: node tests/week-distress-diagnostic.js roundtrip
      - name: Diagnose legacy load
        run: node tests/week-distress-diagnostic.js legacy
      - run: npm run test:week
      - run: npm run test:syntax
      - run: npm run test:static
      - run: npm run test:save
      - run: npm run test:migration
      - run: npm run test:save-v9
      - run: npm run test:load
      - run: npm run test:transaction
      - run: npm run test:long
      - run: npm run test:css
      - run: npm run test:javascript
      - run: npm run test:modules
      - run: npm run test:stock

      - run: npm run test:market
      - run: npm run test:market-migration
      - run: npm run test:market-ui
      - run: npm run test:market-capacity
      - run: npm run test:market-cannibalization
      - run: npm run test:market-calibration
      - run: npm run test:market-order
      - run: npm run test:market-opening
      - run: npm run test:market-rng

      - run: npm run test:finance
      - run: npm run test:statements
      - run: npm run test:cashflow
      - run: npm run test:working-capital
      - run: npm run test:finance-migration
      - run: npm run test:finance-ui
      - run: npm run test:accounting-invariants
      - run: npm run test:finance-advanced
