name: Temporary exact canonical fixture update
on:
  push:
    branches:
      - fix/canonical-suite-reds
permissions:
  contents: write
jobs:
  update-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-suite-reds
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild reviewed fixture exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tests/fixtures/transaction-baseline-v1.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          removed=0
          for snapshot in data.values():
              rows=snapshot.get('businesses') if isinstance(snapshot,dict) else None
              if not isinstance(rows,list):
                  continue
              kept=[]
              for row in rows:
                  if isinstance(row,dict) and (not isinstance(row.get('id'),str) or not row.get('id')):
                      removed+=1
                      continue
                  kept.append(row)
              snapshot['businesses']=kept
          if removed != 4:
              raise SystemExit(f'expected to remove 4 invalid businesses, got {removed}')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          actual="$(git hash-object tests/fixtures/transaction-baseline-v1.json)"
          expected="c24e95d8ee1572cb625f9eef236a7593c4870319"
          echo "fixture blob: $actual"
          test "$actual" = "$expected"
          rm .github/workflows/tmp-canonical-fixture-exact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/fixtures/transaction-baseline-v1.json .github/workflows/tmp-canonical-fixture-exact.yml
          git commit -m "Fix canonical transaction baseline fixture"
          git push origin HEAD:fix/canonical-suite-reds
