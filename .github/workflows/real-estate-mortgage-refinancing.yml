name: Real Estate Mortgage Refinancing
on:
  pull_request:
    paths:
      - 'js/real-estate-mortgage-refinancing.js'
      - 'js/real-estate-mortgage-refinancing-ui.js'
      - 'js/real-estate-property-taxes.js'
      - 'tests/real-estate-mortgage-refinancing-test.js'
      - '.github/workflows/real-estate-mortgage-refinancing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/real-estate-mortgage-refinancing-test.js