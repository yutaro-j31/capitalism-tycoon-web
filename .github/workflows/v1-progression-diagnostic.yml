name: V1 Progression Diagnostic
on:
  pull_request:
  push:
    branches: [ chatgpt/v1-progression-gate ]
jobs:
  progression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture progression output
        run: node tests/v1-progression-gate-test.js > progression.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: v1-progression-diagnostic
          path: progression.log
