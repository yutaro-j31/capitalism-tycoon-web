name: V1 Progression Diagnostic
on:
  pull_request:
  push:
    branches: [ chatgpt/v1-progression-gate ]
jobs:
  progression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/v1-progression-gate-test.js
