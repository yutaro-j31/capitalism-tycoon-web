name: Creditor Diagnostic
on:
  pull_request:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture creditor test output
        shell: bash
        run: |
          set +e
          node tests/player-crisis-creditor-negotiation-test.js > creditor-diagnostic.txt 2>&1
          status=$?
          echo "exit_status=$status" >> creditor-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: creditor-diagnostic
          path: creditor-diagnostic.txt
