name: Recovery Target Selector

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: recovery-target-selector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  target-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify transient recovery target selection
        run: node tests/capital-allocation-recovery-target-selector-test.js
