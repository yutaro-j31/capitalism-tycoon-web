name: Phase 6B-2 Diagnostic
on:
  pull_request:
jobs:
  strategy-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/phase6b2-calibration-diagnostic.js > phase6b2-strategy.log
      - run: node tests/phase6b2-strategy-matrix-diagnostic.js >> phase6b2-strategy.log
      - uses: actions/upload-artifact@v4
        with:
          name: phase6b2-strategy
          path: phase6b2-strategy.log
