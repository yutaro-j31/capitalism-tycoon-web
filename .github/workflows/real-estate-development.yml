name: Real Estate Development

on:
  pull_request:
    paths:
      - 'js/real-estate-development.js'
      - 'js/real-estate-ui.js'
      - 'tests/real-estate-development-test.js'
      - '.github/workflows/real-estate-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-estate-development:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run real-estate development regression
        run: node tests/real-estate-development-test.js
      - name: Run real-estate foundation regression
        run: node tests/real-estate-foundation-test.js
      - name: Run transaction exception safety regression
        run: node tests/week-test.js
