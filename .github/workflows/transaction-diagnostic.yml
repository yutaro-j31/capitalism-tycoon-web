name: Transaction Diagnostic
on:
  pull_request:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run transaction regression
        id: transaction
        continue-on-error: true
        run: npm run test:transaction > transaction.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transaction-log
          path: transaction.log
      - name: Propagate failure
        if: steps.transaction.outcome == 'failure'
        run: exit 1
