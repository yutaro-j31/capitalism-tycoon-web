name: Transaction Diagnostic
on:
  pull_request:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate transaction baseline
        run: node tests/transaction-baseline-diagnostic.js
      - uses: actions/upload-artifact@v4
        with:
          name: transaction-baseline-generated
          path: tests/transaction-baseline-generated.json
