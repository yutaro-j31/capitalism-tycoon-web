name: Temporary Path Filter Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate complete path-filter audit
        run: node tools/apply-workflow-path-filter-audit.js
      - name: Archive generated workflows and report
        uses: actions/upload-artifact@v4
        with:
          name: workflow-path-filter-audit
          path: |
            .github/workflows
            workflow-path-filter-audit.json
          if-no-files-found: error
