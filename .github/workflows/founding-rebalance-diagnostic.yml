name: Founding Rebalance Diagnostic

on:
  push:
    branches:
      - feat/founding-route-rebalance

permissions:
  contents: read

jobs:
  ramen-demand:
    strategy:
      fail-fast: false
      matrix:
        demand: [965, 970, 975]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply accounting root fix and demand candidate
        env:
          DEMAND: ${{ matrix.demand }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('js/engine.js')
          s=p.read_text()
          old="variable=mr.variableCost*(store.businessID==='ramen'?Math.max(1,finite(b.price,920)/920):1);"
          assert old in s
          p.write_text(s.replace(old,"variable=mr.variableCost;",1))
          p=Path('js/data.js')
          s=p.read_text()
          s,n=re.subn(r'("id": "ramen",\s*"name": "ラーメン",\s*"price": 1450,\s*"unitCost": 300,\s*"demand": )960',r'\g<1>'+os.environ['DEMAND'],s,count=1)
          assert n==1,n
          p.write_text(s)
          PY
      - name: Measure ramen route
        run: |
          cat > tests/_ramen-demand-candidate.js <<'JS'
          'use strict';
          const {loadGame}=require('./harness');
          function lcg(seed=190826041){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/2**32;};}
          const {ctx}=loadGame({random:lcg(),headless:true}),engine=new ctx.__ct_headlessEngineClass();
          engine.save=()=>{};engine.configure({playerName:'Tester',companyName:'ramen Co',difficulty:'normal',scenario:'free'});engine.g.skipWeeklyValidation=true;
          let reached=null;const profits=[];
          const tenant=()=>engine.g.tenants.filter(t=>!t.occupiedBy).sort((a,b)=>{const score=t=>engine.pref(t.prefID).traffic*engine.area(engine.pref(t.prefID).areaID).traffic;return score(b)-score(a)||String(a.id).localeCompare(String(b.id));})[0];
          function open(){const t=tenant();if(!t)return false;const b=engine.business('ramen'),cost=b.storeCost+t.deposit;if(engine.g.stores.length&&engine.g.companyCash<=cost*3)return false;return engine.openStore({tenantID:t.id,businessID:'ramen',name:`ramen-${engine.g.stores.length+1}`,operatingHours:3});}
          open();
          while(engine.g.week<320&&!engine.g.gameOver){engine.advanceWeek(false);profits.push(engine.g.lastReport?.profit||0);if(reached===null&&engine.companyValue()>=1e9)reached=engine.g.week;if(engine.g.week%4===0&&profits.slice(-8).reduce((a,n)=>a+n,0)/Math.min(8,profits.length)>0)open();}
          console.log('RAMEN_DEMAND '+JSON.stringify({demand:engine.business('ramen').demand,reached,week:engine.g.week,gameOver:engine.g.gameOver,stores:engine.g.stores.length,cash:engine.g.companyCash,value:engine.companyValue()}));
          if(engine.g.gameOver)process.exitCode=1;
          JS
          node tests/_ramen-demand-candidate.js

  brokerage-age:
    strategy:
      fail-fast: false
      matrix:
        ageScale: [0.01, 0.0125, 0.015]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply brokerage age-relief candidate
        env:
          AGE_SCALE: ${{ matrix.ageScale }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          scale=os.environ['AGE_SCALE']
          p=Path('js/real-estate-agency-pipeline.js')
          s=p.read_text()
          old="ageRelief=Math.max(0,age-3)*.02,closeChance=clamp(baseCloseChance*config.closeMultiplier+cycleAdjustment+ageRelief,.08,.75)"
          assert old in s
          s=s.replace(old,f"ageRelief=Math.max(0,age-3)*{scale},closeChance=clamp(baseCloseChance*config.closeMultiplier+cycleAdjustment+ageRelief,.08,.73)",1)
          p.write_text(s)
          print('BROKERAGE_AGE_SCALE',scale)
          PY
      - name: Measure brokerage route across seeds
        run: |
          cat > tests/_brokerage-age-candidate.js <<'JS'
          'use strict';
          const {loadGame}=require('./harness');
          const seeds=[190826041,1797259521,2806491037];
          function run(seed){
            function lcg(value){let s=value>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/2**32;};}
            const {ctx}=loadGame({random:lcg(seed),headless:true}),engine=new ctx.__ct_headlessEngineClass();
            engine.save=()=>{};engine.configure({playerName:'Tester',companyName:'Broker Co',difficulty:'normal',scenario:'free'});engine.g.skipWeeklyValidation=true;
            let reached=null;const profits=[];
            const tenant=()=>engine.g.tenants.filter(t=>!t.occupiedBy).sort((a,b)=>{const score=t=>engine.pref(t.prefID).traffic*engine.area(engine.pref(t.prefID).areaID).traffic;return score(b)-score(a)||String(a.id).localeCompare(String(b.id));})[0];
            function open(){const t=tenant();if(!t)return false;const b=engine.business('realEstateAgency'),cost=b.storeCost+t.deposit;if(engine.g.stores.length&&engine.g.companyCash<=cost*3)return false;return engine.openStore({tenantID:t.id,businessID:'realEstateAgency',name:`broker-${engine.g.stores.length+1}`,operatingHours:3});}
            open();
            while(engine.g.week<320&&!engine.g.gameOver){engine.advanceWeek(false);profits.push(engine.g.lastReport?.profit||0);if(reached===null&&engine.companyValue()>=1e9)reached=engine.g.week;if(engine.g.week%4===0&&profits.slice(-8).reduce((a,n)=>a+n,0)/Math.min(8,profits.length)>0)open();}
            return {seed,reached,week:engine.g.week,gameOver:engine.g.gameOver,stores:engine.g.stores.length,cash:engine.g.companyCash,value:engine.companyValue()};
          }
          const rows=seeds.map(run);console.log('BROKERAGE_AGE_RESULTS '+JSON.stringify(rows));if(rows.some(r=>r.gameOver))process.exitCode=1;
          JS
          node tests/_brokerage-age-candidate.js
