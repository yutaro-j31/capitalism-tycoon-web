name: Founding Rebalance Diagnostic

on:
  push:
    branches:
      - feat/founding-route-rebalance

permissions:
  contents: read

jobs:
  material-scale:
    strategy:
      fail-fast: false
      matrix:
        scale: [1.8, 2.0, 2.2, 2.4, 2.6]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply accounting-safe engine and material-cost candidate
        env:
          SCALE: ${{ matrix.scale }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          scale=float(os.environ['SCALE'])

          p=Path('js/engine.js')
          s=p.read_text()
          old="variable=mr.variableCost*(store.businessID==='ramen'?Math.max(1,finite(b.price,920)/920):1);"
          assert old in s
          p.write_text(s.replace(old,"variable=mr.variableCost;",1))

          p=Path('js/supply.js')
          s=p.read_text()
          bases={
            'ramen_noodles':106,
            'ramen_soup':99,
            'ramen_toppings':90,
            'ramen_vegetables':37,
            'ramen_packaging':14,
          }
          for material,base in bases.items():
            pattern=rf"(id:'{material}'[^\n]*?baseUnitCost:){base}(?=,)"
            value=round(base*scale,2)
            replacement=rf"\g<1>{value:g}"
            s,n=re.subn(pattern,replacement,s,count=1)
            assert n==1,(material,n)
          p.write_text(s)
          print('RAMEN_MATERIAL_SCALE',scale)
          PY
      - name: Production 500-week ramen calibration
        run: |
          cat > tests/_ramen-material-candidate.js <<'JS'
          'use strict';
          const {loadGame}=require('./harness');
          function lcg(seed=190826041){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/2**32;};}
          const {ctx}=loadGame({random:lcg(),headless:true}),engine=new ctx.__ct_headlessEngineClass();
          engine.save=()=>{};engine.configure({playerName:'Tester',companyName:'ramen Co',difficulty:'normal',scenario:'free'});engine.g.skipWeeklyValidation=true;
          let reached=null,minCash=engine.g.companyCash;const profits=[];
          const tenant=()=>engine.g.tenants.filter(t=>!t.occupiedBy).sort((a,b)=>{const score=t=>engine.pref(t.prefID).traffic*engine.area(engine.pref(t.prefID).areaID).traffic;return score(b)-score(a)||String(a.id).localeCompare(String(b.id));})[0];
          function open(){const t=tenant();if(!t)return false;const b=engine.business('ramen'),cost=b.storeCost+t.deposit;if(engine.g.stores.length&&engine.g.companyCash<=cost*3)return false;return engine.openStore({tenantID:t.id,businessID:'ramen',name:`ramen-${engine.g.stores.length+1}`,operatingHours:3});}
          open();
          while(engine.g.week<500&&!engine.g.gameOver){engine.advanceWeek(false);profits.push(engine.g.lastReport?.profit||0);minCash=Math.min(minCash,engine.g.companyCash);if(reached===null&&engine.companyValue()>=1e9)reached=engine.g.week;if(engine.g.week%4===0&&profits.slice(-8).reduce((a,n)=>a+n,0)/Math.min(8,profits.length)>0)open();}
          console.log('RAMEN_MATERIAL_CANDIDATE '+JSON.stringify({reached,week:engine.g.week,gameOver:engine.g.gameOver,stores:engine.g.stores.length,cash:engine.g.companyCash,value:engine.companyValue(),minCash,last8avg:profits.slice(-8).reduce((a,n)=>a+n,0)/Math.min(8,profits.length)}));
          JS
          node tests/_ramen-material-candidate.js
      - name: Long-run margin and accounting contracts
        run: |
          node tests/supply-material-cost-inflation-test.js
          node tests/supplier-material-coverage-test.js

  accounting-root-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply root accounting fix and correct stale fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/engine.js')
          s=p.read_text()
          old="variable=mr.variableCost*(store.businessID==='ramen'?Math.max(1,finite(b.price,920)/920):1);"
          assert old in s
          p.write_text(s.replace(old,"variable=mr.variableCost;",1))

          p=Path('tests/fixtures/transaction-baseline-v1.json')
          s=p.read_text()
          pattern=r'("id": "ramen",(?:(?!"id": ).)*?"storeCost": )3000000'
          s,n=re.subn(pattern,r'\g<1>1700000',s,flags=re.S)
          assert n>0,n
          p.write_text(s)
          print('corrected fixture rows',n)
          PY
      - name: Focused accounting contracts
        run: |
          node tests/transaction-regression-test.js
          node tests/supplier-material-coverage-test.js
          node tests/company-valuation-normalization-test.js
          node tests/store-zero-investment-founding-test.js
          node tests/market-cannibalization-test.js
          git diff --check
