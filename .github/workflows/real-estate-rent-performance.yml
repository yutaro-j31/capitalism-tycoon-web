name: Real Estate Rent Performance
on:
  pull_request:
    paths:
      - 'js/real-estate-rent-performance.js'
      - 'js/real-estate-rent-performance-ui.js'
      - 'js/real-estate-portfolio-dashboard-ui.js'
      - 'tests/real-estate-rent-performance-test.js'
      - '.github/workflows/real-estate-rent-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/real-estate-rent-performance-test.js
