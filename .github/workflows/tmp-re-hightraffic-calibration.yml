name: Temporary RE High Traffic Calibration

on:
  push:
    branches:
      - tmp/re-hightraffic-calibration

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch historical finance snapshot for calibration only
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/finance.js';
          let s=fs.readFileSync(p,'utf8');
          const oldSnapshot="function rebuildSnapshotForWeek(g,week){const f=ensureFinance(g);week=Math.floor(n(week,g.week));const i=f.weeklySnapshots.findIndex(s=>s.week===week);const opening=i>=0?f.weeklySnapshots[i].openingCash:openingForWeek(f,week);return recordSnapshot(g,opening,week,week===Math.floor(n(g.week,1))?g.companyCash:(i>=0?f.weeklySnapshots[i].actualCompanyCash:null));}";
          const newSnapshot="function rebuildSnapshotForWeek(g,week){const f=ensureFinance(g);week=Math.floor(n(week,g.week));const i=f.weeklySnapshots.findIndex(s=>s.week===week);const opening=i>=0?f.weeklySnapshots[i].openingCash:openingForWeek(f,week),currentWeek=Math.floor(n(g.week,1)),reconstructed=r(opening+f.transactions.filter(t=>t.week===week).reduce((a,t)=>a+n(t.cashEffect),0)),actual=week===currentWeek?g.companyCash:reconstructed;return recordSnapshot(g,opening,week,actual);}";
          if(!s.includes(oldSnapshot))throw new Error('rebuildSnapshotForWeek contract changed');
          fs.writeFileSync(p,s.replace(oldSnapshot,newSnapshot));
          NODE
      - name: Run finance regressions
        run: |
          npm run test:finance
          npm run test:accounting-invariants
  working-capital-line:
    strategy:
      fail-fast: false
      matrix:
        line_cap: [2000000, 3000000, 4000000]
        seed: [190826100,190826101,190826102,190826103,190826104,190826105,190826106,190826107,190826108,190826109,190826110,190826111,190826112,190826113,190826114,190826115,190826116,190826117,190826118,190826119]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove founding mandates for line calibration
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/real-estate-agency-pipeline.js';
          let s=fs.readFileSync(p,'utf8');
          const from='FOUNDING_INITIAL_DEALS=4';
          if(!s.includes(from)) throw new Error('RE founding deal contract changed');
          fs.writeFileSync(p,s.replace(from,'FOUNDING_INITIAL_DEALS=0'));
          NODE
      - name: Patch historical finance snapshot for calibration only
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/finance.js';
          let s=fs.readFileSync(p,'utf8');
          const oldSnapshot="function rebuildSnapshotForWeek(g,week){const f=ensureFinance(g);week=Math.floor(n(week,g.week));const i=f.weeklySnapshots.findIndex(s=>s.week===week);const opening=i>=0?f.weeklySnapshots[i].openingCash:openingForWeek(f,week);return recordSnapshot(g,opening,week,week===Math.floor(n(g.week,1))?g.companyCash:(i>=0?f.weeklySnapshots[i].actualCompanyCash:null));}";
          const newSnapshot="function rebuildSnapshotForWeek(g,week){const f=ensureFinance(g);week=Math.floor(n(week,g.week));const i=f.weeklySnapshots.findIndex(s=>s.week===week);const opening=i>=0?f.weeklySnapshots[i].openingCash:openingForWeek(f,week),currentWeek=Math.floor(n(g.week,1)),reconstructed=r(opening+f.transactions.filter(t=>t.week===week).reduce((a,t)=>a+n(t.cashEffect),0)),actual=week===currentWeek?g.companyCash:reconstructed;return recordSnapshot(g,opening,week,actual);}";
          if(!s.includes(oldSnapshot))throw new Error('rebuildSnapshotForWeek contract changed');
          fs.writeFileSync(p,s.replace(oldSnapshot,newSnapshot));
          NODE
      - name: Run strict 500-week high-traffic RE route
        env:
          SEED: ${{ matrix.seed }}
          HORIZON: 500
          LINE_CAP: ${{ matrix.line_cap }}
          CASH_FLOOR: 2000000
          REPAY_TRIGGER: 4000000
        run: node tests/tmp-re-hightraffic-calibration.js
