name: Temporary RE High Traffic Calibration

on:
  push:
    branches:
      - tmp/re-hightraffic-calibration

permissions:
  contents: read

jobs:
  founding-deal-screen:
    strategy:
      fail-fast: false
      matrix:
        founding_deals: [7, 8]
        seed: [190826100,190826101,190826102,190826103,190826104,190826105,190826106,190826107,190826108,190826109,190826110,190826111,190826112,190826113,190826114,190826115,190826116,190826117,190826118,190826119]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch founding mandates for calibration only
        env:
          FOUNDING_DEALS: ${{ matrix.founding_deals }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/real-estate-agency-pipeline.js';
          let s=fs.readFileSync(p,'utf8');
          const from='FOUNDING_INITIAL_DEALS=4';
          const to='FOUNDING_INITIAL_DEALS='+process.env.FOUNDING_DEALS;
          if(!s.includes(from)) throw new Error('RE founding deal contract changed');
          fs.writeFileSync(p,s.replace(from,to));
          NODE
      - name: Run strict 500-week high-traffic founding route
        env:
          SEED: ${{ matrix.seed }}
          HORIZON: 500
        run: node tests/tmp-re-hightraffic-calibration.js
