name: Listed Subsidiary Portfolio Dashboard

on:
  pull_request:
    paths:
      - 'js/listed-subsidiary-portfolio-dashboard.js'
      - 'tests/listed-subsidiary-portfolio-dashboard-test.js'
      - 'play.html'
      - 'tests/run-all.js'
      - '.github/workflows/listed-subsidiary-portfolio-dashboard.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/listed-subsidiary-portfolio-dashboard.js
      - run: node tests/listed-subsidiary-portfolio-dashboard-test.js
