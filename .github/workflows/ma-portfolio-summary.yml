name: M&A Portfolio Summary

on:
  pull_request:
    paths:
      - 'js/ma-portfolio-summary.js'
      - 'tests/ma-portfolio-summary-test.js'
      - '.github/workflows/ma-portfolio-summary.yml'
  push:
    branches: [main]
    paths:
      - 'js/ma-portfolio-summary.js'
      - 'tests/ma-portfolio-summary-test.js'
      - '.github/workflows/ma-portfolio-summary.yml'

permissions:
  contents: read

jobs:
  ma-portfolio-summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check js/ma-portfolio-summary.js && node --check tests/ma-portfolio-summary-test.js
      - name: Determinism, purity, risk and accounting aggregation
        run: node tests/ma-portfolio-summary-test.js
      - name: Preserve save contract
        run: |
          grep -q "capitalism_tycoon_web_v1" js/engine.js
          grep -Eq "saveVersion[^0-9]*9|SAVE_VERSION[^0-9]*9" js/engine.js
