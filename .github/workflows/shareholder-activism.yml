name: Shareholder Activism

on:
  pull_request:
    paths:
      - 'js/shareholder-activism.js'
      - 'js/play-runtime-compat.js'
      - 'tests/shareholder-activism-test.js'
      - 'tests/shareholder-activism-reachability-test.js'
      - '.github/workflows/shareholder-activism.yml'
  workflow_dispatch:

jobs:
  shareholder-activism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Direct lifecycle regression
        run: node tests/shareholder-activism-test.js
      - name: 208-week reachable-play regression
        run: node tests/shareholder-activism-reachability-test.js
