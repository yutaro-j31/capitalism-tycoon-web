name: Temporary Gym Price Calibration

on:
  push:
    branches:
      - tmp/gym-price-calibration

permissions:
  contents: read

jobs:
  calibration:
    strategy:
      fail-fast: false
      matrix:
        price: [8500, 9000]
        expansion: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch startup cap for calibration only
        run: node -e "const fs=require('fs');const p='js/bank-loans-covenants.js';let s=fs.readFileSync(p,'utf8');s=s.replace('GYM_STARTUP_MAX=5_500_000','GYM_STARTUP_MAX=9_500_000');fs.writeFileSync(p,s);"
      - name: Patch historical finance snapshot reconstruction for calibration only
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/finance.js';
          let s=fs.readFileSync(p,'utf8');
          const before="function rebuildSnapshotForWeek(g,week){const f=ensureFinance(g);week=Math.floor(n(week,g.week));const i=f.weeklySnapshots.findIndex(s=>s.week===week);const opening=i>=0?f.weeklySnapshots[i].openingCash:openingForWeek(f,week);return recordSnapshot(g,opening,week,week===Math.floor(n(g.week,1))?g.companyCash:(i>=0?f.weeklySnapshots[i].actualCompanyCash:null));}";
          const after="function rebuildSnapshotForWeek(g,week){const f=ensureFinance(g);week=Math.floor(n(week,g.week));const i=f.weeklySnapshots.findIndex(s=>s.week===week);const opening=i>=0?f.weeklySnapshots[i].openingCash:openingForWeek(f,week),currentWeek=Math.floor(n(g.week,1)),reconstructed=r(opening+f.transactions.filter(t=>t.week===week).reduce((a,t)=>a+n(t.cashEffect),0)),actual=week===currentWeek?g.companyCash:(i>=0?f.weeklySnapshots[i].actualCompanyCash:reconstructed);return recordSnapshot(g,opening,week,actual);}";
          if(!s.includes(before))throw new Error('finance rebuildSnapshotForWeek contract changed');
          s=s.replace(before,after);
          fs.writeFileSync(p,s);
          NODE
      - name: Run 500-week gym calibration
        env:
          SEED: 190826041
          PRICE: ${{ matrix.price }}
          ALLOW_EXPANSION: ${{ matrix.expansion }}
          HORIZON: 500
        run: node tests/tmp-gym-price-calibration.js
