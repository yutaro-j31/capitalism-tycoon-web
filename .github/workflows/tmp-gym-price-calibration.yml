name: Temporary Gym Price Calibration

on:
  push:
    branches:
      - tmp/gym-price-calibration

permissions:
  contents: read

jobs:
  progression-calibration:
    strategy:
      fail-fast: false
      matrix:
        price: [9000, 10000, 11000, 12000]
        store_cost: [8000000, 10000000, 12000000]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch startup financing for calibration only
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/bank-loans-covenants.js';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('GYM_STARTUP_MAX=5_500_000','GYM_STARTUP_MAX=9_500_000');
          s=s.replace('GYM_STARTUP_TERM=104','GYM_STARTUP_TERM=130');
          const oldBalance="function bankLoanBalance(state){return activeFinanceLoans(state).filter(l=>l.sourceType==='bankLoansCovenants'||l.sourceType==='gymStartupLoan').reduce((sum,l)=>sum+integer(l.outstandingPrincipal),0);}";
          const newBalance="function bankLoanBalance(state){return finance.ensureFinance(state).loans.filter(l=>l&&l.status!=='repaid'&&integer(l.outstandingPrincipal)>0&&(l.sourceType==='bankLoansCovenants'||l.sourceType==='gymStartupLoan')).reduce((sum,l)=>sum+integer(l.outstandingPrincipal),0);}";
          if(!s.includes(oldBalance))throw new Error('bankLoanBalance contract changed');
          fs.writeFileSync(p,s.replace(oldBalance,newBalance));
          NODE
      - name: Patch finance accounting boundaries for calibration only
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/finance.js';
          let s=fs.readFileSync(p,'utf8');
          const oldSnapshot="function rebuildSnapshotForWeek(g,week){const f=ensureFinance(g);week=Math.floor(n(week,g.week));const i=f.weeklySnapshots.findIndex(s=>s.week===week);const opening=i>=0?f.weeklySnapshots[i].openingCash:openingForWeek(f,week);return recordSnapshot(g,opening,week,week===Math.floor(n(g.week,1))?g.companyCash:(i>=0?f.weeklySnapshots[i].actualCompanyCash:null));}";
          const newSnapshot="function rebuildSnapshotForWeek(g,week){const f=ensureFinance(g);week=Math.floor(n(week,g.week));const i=f.weeklySnapshots.findIndex(s=>s.week===week);const opening=i>=0?f.weeklySnapshots[i].openingCash:openingForWeek(f,week),currentWeek=Math.floor(n(g.week,1)),reconstructed=r(opening+f.transactions.filter(t=>t.week===week).reduce((a,t)=>a+n(t.cashEffect),0)),actual=week===currentWeek?g.companyCash:(i>=0?f.weeklySnapshots[i].actualCompanyCash:reconstructed);return recordSnapshot(g,opening,week,actual);}";
          if(!s.includes(oldSnapshot))throw new Error('rebuildSnapshotForWeek contract changed');
          s=s.replace(oldSnapshot,newSnapshot);
          const oldLoan="const loanTotal=r(f.loans.filter(l=>l.status==='active').reduce((a,l)=>a+n(l.outstandingPrincipal),0));";
          const newLoan="const loanTotal=r(f.loans.filter(l=>l.status!=='repaid'&&n(l.outstandingPrincipal)>0).reduce((a,l)=>a+n(l.outstandingPrincipal),0));";
          if(!s.includes(oldLoan))throw new Error('loan validation contract changed');
          fs.writeFileSync(p,s.replace(oldLoan,newLoan));
          NODE
      - name: Remove managed-loan double interest for calibration only
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/engine.js';
          let s=fs.readFileSync(p,'utf8');
          const old="const officeCost=this.g.hasHeadOffice?this.g.officeWeeklyCost:0,interest=this.g.companyDebt*this.companyBorrowRate()/52;";
          const replacement="const managedDebt=finance.ensureFinance(this.g).loans.filter(l=>l&&l.status!=='repaid'&&finite(l.outstandingPrincipal)>0&&(l.sourceType==='bankLoansCovenants'||l.sourceType==='gymStartupLoan')).reduce((sum,l)=>sum+finite(l.outstandingPrincipal),0);const officeCost=this.g.hasHeadOffice?this.g.officeWeeklyCost:0,interest=Math.max(0,this.g.companyDebt-managedDebt)*this.companyBorrowRate()/52;";
          if(!s.includes(old))throw new Error('engine interest contract changed');
          fs.writeFileSync(p,s.replace(old,replacement));
          NODE
      - name: Patch gym startup economics for calibration only
        env:
          STORE_COST: ${{ matrix.store_cost }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/data.js';
          let s=fs.readFileSync(p,'utf8');
          const marker='"id": "gym"';
          const start=s.indexOf(marker);
          if(start<0)throw new Error('gym master data missing');
          const end=s.indexOf('    },',start);
          const block=s.slice(start,end);
          if(!block.includes('"storeCost": 14000000'))throw new Error('gym storeCost contract changed');
          const patched=block.replace('"storeCost": 14000000','"storeCost": '+process.env.STORE_COST);
          s=s.slice(0,start)+patched+s.slice(end);
          fs.writeFileSync(p,s);
          NODE
      - name: Run 500-week gym progression calibration
        env:
          SEED: 190826041
          PRICE: ${{ matrix.price }}
          ALLOW_EXPANSION: 1
          HORIZON: 500
        run: node tests/tmp-gym-price-calibration.js
