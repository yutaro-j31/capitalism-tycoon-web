name: Temporary Founding Main Calibration
on:
  push:
    branches:
      - tmp/founding-main-calibration
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure latest-main ramen calibration
        run: node tests/tmp-founding-main-calibration.js
