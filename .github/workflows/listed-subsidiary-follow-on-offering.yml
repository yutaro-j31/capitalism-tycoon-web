name: Listed Subsidiary Follow-on Offering

on:
  pull_request:
    paths:
      - 'js/listed-subsidiary-follow-on-offering.js'
      - 'tests/listed-subsidiary-follow-on-offering-test.js'
      - 'play.html'
      - 'tests/run-all.js'
      - '.github/workflows/listed-subsidiary-follow-on-offering.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check js/listed-subsidiary-follow-on-offering.js
      - run: node tests/listed-subsidiary-follow-on-offering-test.js
