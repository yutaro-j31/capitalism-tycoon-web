name: Apply PR179 Verified Fix

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: apply-pr179-verified-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'a8z22f-codex/add-ma-acquisition-financing-packages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8z22f-codex/add-ma-acquisition-financing-packages
          fetch-depth: 0

      - name: Reconstruct and verify fix bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/pr179-patch/new-00 \
            .github/pr179-patch/new-01 \
            .github/pr179-patch/new-02 \
            .github/pr179-patch/new-03-04 \
            .github/pr179-patch/new-05-06 \
            .github/pr179-patch/new-07-08 \
            > /tmp/pr179-fix.patch.gz.b64
          base64 --decode /tmp/pr179-fix.patch.gz.b64 | gzip --decompress > /tmp/pr179-fix.patch
          test "$(sha256sum /tmp/pr179-fix.patch | cut -d' ' -f1)" = '76848639701f00f227677567f38c0272d4fe1b52c08fba10f6d86d51d53ff739'

      - name: Apply production and test changes
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --whitespace=error-all /tmp/pr179-fix.patch
          git apply --whitespace=error-all /tmp/pr179-fix.patch

      - name: Restore final workflow and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/pr179-patch
          rm -f .github/workflows/apply-pr179-verified-fix.yml
          echo '' | base64 --decode > .github/workflows/ma-acquisition-financing.yml

      - name: Validate staged changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"

      - name: Commit and push verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete deterministic M&A acquisition financing'
          git push origin HEAD:a8z22f-codex/add-ma-acquisition-financing-packages
