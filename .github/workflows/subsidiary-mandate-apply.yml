name: Subsidiary Mandate Apply

on:
  pull_request:
    paths:
      - 'js/subsidiary-mandate-apply.js'
      - 'index.html'
      - 'tests/subsidiary-mandate-apply-test.js'
      - '.github/workflows/subsidiary-mandate-apply.yml'
  workflow_dispatch:

jobs:
  subsidiary-mandate-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: node --check js/subsidiary-mandate-apply.js
      - name: Run mandate application tests
        run: node tests/subsidiary-mandate-apply-test.js
      - name: Run performance review regression
        run: node tests/subsidiary-performance-review-test.js
      - name: Run budget KPI regression
        run: node tests/subsidiary-budget-kpi-test.js
      - name: Validate static safety
        run: npm run test:static
      - name: Validate production wiring
        run: grep -q 'js/subsidiary-mandate-apply.js' index.html
