name: M&A Acquisition Financing

on:
  pull_request:
    paths:
      - 'js/engine.js'
      - 'js/expansion.js'
      - 'tests/investor-offer-save-atomicity-test.js'
      - 'tests/investor-offer-save-atomicity-webkit-test.js'
      - 'tests/founder-share-sale-save-atomicity-test.js'
      - 'tests/founder-share-sale-save-atomicity-webkit-test.js'
      - 'tests/stock-purchase-save-atomicity-test.js'
      - 'tests/stock-purchase-save-atomicity-webkit-test.js'
      - 'tests/stock-sale-save-atomicity-test.js'
      - 'tests/stock-sale-save-atomicity-webkit-test.js'
      - 'tests/stock-split-save-atomicity-test.js'
      - 'tests/stock-split-save-atomicity-webkit-test.js'
      - 'tests/fixtures/stock-split-atomicity.js'
      - 'tests/stock-split-price-history-test.js'
      - 'tests/stock-split-price-history-webkit-test.js'
      - 'js/pe-acquisition.js'
      - 'tests/vc-secondary-sale-save-atomicity-test.js'
      - 'tests/vc-secondary-sale-save-false-red-probe.js'
      - 'tests/vc-secondary-sale-save-atomicity-webkit-test.js'
      - 'tests/fixtures/vc-secondary-sale-atomicity.js'
      - 'tests/vc-follow-on-save-atomicity-test.js'
      - 'tests/vc-follow-on-save-atomicity-webkit-test.js'
      - 'tests/fixtures/vc-follow-on-atomicity.js'
      - 'tests/vc-initial-investment-save-atomicity-test.js'
      - 'tests/vc-initial-investment-save-atomicity-webkit-test.js'
      - 'tests/fixtures/vc-initial-investment-atomicity.js'
      - 'tests/pe-fund-acquisition-save-atomicity-test.js'
      - 'tests/pe-fund-acquisition-save-atomicity-webkit-test.js'
      - 'tests/fixtures/pe-fund-acquisition-atomicity.js'
      - 'tests/fixtures/pe-fund-acquisition-faults.js'
      - 'js/pe-network-sourcing.js'
      - 'tests/parent-ipo-save-atomicity-test.js'
      - 'tests/parent-ipo-save-atomicity-webkit-test.js'
      - 'tests/fixtures/parent-ipo-atomicity.js'
      - 'tests/ma-subsidiary-sale-save-atomicity-test.js'
      - 'tests/ma-subsidiary-sale-save-atomicity-webkit-test.js'
      - 'tests/fixtures/ma-subsidiary-sale-atomicity.js'
      - 'js/ma-deal-room.js'
      - 'js/ceo-dashboard.js'
      - 'js/app.js'
      - 'css/**'
      - 'tests/ma-deal-room-test.js'
      - 'tests/ceo-dashboard-webkit-test.js'
      - '.github/workflows/ma-acquisition-financing.yml'
  push:
    branches: [main]
    paths:
      - 'js/expansion.js'
      - 'tests/investor-offer-save-atomicity-test.js'
      - 'tests/investor-offer-save-atomicity-webkit-test.js'
      - 'tests/founder-share-sale-save-atomicity-test.js'
      - 'tests/founder-share-sale-save-atomicity-webkit-test.js'
      - 'tests/stock-purchase-save-atomicity-test.js'
      - 'tests/stock-purchase-save-atomicity-webkit-test.js'
      - 'tests/stock-sale-save-atomicity-test.js'
      - 'tests/stock-sale-save-atomicity-webkit-test.js'
      - 'tests/stock-split-save-atomicity-test.js'
      - 'tests/stock-split-save-atomicity-webkit-test.js'
      - 'tests/fixtures/stock-split-atomicity.js'
      - 'tests/stock-split-price-history-test.js'
      - 'tests/stock-split-price-history-webkit-test.js'
      - 'js/pe-acquisition.js'
      - 'tests/vc-secondary-sale-save-atomicity-test.js'
      - 'tests/vc-secondary-sale-save-false-red-probe.js'
      - 'tests/vc-secondary-sale-save-atomicity-webkit-test.js'
      - 'tests/fixtures/vc-secondary-sale-atomicity.js'
      - 'tests/vc-follow-on-save-atomicity-test.js'
      - 'tests/vc-follow-on-save-atomicity-webkit-test.js'
      - 'tests/fixtures/vc-follow-on-atomicity.js'
      - 'tests/vc-initial-investment-save-atomicity-test.js'
      - 'tests/vc-initial-investment-save-atomicity-webkit-test.js'
      - 'tests/fixtures/vc-initial-investment-atomicity.js'
      - 'tests/pe-fund-acquisition-save-atomicity-test.js'
      - 'tests/pe-fund-acquisition-save-atomicity-webkit-test.js'
      - 'tests/fixtures/pe-fund-acquisition-atomicity.js'
      - 'tests/fixtures/pe-fund-acquisition-faults.js'
      - 'js/pe-network-sourcing.js'
      - 'tests/parent-ipo-save-atomicity-test.js'
      - 'tests/parent-ipo-save-atomicity-webkit-test.js'
      - 'tests/fixtures/parent-ipo-atomicity.js'
      - 'tests/ma-subsidiary-sale-save-atomicity-test.js'
      - 'tests/ma-subsidiary-sale-save-atomicity-webkit-test.js'
      - 'tests/fixtures/ma-subsidiary-sale-atomicity.js'
      - 'js/ma-*.js'
      - 'js/pmi-*.js'
      - 'js/subsidiary-*.js'
      - 'js/group-*.js'
      - 'js/ceo-dashboard.js'
      - 'js/engine.js'
      - 'js/finance.js'
      - 'js/save*.js'
      - 'js/*normalize*.js'
      - 'index.html'
      - 'package.json'
      - 'tests/harness.js'
      - 'tests/run-all.js'
      - 'tests/ma-*.js'
      - 'tests/pmi-*.js'
      - 'tests/subsidiary-*.js'
      - 'tests/finance-ma-accounting-test.js'
      - 'tests/accounting-invariants-test.js'
      - 'tests/v1-progression-gate-test.js'
      - '.github/workflows/ma-acquisition-financing.yml'
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: M&A validation scope
        type: choice
        required: true
        default: comprehensive
        options:
          - comprehensive
          - deal-room

permissions:
  contents: read

env:
  MA_ACQUISITION_FINANCING_ARTIFACT_DIR: artifacts/ma-acquisition-financing-webkit
  MA_BOARD_APPROVAL_ARTIFACT_DIR: artifacts/ma-board-approval-webkit
  MA_DEAL_ROOM_ARTIFACT_DIR: artifacts/ma-deal-room-webkit
  MA_INTEGRATION_ARTIFACT_DIR: artifacts/ma-integration-webkit
  CEO_DASHBOARD_ARTIFACT_DIR: artifacts/ceo-dashboard-webkit

jobs:
  comprehensive-ma:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'comprehensive')
    concurrency:
      group: ma-acquisition-financing-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Unit and integration suites
        run: |
          npm run test:ma-acquisition-financing
          npm run test:ma-board-approval
          npm run test:ma-deal-room
          npm run test:ma-integration
          npm run test:ma-portfolio-summary
          npm run test:ma-portfolio-summary-ui
          npm run test:ceo-dashboard
          npm run test:finance
          npm run test:finance-ma-accounting
          npm run test:accounting-invariants
          npm run test:save
          npm run test:migration
          npm run test:save-v9
          npm run test:week
          npm run test:transaction
          npm run test:syntax
          npm run test:javascript
          npm run test:modules
          npm run test:static
          npm run test:css
          npm run test:progression-balance
          npm run test:strategy-balance
          node tests/v1-progression-gate-test.js
          node tests/executive-secretary-test.js

      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0

      - name: Install WebKit browser and system dependencies
        run: npx playwright install --with-deps webkit

      - name: iPhone WebKit smoke
        run: |
          node tests/ma-acquisition-financing-webkit-test.js
          node tests/ma-board-approval-webkit-test.js
          node tests/ma-deal-room-webkit-test.js
          node tests/ma-share-swap-save-atomicity-webkit-test.js
          node tests/investor-offer-save-atomicity-webkit-test.js
          node tests/founder-share-sale-save-atomicity-webkit-test.js
          node tests/stock-purchase-save-atomicity-webkit-test.js
          node tests/stock-sale-save-atomicity-webkit-test.js
          node tests/stock-split-price-history-webkit-test.js
          node tests/parent-ipo-save-atomicity-webkit-test.js
          node tests/ma-subsidiary-sale-save-atomicity-webkit-test.js
          node tests/ma-integration-webkit-test.js
          node tests/ceo-dashboard-webkit-test.js

      - name: Upload M&A acquisition financing artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ma-acquisition-financing-${{ github.sha }}
          path: |
            artifacts/ma-acquisition-financing-webkit
            artifacts/ma-board-approval-webkit
            artifacts/ma-deal-room-webkit
            artifacts/ma-integration-webkit
            artifacts/ceo-dashboard-webkit
          if-no-files-found: error
          retention-days: 30


  deal-room:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'deal-room')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run test:ma-deal-room
      - run: npm run test:ma-integration
      - run: npm run test:finance-ma-accounting
      - run: npm run test:save
      - run: npm run test:migration
      - run: npm run test:save-v9
      - run: npm run test:week
      - run: npm run test:transaction
      - run: npm run test:syntax
      - run: npm run test:javascript
      - run: npm run test:modules
      - run: npm run test:static
      - run: npm run test:css
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        run: npx playwright install --with-deps webkit
      - run: node tests/ma-deal-room-webkit-test.js
      - run: node tests/ma-share-swap-save-atomicity-webkit-test.js
      - run: node tests/investor-offer-save-atomicity-webkit-test.js
      - run: node tests/founder-share-sale-save-atomicity-webkit-test.js
      - run: node tests/stock-purchase-save-atomicity-webkit-test.js
      - run: node tests/stock-sale-save-atomicity-webkit-test.js
      - run: node tests/stock-split-price-history-webkit-test.js
      - run: node tests/parent-ipo-save-atomicity-webkit-test.js
      - run: node tests/ma-subsidiary-sale-save-atomicity-webkit-test.js
      - run: node tests/ceo-dashboard-webkit-test.js
      - name: Upload M&A Deal Room WebKit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ma-deal-room-webkit
          path: artifacts/ma-deal-room-webkit
          if-no-files-found: error
      - name: Upload CEO Dashboard WebKit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceo-dashboard-webkit-pr
          path: artifacts/ceo-dashboard-webkit
          if-no-files-found: error

  stock-split-atomicity:
    # Keep the new regression independent of the existing M&A job's budget.
    # No event guard: exercise it on PR, main, schedule and both manual modes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MA_DEAL_ROOM_ARTIFACT_DIR: artifacts/stock-split-atomicity-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Stock split atomicity in real iPhone WebKit
        run: node tests/stock-split-save-atomicity-webkit-test.js
      - name: Retain stock split WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-split-atomicity-webkit-${{ github.sha }}
          path: artifacts/stock-split-atomicity-webkit
          if-no-files-found: error
          retention-days: 30

  pe-acquisition-atomicity:
    # PE fund/co-invest acquisition rollback and real-IndexedDB persistence, moved from deal-room and comprehensive-ma.
    # No event guard: PR, main push, schedule and both manual modes run it (Phase 1A split).
    # Keep the runtime each event used before the split: Node 20 for the PR / deal-room gate,
    # Node 22 for main push, schedule and the comprehensive manual mode.
    # Same cancellation as before the split: superseded main push / schedule / comprehensive runs
    # cancel this job per ref like comprehensive-ma; PR and deal-room runs get a per-run group, so
    # they are never cancelled or serialized (deal-room never had concurrency).
    concurrency:
      group: ma-acquisition-financing-pe-acquisition-atomicity-${{ (github.event_name == 'pull_request' || inputs.mode == 'deal-room') && github.run_id || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MA_DEAL_ROOM_ARTIFACT_DIR: artifacts/pe-acquisition-atomicity-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ (github.event_name == 'pull_request' || inputs.mode == 'deal-room') && '20' || '22' }}
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        run: npx playwright install --with-deps webkit
      - name: PE fund acquisition atomicity in real iPhone WebKit
        run: |
          node tests/pe-fund-acquisition-save-atomicity-webkit-test.js
      - name: Retain pe-acquisition-atomicity WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pe-acquisition-atomicity-webkit-${{ github.sha }}
          path: artifacts/pe-acquisition-atomicity-webkit
          if-no-files-found: error
          retention-days: 30

  vc-secondary-atomicity:
    # VC secondary sale rollback and real-IndexedDB persistence, moved from deal-room and comprehensive-ma.
    # No event guard: PR, main push, schedule and both manual modes run it (Phase 1A split).
    # Keep the runtime each event used before the split: Node 20 for the PR / deal-room gate,
    # Node 22 for main push, schedule and the comprehensive manual mode.
    # Same cancellation as before the split: superseded main push / schedule / comprehensive runs
    # cancel this job per ref like comprehensive-ma; PR and deal-room runs get a per-run group, so
    # they are never cancelled or serialized (deal-room never had concurrency).
    concurrency:
      group: ma-acquisition-financing-vc-secondary-atomicity-${{ (github.event_name == 'pull_request' || inputs.mode == 'deal-room') && github.run_id || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MA_DEAL_ROOM_ARTIFACT_DIR: artifacts/vc-secondary-atomicity-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ (github.event_name == 'pull_request' || inputs.mode == 'deal-room') && '20' || '22' }}
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        run: npx playwright install --with-deps webkit
      - name: VC secondary sale atomicity in real iPhone WebKit
        run: |
          node tests/vc-secondary-sale-save-atomicity-webkit-test.js
      - name: Retain vc-secondary-atomicity WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc-secondary-atomicity-webkit-${{ github.sha }}
          path: artifacts/vc-secondary-atomicity-webkit
          if-no-files-found: error
          retention-days: 30

  vc-funding-atomicity:
    # VC follow-on then initial investment rollback and persistence, in their original order, moved from deal-room and comprehensive-ma.
    # No event guard: PR, main push, schedule and both manual modes run it (Phase 1A split).
    # Keep the runtime each event used before the split: Node 20 for the PR / deal-room gate,
    # Node 22 for main push, schedule and the comprehensive manual mode.
    # Same cancellation as before the split: superseded main push / schedule / comprehensive runs
    # cancel this job per ref like comprehensive-ma; PR and deal-room runs get a per-run group, so
    # they are never cancelled or serialized (deal-room never had concurrency).
    concurrency:
      group: ma-acquisition-financing-vc-funding-atomicity-${{ (github.event_name == 'pull_request' || inputs.mode == 'deal-room') && github.run_id || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MA_DEAL_ROOM_ARTIFACT_DIR: artifacts/vc-funding-atomicity-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ (github.event_name == 'pull_request' || inputs.mode == 'deal-room') && '20' || '22' }}
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        run: npx playwright install --with-deps webkit
      - name: VC follow-on and initial investment atomicity in real iPhone WebKit
        run: |
          node tests/vc-follow-on-save-atomicity-webkit-test.js
          node tests/vc-initial-investment-save-atomicity-webkit-test.js
      - name: Retain vc-funding-atomicity WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc-funding-atomicity-webkit-${{ github.sha }}
          path: artifacts/vc-funding-atomicity-webkit
          if-no-files-found: error
          retention-days: 30

  ma-economic-gate:
    # One verdict for the split M&A gate. Every job that applies to this event must succeed;
    # a job that does not apply must be skipped. Failure, cancellation or an unexpected skip of
    # any job therefore fails this check. Branch protection is not configured, so this is a
    # reporting gate, not a merge block on its own.
    if: always()
    needs: [comprehensive-ma, deal-room, stock-split-atomicity, pe-acquisition-atomicity, vc-secondary-atomicity, vc-funding-atomicity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable M&A job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          node - <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const event = process.env.EVENT_NAME, mode = process.env.DISPATCH_MODE || '';
          const comprehensive = event === 'push' || event === 'schedule' || (event === 'workflow_dispatch' && mode === 'comprehensive');
          const dealRoom = event === 'pull_request' || (event === 'workflow_dispatch' && mode === 'deal-room');
          const applies = {
            'comprehensive-ma': comprehensive, 'deal-room': dealRoom, 'stock-split-atomicity': true,
            'pe-acquisition-atomicity': true, 'vc-secondary-atomicity': true, 'vc-funding-atomicity': true
          };
          const problems = [];
          for (const [job, required] of Object.entries(applies)) {
            const result = needs[job]?.result ?? 'missing';
            const expected = required ? 'success' : 'skipped';
            console.log(`${job}: ${result} (expected ${expected})`);
            if (result !== expected) problems.push(`${job} ${result} != ${expected}`);
          }
          const unknown = Object.keys(needs).filter(job => !(job in applies));
          if (unknown.length) problems.push(`unclassified needs: ${unknown.join(', ')}`);
          if (problems.length) { console.error(`M&A economic gate FAILED for ${event}${mode ? '/' + mode : ''}: ${problems.join('; ')}`); process.exit(1); }
          console.log(`M&A economic gate PASS for ${event}${mode ? '/' + mode : ''}`);
          NODE
