name: Industry Event Response Plans
on:
  pull_request:
    paths:
      - js/industry-event-response-plans.js
      - js/industry-event-response-plans-ui.js
      - js/industry-specific-events.js
      - js/engine.js
      - js/finance.js
      - js/save-storage.js
      - js/save-v9.js
      - index.html
      - tests/harness.js
      - tests/industry-event-response-plans-test.js
      - .github/workflows/industry-event-response-plans.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/industry-event-response-plans-test.js
