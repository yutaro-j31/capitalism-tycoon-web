name: Competitor Price Direction Guard

on:
  pull_request:
    paths:
      - 'js/competitor-media.js'
      - 'tests/competitor-price-direction-guard-test.js'
      - 'tests/competitor-strategic-ai-test.js'
      - '.github/workflows/competitor-price-direction-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check js/competitor-media.js
      - run: node tests/competitor-price-direction-guard-test.js
      - run: node tests/competitor-strategic-ai-test.js
      - run: npm run test:static
