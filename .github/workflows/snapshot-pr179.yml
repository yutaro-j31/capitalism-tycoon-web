name: Snapshot PR179 Head

on:
  push:
    branches: [ a8z22f-codex/add-ma-acquisition-financing-packages ]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8z22f-codex/add-ma-acquisition-financing-packages
      - run: zip -qr /tmp/pr179-current.zip . -x '.git/*' 'node_modules/*' 'artifacts/*'
      - uses: actions/upload-artifact@v4
        with:
          name: pr179-current-${{ github.sha }}
          path: /tmp/pr179-current.zip
          retention-days: 1
