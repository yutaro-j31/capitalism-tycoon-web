name: Internal Venture Business

on:
  pull_request:
    paths:
      - 'js/internal-venture-business.js'
      - 'css/internal-venture-business.css'
      - 'index.html'
      - 'tests/internal-venture-business-test.js'
      - 'tests/run-all.js'
      - '.github/workflows/internal-venture-business.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/internal-venture-business.js
      - run: node tests/internal-venture-business-test.js
