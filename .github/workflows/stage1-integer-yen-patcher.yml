name: Stage 1 Integer Yen Patcher

on:
  push:
    branches: [ fix/integer-yen-store-weekly-289 ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[stage1-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integer-yen-store-weekly-289
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved stage 1 store weekly integer-yen patch
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          engine_path = Path('js/engine.js')
          engine = engine_path.read_text()
          assert 'let storeCashDelta=0;' not in engine
          engine = engine.replace(
              '    const financeStores=[];\n    let sales=product.revenue+overseas.revenue+subs.revenue+franchise,expenses=product.cost+overseas.cost+finite(spoilage?.cost),supplyCogsNonCash=0,rentIncome=0,stockIncome=0,dividend=0,propertyDepreciation=0;',
              '    const financeStores=[];\n    let storeCashDelta=0;\n    let sales=product.revenue+overseas.revenue+subs.revenue+franchise,expenses=product.cost+overseas.cost+finite(spoilage?.cost),supplyCogsNonCash=0,rentIncome=0,stockIncome=0,dividend=0,propertyDepreciation=0;'
          )
          assert engine.count('store.lastSales=storeSales;store.lastProfit=storeSales-variable-fixed-repair;') == 2
          engine = engine.replace('store.lastSales=storeSales;store.lastProfit=storeSales-variable-fixed-repair;', '')
          assert engine.count('supplyCogsNonCash+=variable;') == 1
          engine = engine.replace('supplyCogsNonCash+=variable;', '')

          old_line = "      const rentPart=p.rent*this.g.inflation*([0,.55,.8,1,1.24][store.operatingHours||3]||1)*(this.g.macroCrisis?.costMultiplier||1);const wagePart=(b.wage+(market.isTargetBusinessID(store.businessID)?workforce.storeExtraPayroll(this.g,store.id):0))*this.g.inflation*([0,.55,.8,1,1.24][store.operatingHours||3]||1)*(this.g.macroCrisis?.costMultiplier||1);const otherFixed=Math.max(0,fixed-rentPart-wagePart);financeStores.push({storeID:store.id,businessID:store.businessID,name:store.name,sales:storeSales,variable,rent:rentPart,wage:wagePart,repair:repair+otherFixed,cogsCashEffect:(market.isTargetBusinessID(store.businessID)?0:undefined)});\n      store.condition=clamp(store.condition-rand(.1,1),40,100);sales+=storeSales;expenses+=variable+fixed+repair;}"
          new_block = """      const isSupplyStore=market.isTargetBusinessID(store.businessID);
      const rentPart=p.rent*this.g.inflation*([0,.55,.8,1,1.24][store.operatingHours||3]||1)*(this.g.macroCrisis?.costMultiplier||1);
      const wagePart=(b.wage+(isSupplyStore?workforce.storeExtraPayroll(this.g,store.id):0))*this.g.inflation*([0,.55,.8,1,1.24][store.operatingHours||3]||1)*(this.g.macroCrisis?.costMultiplier||1);
      const otherFixed=Math.max(0,fixed-rentPart-wagePart);
      const postedSales=Math.floor(Math.max(0,finite(storeSales)));
      const postedVariable=isSupplyStore?finite(variable):Math.floor(Math.max(0,finite(variable)));
      const postedRent=Math.floor(Math.max(0,finite(rentPart)));
      const postedWage=Math.floor(Math.max(0,finite(wagePart)));
      const postedMaintenance=Math.floor(Math.max(0,finite(repair+otherFixed)));
      if(isSupplyStore)supplyCogsNonCash+=postedVariable;
      const postedProfit=postedSales-postedVariable-postedRent-postedWage-postedMaintenance;
      store.lastSales=postedSales;store.lastProfit=isSupplyStore?postedProfit:Math.floor(postedProfit);
      financeStores.push({storeID:store.id,businessID:store.businessID,name:store.name,sales:postedSales,variable:postedVariable,rent:postedRent,wage:postedWage,repair:postedMaintenance,cogsCashEffect:(isSupplyStore?0:undefined)});
      storeCashDelta+=postedSales-(isSupplyStore?0:postedVariable)-postedRent-postedWage-postedMaintenance;
      store.condition=clamp(store.condition-rand(.1,1),40,100);sales+=postedSales;expenses+=postedVariable+postedRent+postedWage+postedMaintenance;}"""
          assert engine.count(old_line) == 1
          engine = engine.replace(old_line, new_block)

          old_cash = "    const profit=sales+rentIncome+stockIncome-expenses+subs.profit;this.g.companyCash+=profit+supplyCogsNonCash+finite(spoilage?.cost);this.g.companyCredit=clamp(this.g.companyCredit+(profit>=0?.15:-.3),0,100);this.g.companyReputation=clamp(this.g.companyReputation+(profit>0?.08:-.04),0,100);"
          new_cash = "    const profit=sales+rentIncome+stockIncome-expenses+subs.profit;const weeklyCashDelta=profit+supplyCogsNonCash+finite(spoilage?.cost),nonStoreCashDelta=weeklyCashDelta-storeCashDelta;this.g.companyCash+=nonStoreCashDelta+storeCashDelta;this.g.companyCredit=clamp(this.g.companyCredit+(profit>=0?.15:-.3),0,100);this.g.companyReputation=clamp(this.g.companyReputation+(profit>0?.08:-.04),0,100);"
          assert engine.count(old_cash) == 1
          engine = engine.replace(old_cash, new_cash)
          engine_path.write_text(engine)

          test = r'''const assert = require('node:assert/strict');
          const { loadGame } = require('./harness');

          function seededRandom(seedValue) {
            let seed = seedValue >>> 0;
            return () => {
              seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
              return seed / 0x100000000;
            };
          }

          function makeGame(seedValue) {
            const { modules } = loadGame({ random: seededRandom(seedValue), isolatedLegacyIndex: true });
            const { engine, finance, market, data } = modules;
            const state = engine.createInitialState({ configured: true });
            const business = state.businesses.find(row => !market.isTargetBusinessID(row.id));
            assert.ok(business, 'a legacy cash-COGS business is required');
            Object.assign(business, {
              price: 123.45,
              unitCost: 45.67,
              fixedCost: 100000.89,
              wage: 20000.78,
              demand: 0.25,
              quality: 0,
              brand: 0,
              efficiency: 0,
              dx: 0,
              storeCost: 0
            });
            const pref = state.prefs[0];
            pref.rent = 30000.67;
            pref.traffic = 1;
            state.companyCash = 1_000_000_000;
            state.companyDebt = 0;
            state.properties = [];
            state.startups = [];
            state.competitors = [];
            state.market = [];
            state.productVentures = [];
            state.subsidiaries = [];
            state.maSubsidiaries = [];
            state.overseasSubsidiaries = [];
            state.sportsTeams = [];
            state.personalInvestments = [];
            state.luxuryAssets = [];
            state.activeMissionIDs = [];
            state.completedMissionIDs = (data.MISSION_DEFS || []).map(row => row.id);
            state.stores = [{
              id: 'integer-store',
              businessID: business.id,
              prefID: pref.id,
              name: '整数円テスト店',
              status: 'open',
              condition: 99.876,
              operatingHours: 3,
              openingWeek: 1,
              weeksToOpen: 0,
              lastSales: 0,
              lastProfit: 0,
              marketResult: null
            }];
            state.finance = finance.defaultFinanceState(state);
            return { game: new engine.TycoonEngine(state), modules, storeID: 'integer-store' };
          }

          function run(seedValue, weeks) {
            const { game, modules, storeID } = makeGame(seedValue);
            const startingCash = game.g.companyCash;
            const initialAdjustments = game.g.finance.roundingAdjustmentCount || 0;
            let firstWeekRows = null;
            for (let i = 0; i < weeks; i++) {
              assert.equal(game.advanceWeek(false), true);
              const weekRows = game.g.finance.transactions.filter(row => row.week === game.g.week);
              const storeRows = weekRows.filter(row => row.storeID === storeID && [
                'revenue', 'costOfSales', 'rent', 'payroll', 'maintenance'
              ].includes(row.category));
              assert.equal(storeRows.length, 5, `week ${game.g.week} must record five store entries`);
              for (const row of storeRows) {
                assert.equal(Number.isInteger(row.amount), true, `${row.category} amount must be integer yen`);
                assert.equal(Number.isInteger(row.cashEffect), true, `${row.category} cashEffect must be integer yen`);
                assert.equal(Number.isInteger(row.profitEffect), true, `${row.category} profitEffect must be integer yen`);
              }
              const snapshot = game.g.finance.weeklySnapshots.find(row => row.week === game.g.week);
              assert.ok(snapshot, `week ${game.g.week} snapshot is required`);
              assert.ok(Math.abs(snapshot.cashDifference) <= 1e-9, `week ${game.g.week} cashDifference ${snapshot.cashDifference}`);
              if (!firstWeekRows) firstWeekRows = JSON.parse(JSON.stringify(storeRows));
            }
            const store = game.g.stores.find(row => row.id === storeID);
            assert.equal(Number.isInteger(store.lastSales), true);
            assert.equal(Number.isInteger(store.lastProfit), true);
            assert.equal(game.g.finance.roundingAdjustmentCount || 0, initialAdjustments, 'store-only weeks must not need rounding adjustments');
            const validation = modules.finance.validate(game.g);
            assert.equal(validation.ok, true, validation.errors.join(' / '));
            const restored = new modules.engine.TycoonEngine(JSON.parse(JSON.stringify(game.g)));
            const restoredValidation = modules.finance.validate(restored.g);
            assert.equal(restoredValidation.ok, true, restoredValidation.errors.join(' / '));
            return JSON.parse(JSON.stringify({
              cash: game.g.companyCash,
              cashDelta: game.g.companyCash - startingCash,
              storeLastSales: store.lastSales,
              storeLastProfit: store.lastProfit,
              roundingAdjustmentCount: game.g.finance.roundingAdjustmentCount || 0,
              firstWeekRows
            }));
          }

          const first = run(0x289001, 52);
          const second = run(0x289001, 52);
          assert.deepEqual(second, first, 'same seed and operations must remain deterministic');
          console.log(JSON.stringify(first, null, 2));
          console.log('store weekly integer-yen tests passed');
          '''
          Path('tests/store-weekly-integer-yen-test.js').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['test:store-weekly-integer-yen'] = 'node tests/store-weekly-integer-yen-test.js'
          package_path.write_text(json.dumps(package, ensure_ascii=False, separators=(',', ':')))

          run_all_path = Path('tests/run-all.js')
          run_all = run_all_path.read_text()
          marker = "  'test:finance','test:statements','test:cashflow','test:working-capital',"
          assert run_all.count(marker) == 1
          run_all = run_all.replace(marker, "  'test:finance','test:store-weekly-integer-yen','test:statements','test:cashflow','test:working-capital',")
          run_all_path.write_text(run_all)

          supply_path = Path('tests/supply-long-run-test.js')
          supply_text = supply_path.read_text()
          old_return = "return {count,weeks,orders:e.g.purchaseOrders.length,lots:activeLots,quantity:Number(totalQty.toFixed(2)),inventory:Number(modules.supply.physicalInventoryValue(e.g).toFixed(2)),ap:Number(e.g.finance.balances.accountsPayable.toFixed(2)),cash:Number(e.g.companyCash.toFixed(2)),saveBytes:saved.length};"
          new_return = "return {count,weeks,orders:e.g.purchaseOrders.length,lots:activeLots,quantity:Number(totalQty.toFixed(2)),inventory:Number(modules.supply.physicalInventoryValue(e.g).toFixed(2)),ap:Number(e.g.finance.balances.accountsPayable.toFixed(2)),cash:Number(e.g.companyCash.toFixed(2)),roundingAdjustmentCount:e.g.finance.roundingAdjustmentCount||0,roundingAdjustmentAbsoluteTotal:Number((e.g.finance.roundingAdjustmentAbsoluteTotal||0).toFixed(2)),saveBytes:saved.length};"
          assert supply_text.count(old_return) == 1
          supply_path.write_text(supply_text.replace(old_return, new_return))
          PY
          npm run test:store-weekly-integer-yen
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/engine.js tests/store-weekly-integer-yen-test.js tests/supply-long-run-test.js tests/run-all.js package.json
          git commit -m "fix: integerize store weekly cash postings [stage1-applied]"
          git push origin HEAD:fix/integer-yen-store-weekly-289
