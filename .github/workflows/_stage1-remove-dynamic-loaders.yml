name: Stage 1 remove dynamic loaders

on:
  push:
    branches: [fix/iphone-playtest-observer-livelock]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iphone-playtest-observer-livelock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove stage 1 dynamic script blocks
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const files=[
            'ma-portfolio-summary-ui.js','real-estate-capex-actuals-ui.js','real-estate-capex-actuals.js',
            'real-estate-capex-roi-ui.js','real-estate-capex-roi.js','real-estate-complete-cycle.js',
            'real-estate-development.js','real-estate-insurance-claims.js','real-estate-insurance-risk.js',
            'real-estate-maintenance-reserves.js','real-estate-mortgage-refinancing.js',
            'real-estate-portfolio-dashboard-ui.js','real-estate-portfolio-dashboard.js',
            'real-estate-property-disposals.js','real-estate-property-insurance.js',
            'real-estate-property-maintenance.js','real-estate-property-management.js',
            'real-estate-property-taxes.js','real-estate-redevelopment-projects.js',
            'real-estate-rent-guarantee.js','real-estate-rent-performance-ui.js',
            'real-estate-rent-performance.js','real-estate-rent-pricing.js','real-estate-risk-mitigation.js',
            'real-estate-safety-certification.js','real-estate-security-deposits.js',
            'real-estate-tenant-collections.js','real-estate-tenant-contracts.js',
            'real-estate-tenant-leasing.js','real-estate-tenant-operations.js',
            'real-estate-tenant-renewals.js','real-estate-ui.js','real-estate.js'
          ];
          function matchingBrace(source,open){let depth=0,quote='',escape=false,line=false,block=false;for(let i=open;i<source.length;i++){const c=source[i],n=source[i+1];if(line){if(c==='\n')line=false;continue;}if(block){if(c==='*'&&n==='/'){block=false;i++;}continue;}if(quote){if(escape){escape=false;continue;}if(c==='\\'){escape=true;continue;}if(c===quote)quote='';continue;}if(c==='/'&&n==='/'){line=true;i++;continue;}if(c==='/'&&n==='*'){block=true;i++;continue;}if(c==='\''||c==='"'||c==='`'){quote=c;continue;}if(c==='{')depth++;else if(c==='}'&&--depth===0)return i;}return -1;}
          function removeRange(source,start,end){while(start>0&&source[start-1]===' ')start--;return source.slice(0,start)+source.slice(end);}
          function replaceFunctionWithStaticGuard(source,name,moduleName){const start=source.indexOf(`function ${name}()`);if(start<0)return source;const brace=source.indexOf('{',start),end=matchingBrace(source,brace);if(end<0)throw new Error(`${name} brace mismatch`);return source.slice(0,start)+`function ${name}(){return Boolean(modules.${moduleName});}`+source.slice(end+1);}
          function removePortfolioWrapper(source){const fnStart=source.indexOf('function loadPerformance()');if(fnStart<0)return source;const fnBrace=source.indexOf('{',fnStart),fnEnd=matchingBrace(source,fnBrace);if(fnEnd<0)throw new Error('portfolio loader helper brace mismatch');source=removeRange(source,fnStart,fnEnd+1);const ifStart=source.indexOf('if(!modules.realEstateRentPricing)');if(ifStart<0)throw new Error('portfolio pricing loader condition missing');const ifBrace=source.indexOf('{',ifStart),ifEnd=matchingBrace(source,ifBrace);if(ifEnd<0)throw new Error('portfolio pricing loader brace mismatch');let end=ifEnd+1;const suffix=source.slice(end).match(/^\s*else\s+loadPerformance\(\);?/);if(suffix)end+=suffix[0].length;return removeRange(source,ifStart,end);}
          function removeBlocks(source,name){let changed=0,pos=0;if(name==='real-estate-portfolio-dashboard-ui.js'){const before=source;source=removePortfolioWrapper(source);if(source!==before)changed+=2;}if(name==='real-estate-ui.js'){const before=source;source=replaceFunctionWithStaticGuard(source,'loadDevelopment','realEstateDevelopment');if(source!==before)changed++;}
            for(;;){const hits=[source.indexOf("document.createElement('script')",pos),source.indexOf('document.createElement("script")',pos)].filter(x=>x>=0);if(!hits.length)break;const hit=Math.min(...hits);let start=source.lastIndexOf('if',hit),found=false;while(start>=0){const paren=source.indexOf('(',start),brace=source.indexOf('{',paren);if(paren>=0&&brace>=0&&brace<hit){const end=matchingBrace(source,brace);if(end>=hit){const block=source.slice(start,end+1);if(/appendChild\s*\(/.test(block)){source=removeRange(source,start,end+1);changed++;pos=start;found=true;break;}}}start=source.lastIndexOf('if',start-1);}if(!found)throw new Error(`${name}: dynamic script block was not recognized near ${hit}`);}return{source,changed};}
          let total=0;
          for(const name of files){const file=path.join('js',name),before=fs.readFileSync(file,'utf8'),out=removeBlocks(before,name);if(out.changed<1)throw new Error(`${name}: expected at least one loader construct`);if(/document\.createElement\(\s*['"]script['"]\s*\)/.test(out.source))throw new Error(`${name}: loader remains`);fs.writeFileSync(file,out.source);total+=out.changed;console.log(`${name}: removed ${out.changed}`);}
          console.log(`removed constructs: ${total}`);
          NODE
      - name: Validate remaining special loaders and static registration
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const remaining=[];
          for(const name of fs.readdirSync('js').filter(x=>x.endsWith('.js')).sort()){
            const source=fs.readFileSync(path.join('js',name),'utf8');
            if(/document\.createElement\(\s*['"]script['"]\s*\)/.test(source))remaining.push(name);
          }
          const expected=['strategy-balance.js','treasury-prepayment.js','treasury-refinancing-policy.js'];
          if(JSON.stringify(remaining)!==JSON.stringify(expected))throw new Error(`remaining loaders: ${JSON.stringify(remaining)}`);
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]+src=["']\.\/js\/([^"'?]+\.js)/g)].map(m=>m[1]);
          const duplicates=scripts.filter((x,i)=>scripts.indexOf(x)!==i);
          if(duplicates.length)throw new Error(`duplicate static scripts: ${[...new Set(duplicates)].join(', ')}`);
          for(const name of files)if(!scripts.includes(name))throw new Error(`${name} is not statically registered`);
          console.log(`static scripts: ${scripts.length}; remaining special loaders: ${remaining.join(', ')}`);
          NODE
      - name: Run canonical tests
        run: |
          if [ -f package.json ]; then npm test --if-present; fi
          if [ -f tests/run-all.js ]; then node tests/run-all.js; fi
      - name: Commit stage 1 rewrite
        run: |
          rm .github/workflows/_stage1-remove-dynamic-loaders.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js .github/workflows/_stage1-remove-dynamic-loaders.yml
          git commit -m "Fix boot by removing legacy dynamic script chain"
          git push origin HEAD:fix/iphone-playtest-observer-livelock
