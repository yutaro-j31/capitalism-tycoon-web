name: Real Estate Tenant Collections

on:
  pull_request:
    paths:
      - 'js/real-estate-tenant-collections.js'
      - 'js/real-estate-tenant-collections-ui.js'
      - 'js/real-estate-tenant-renewals.js'
      - 'tests/real-estate-tenant-collections-test.js'
      - '.github/workflows/real-estate-tenant-collections.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-collections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tenant collections regression
        run: node tests/real-estate-tenant-collections-test.js
      - name: Run tenant renewals regression
        run: node tests/real-estate-tenant-renewals-test.js
      - name: Run tenant operations regression
        run: node tests/real-estate-tenant-operations-test.js
      - name: Run tenant contracts regression
        run: node tests/real-estate-tenant-contracts-test.js
      - name: Run transaction safety regression
        run: node tests/week-test.js
