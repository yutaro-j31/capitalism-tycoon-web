name: Phase 6A-2C Diagnostic
on:
  push:
    branches: [ chatgpt/phase-6a2c-guided-liquidation ]
  pull_request:
jobs:
  restructuring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture module boundary output
        shell: bash
        run: |
          set +e
          npm run test:modules > module-test.log 2>&1
          echo "$?" > module-test.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase6a2c-module-log
          path: |
            module-test.log
            module-test.status
      - name: Enforce module boundary result
        shell: bash
        run: |
          cat module-test.log
          test "$(cat module-test.status)" = "0"
      - run: node tests/player-crisis-restructuring-test.js
