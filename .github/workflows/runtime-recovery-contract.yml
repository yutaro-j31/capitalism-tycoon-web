name: Runtime Recovery Contract

on:
  pull_request:
    paths:
      - 'js/*recovery*.js'
      - 'js/app.js'
      - 'js/engine.js'
      - 'js/finance.js'
      - 'js/save*.js'
      - 'js/*normalize*.js'
      - 'index.html'
      - 'play.html'
      - 'package.json'
      - 'tests/harness.js'
      - 'tests/run-all.js'
      - 'tests/boot-recovery-*.js'
      - 'tests/runtime-recovery-*.js'
      - 'tests/static-check.js'
      - '.github/workflows/runtime-recovery-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-recovery-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify boot recovery contract
        shell: bash
        run: |
          mkdir -p artifacts/runtime-recovery-contract
          set +e
          node tests/boot-recovery-test.js > artifacts/runtime-recovery-contract/boot.log 2>&1
          STATUS=$?
          cat artifacts/runtime-recovery-contract/boot.log
          exit "$STATUS"
      - name: Verify runtime recovery contract
        shell: bash
        run: |
          set +e
          node tests/runtime-recovery-ui-test.js > artifacts/runtime-recovery-contract/unit.log 2>&1
          STATUS=$?
          cat artifacts/runtime-recovery-contract/unit.log
          exit "$STATUS"
      - name: Verify static integration
        shell: bash
        run: |
          set +e
          node tests/static-check.js > artifacts/runtime-recovery-contract/static.log 2>&1
          STATUS=$?
          cat artifacts/runtime-recovery-contract/static.log
          exit "$STATUS"
      - name: Retain runtime recovery contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-recovery-contract-${{ github.sha }}
          path: artifacts/runtime-recovery-contract
          if-no-files-found: error
          retention-days: 14
