name: Runtime Recovery Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-recovery-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify runtime recovery contract
        run: node tests/runtime-recovery-ui-test.js
      - name: Verify static integration
        run: node tests/static-check.js
