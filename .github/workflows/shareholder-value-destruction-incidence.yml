name: Shareholder Value Destruction Incidence

on:
  pull_request:
    paths:
      - 'js/shareholder-value-destruction.js'
      - 'js/shareholder-activism.js'
      - 'js/engine.js'
      - 'js/finance.js'
      - 'index.html'
      - 'tests/shareholder-value-destruction-*'
      - 'tests/harness.js'
      - 'tests/run-all.js'
      - 'tests/run-all-shards.json'
      - '.github/workflows/shareholder-value-destruction-incidence.yml'
  workflow_dispatch:

jobs:
  incidence:
    name: ${{ matrix.style }}-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        style: [sustained-destruction, timely-recovery, healthy-market]
        seed: ['0x6b200101', '0x6b200202', '0x6b200303']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic 208-week incidence case twice
        env:
          VALUE_DESTRUCTION_STYLE: ${{ matrix.style }}
          VALUE_DESTRUCTION_SEED: ${{ matrix.seed }}
        run: node tests/shareholder-value-destruction-incidence-matrix-test.js
