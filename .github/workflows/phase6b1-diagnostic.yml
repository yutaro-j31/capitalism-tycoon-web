name: Phase 6B-1 Diagnostic
on:
  pull_request:
jobs:
  normal-ipo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run normal-start IPO audit
        run: |
          set +e
          node tests/normal-start-ipo-balance-audit-test.js > phase6b1-audit.log 2>&1
          status=$?
          cat phase6b1-audit.log
          echo "$status" > phase6b1-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase6b1-audit
          path: |
            phase6b1-audit.log
            phase6b1-status.txt
