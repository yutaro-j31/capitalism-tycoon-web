name: Real Estate Maintenance Reserves
on:
  pull_request:
    paths:
      - 'js/real-estate-maintenance-reserves.js'
      - 'js/real-estate-maintenance-reserves-ui.js'
      - 'js/real-estate-property-insurance.js'
      - 'tests/real-estate-maintenance-reserves-test.js'
      - '.github/workflows/real-estate-maintenance-reserves.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/real-estate-maintenance-reserves-test.js