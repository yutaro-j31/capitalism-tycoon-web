# Experimental verification ONLY. This workflow exists on a draft vNext branch,
# is not merged into main, and is restricted to the proof branch or its own PR.
# Never consume production saved games or publish user data.
name: vNext isolated proof (experimental)

on:
  push:
    branches:
      - 'experiment/economic-engine-vnext-po-provenance-*'
  pull_request:
    branches:
      - 'experiment/economic-engine-vnext-legacy-bridge-*'
    paths:
      - '.github/workflows/vnext-isolated-proof.yml'

permissions:
  contents: read

concurrency:
  group: vnext-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vnext-direct-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify checked-out commit and Node
        run: |
          git rev-parse HEAD
          node --version
      - name: Execute all twelve experimental suites in actual Node
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            core.test.cjs \
            equity.test.cjs \
            store.test.cjs \
            unified.test.cjs \
            13-week.test.cjs \
            legacy-crosswalk.test.cjs \
            legacy-13week-capture.test.cjs \
            legacy-observation-analysis.test.cjs \
            inventory-ap.test.cjs \
            operating.test.cjs \
            legacy-week-bridge.test.cjs \
            legacy-source-graph.test.cjs
          do
            echo "::group::Direct Node: $script"
            node "experiments/economic-engine-vnext/$script"
            echo "::endgroup::"
          done

  legacy-13week-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute actual disposable legacy game for 13 weeks
        id: observe
        shell: bash
        run: |
          mkdir -p vnext-proof
          node --version > vnext-proof/node-version.txt
          git rev-parse HEAD > vnext-proof/source-sha.txt
          set +e
          node experiments/economic-engine-vnext/legacy-13week-headless.cjs \
            > vnext-proof/legacy-observation.json \
            2> vnext-proof/legacy-stderr.txt
          status=$?
          set -e
          echo "$status" > vnext-proof/exit-code.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "Legacy runner exit: $status"
          cat vnext-proof/legacy-stderr.txt
          if test "$status" -eq 0; then
            node -e "const r=require('./vnext-proof/legacy-observation.json');console.log(JSON.stringify({status:r.legacyEvidenceClassification?.status,reasons:r.legacyEvidenceClassification?.reasons,observedWeeks:r.observedWeeks,observedStore:r.observedStore},null,2))"
          fi
          exit "$status"
      - name: Verify real source against 13-week cash-profit-inventory-AP bridge
        shell: bash
        run: |
          set -euo pipefail
          node experiments/economic-engine-vnext/legacy-week-bridge-cli.cjs \
            vnext-proof/legacy-observation.json > vnext-proof/legacy-bridge.json
          node -e "const r=require('./vnext-proof/legacy-bridge.json');console.log(JSON.stringify({status:r.status,weeks:r.weeks,storeRows:r.storeRows,storeCashMinor:r.sourceCashMinor,storeProfitMinor:r.sourceProfitMinor,blockers:r.blockers},null,2))"
      - name: Verify purchase-order provenance and opening finance source graph
        shell: bash
        run: |
          set -euo pipefail
          node experiments/economic-engine-vnext/legacy-source-graph-cli.cjs \
            vnext-proof/legacy-observation.json > vnext-proof/purchase-order-graph.json
          node -e "const r=require('./vnext-proof/purchase-order-graph.json');console.log(JSON.stringify({status:r.status,weeks:r.weeks,counts:r.counts,blockers:r.blockers},null,2))"
      - name: Retain disposable experimental observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnext-legacy-13week-proof
          path: vnext-proof/
          if-no-files-found: warn
          retention-days: 7

  implementation-release-readiness:
    name: Implementation PR release gate (${{ matrix.pr }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - pr: "1054"
            sha: "af45449b04ade04002e74dd0020a273b01ab8902"
          - pr: "1058"
            sha: "be176e8d01f721556a8f0cda506c132f9503bbf5"
          - pr: "1059"
            sha: "e966b25730ef300ead27719d461bd15f81bc17fc"
          - pr: "1063"
            sha: "fd4bd9dfe0040a20452652591ed97d8af685b8cb"
          - pr: "1064"
            sha: "8c8775e061477f68b62941e3925af6bb35365cd3"
    steps:
      - name: Check out exact implementation HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check source SHA and seven-workflow contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          test "$(find .github/workflows -maxdepth 1 -name '*.yml' | wc -l | tr -d ' ')" = "7"
          test ! -e .github/workflows/vnext-isolated-proof.yml
          node tests/workflow-path-filter-contract-test.js
      - name: Prepare release-readiness diagnostics
        run: mkdir -p artifacts/release-readiness
      - name: Run standard release balance gate
        shell: bash
        run: |
          set -o pipefail
          node scripts/release-gate.js 2>&1 | tee artifacts/release-readiness/balance.log
      - name: Run standard release hardening gate
        shell: bash
        run: |
          set -o pipefail
          node scripts/release-hardening-gate.js 2>&1 | tee artifacts/release-readiness/hardening.log
      - name: Run standard release delivery gate
        shell: bash
        run: |
          set -o pipefail
          node scripts/release-delivery-gate.js 2>&1 | tee artifacts/release-readiness/delivery.log
      - name: Preserve exact-source release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnext-pr-${{ matrix.pr }}-release-readiness
          path: artifacts/release-readiness
          if-no-files-found: warn
          retention-days: 7
