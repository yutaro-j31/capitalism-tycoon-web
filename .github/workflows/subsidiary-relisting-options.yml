name: Subsidiary Relisting Options

on:
  pull_request:
    paths:
      - 'js/subsidiary-relisting-options.js'
      - 'tests/subsidiary-relisting-options-test.js'
      - 'play.html'
      - 'tests/run-all.js'
      - '.github/workflows/subsidiary-relisting-options.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/subsidiary-relisting-options.js
      - run: node tests/subsidiary-relisting-options-test.js
