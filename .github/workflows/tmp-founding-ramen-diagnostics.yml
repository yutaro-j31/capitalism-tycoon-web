name: Temporary Founding Ramen Diagnostics

on:
  push:
    branches:
      - tmp/founding-ramen-diagnostics

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        threshold: [none, 60, 70, 80]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calibrate ramen renovation policy
        env:
          RENOVATE_THRESHOLD: ${{ matrix.threshold }}
        run: node tests/tmp-founding-ramen-diagnostics.js
