name: Temporary Founding Ramen Diagnostics

on:
  push:
    branches:
      - tmp/founding-ramen-diagnostics

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose mature ramen chain
        run: node tests/tmp-founding-ramen-diagnostics.js
