name: Bootstrap boot diagnostics

on:
  push:
    branches:
      - fix/boot-observer-livelock-diagnostics
    paths:
      - .github/workflows/_bootstrap-boot-diagnostics.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boot-observer-livelock-diagnostics
          fetch-depth: 0
      - name: Patch canonical entry and WebKit gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          target = '<script src="./js/boot-recovery.js"></script>'
          diagnostic = '<script src="./js/boot-diagnostics.js"></script>'
          if diagnostic not in text:
              if target not in text:
                  raise SystemExit('boot-recovery script tag not found')
              text = text.replace(target, diagnostic + target, 1)
              index.write_text(text)

          workflow = Path('.github/workflows/iphone-webkit-smoke.yml')
          content = workflow.read_text()
          marker = '  push:\n    branches: [main]\n'
          pull_request = '  pull_request:\n    branches: [main]\n'
          if pull_request not in content:
              if marker not in content:
                  raise SystemExit('iphone workflow push trigger not found')
              content = content.replace(marker, marker + pull_request, 1)
              workflow.write_text(content)
          PY
          rm .github/workflows/_bootstrap-boot-diagnostics.yml
      - name: Validate patch
        run: |
          grep -q '<script src="./js/boot-diagnostics.js"></script><script src="./js/boot-recovery.js"></script>' index.html
          grep -q 'pull_request:' .github/workflows/iphone-webkit-smoke.yml
          node --check js/boot-diagnostics.js
          node --check tests/boot-observer-diagnostics-test.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/iphone-webkit-smoke.yml .github/workflows/_bootstrap-boot-diagnostics.yml
          git commit -m "diagnostics: wire earliest boot probe and PR WebKit gate"
          git push origin HEAD:fix/boot-observer-livelock-diagnostics
