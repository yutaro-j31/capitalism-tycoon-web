name: Phase 6A-4B Diagnostic
on:
  pull_request:
    branches:
      - main
jobs:
  creditor-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run focused creditor UI test
        shell: bash
        run: |
          set +e
          node tests/player-crisis-creditor-ui-test.js > phase6a4b-diagnostic.log 2>&1
          status=$?
          echo "exit_status=$status" >> phase6a4b-diagnostic.log
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: phase6a4b-diagnostic-log
          path: phase6a4b-diagnostic.log
          retention-days: 1
