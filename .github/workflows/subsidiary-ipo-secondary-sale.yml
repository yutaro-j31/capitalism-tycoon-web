name: Subsidiary IPO Secondary Sale

on:
  pull_request:
    paths:
      - 'js/subsidiary-ipo-secondary-sale.js'
      - 'js/ma-portfolio-summary-ui.js'
      - 'tests/subsidiary-ipo-secondary-sale-test.js'
      - '.github/workflows/subsidiary-ipo-secondary-sale.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check js/subsidiary-ipo-secondary-sale.js
          node --check js/ma-portfolio-summary-ui.js
          node --check tests/subsidiary-ipo-secondary-sale-test.js
      - name: Feature regression
        run: node tests/subsidiary-ipo-secondary-sale-test.js
      - name: Static contracts
        run: npm run test:static
