name: Issue 294 Executive Hiring Diagnostic
'on':
  pull_request:
    paths:
      - 'tests/issue-294-executive-hiring-diagnostic.js'
      - 'tests/normal-start-ipo-balance-audit-test.js'
      - '.github/workflows/issue-294-executive-hiring-diagnostic.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/issue-294-executive-hiring-diagnostic.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-294-executive-hiring
          path: artifacts/issue-294-executive-hiring.json
          if-no-files-found: error
          retention-days: 7
