name: Pages Deployment Smoke

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deployment-smoke
  cancel-in-progress: true

jobs:
  verify-publication-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out expected main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify public GitHub Pages files match main
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PAGES_VERIFY_ATTEMPTS: '16'
          PAGES_VERIFY_DELAY_MS: '15000'
        run: node scripts/verify-published-pages.js

  verify-published-assets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for GitHub Pages and verify exact static assets
        env:
          PAGES_SMOKE_ATTEMPTS: '20'
          PAGES_SMOKE_DELAY_MS: '30000'
          PAGES_SMOKE_REQUEST_TIMEOUT_MS: '15000'
        run: node scripts/pages-deployment-smoke.js
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Exercise published GitHub Pages in iPhone WebKit
        env:
          IPHONE_WEBKIT_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/iphone-webkit-smoke-test.js
      - name: Verify published weekly impact recap
        env:
          WEEKLY_IMPACT_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/published-weekly-impact-webkit-test.js
      - name: Verify published founding tutorial
        env:
          FOUNDING_TUTORIAL_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/published-founding-tutorial-webkit-test.js
      - name: Verify published recovery target synchronization
        env:
          CAPITAL_ALLOCATION_RECOVERY_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/capital-allocation-recovery-webkit-test.js
      - name: Verify published recovery funding outcome
        env:
          CAPITAL_ALLOCATION_RECOVERY_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/capital-allocation-recovery-outcome-webkit-test.js
      - name: Verify published iPhone save quota recovery
        env:
          SAVE_QUOTA_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/published-save-quota-webkit-test.js
      - name: Retain published WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-iphone-webkit-smoke-${{ github.sha }}
          path: artifacts/published-iphone-webkit-smoke
          if-no-files-found: warn
          retention-days: 30
