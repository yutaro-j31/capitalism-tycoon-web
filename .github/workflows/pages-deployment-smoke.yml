name: Pages Deployment Smoke

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: pages-deployment-smoke
  cancel-in-progress: true

jobs:
  # Published checks must compare against the Pages deployment of exactly this
  # commit. GitHub's dynamic "pages build and deployment" run finished 2-46
  # minutes after the push on 2026-10-15 (d0802d88, 743d08d1, c45b2c9e), so the
  # byte verifiers' fixed retry budgets expired first, and for c45b2c9e the
  # 7-file attestation passed against the previous deployment. This job waits
  # for the github-pages deployment status of github.sha to reach success and
  # fails as SUPERSEDED (never passes) if main or the live deployment moved on.
  # It only polls the API (no browser); 120 x 30 s covers the observed 46 min.
  wait-for-pages-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the GitHub Pages deployment of this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          PAGES_DEPLOYMENT_BRANCH: main
          PAGES_DEPLOYMENT_WAIT_ATTEMPTS: '120'
          PAGES_DEPLOYMENT_WAIT_DELAY_MS: '30000'
        run: node scripts/wait-for-pages-deployment.js

  verify-publication-attestation:
    needs: wait-for-pages-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out expected main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify public GitHub Pages files match main
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PAGES_VERIFY_ATTEMPTS: '16'
          PAGES_VERIFY_DELAY_MS: '15000'
        run: node scripts/verify-published-pages.js

  verify-published-assets:
    if: github.event_name != 'schedule'
    needs: [ wait-for-pages-deployment, verify-publication-attestation ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for GitHub Pages and verify exact static assets
        env:
          PAGES_SMOKE_ATTEMPTS: '20'
          PAGES_SMOKE_DELAY_MS: '30000'
          PAGES_SMOKE_REQUEST_TIMEOUT_MS: '15000'
        run: node scripts/pages-deployment-smoke.js
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        # Bounded retry: the install has stalled for the whole job budget several times (CLAUDE.md §7);
        # a fresh attempt normally finishes in under two minutes. Two 6-minute attempts fit every job budget.
        run: |
          for attempt in 1 2; do
            timeout --kill-after=30s 6m npx playwright install --with-deps webkit && exit 0
            echo "::warning::WebKit install attempt $attempt failed or stalled; retrying"
          done
          exit 1
      - name: Exercise published GitHub Pages in iPhone WebKit
        env:
          IPHONE_WEBKIT_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/iphone-webkit-smoke-test.js
      - name: Verify published Phase 2 map (opens the map tab, waits for load, switches prefectures)
        env:
          MAP_PHASE2_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/published-map-phase2-webkit-test.js
      - name: Verify published weekly impact recap
        env:
          WEEKLY_IMPACT_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/published-weekly-impact-webkit-test.js
      - name: Verify published founding tutorial
        env:
          FOUNDING_TUTORIAL_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/published-founding-tutorial-webkit-test.js
      - name: Verify published recovery target synchronization
        env:
          CAPITAL_ALLOCATION_RECOVERY_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/capital-allocation-recovery-webkit-test.js
      - name: Verify published recovery funding outcome
        env:
          CAPITAL_ALLOCATION_RECOVERY_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/capital-allocation-recovery-outcome-webkit-test.js
      - name: Verify published iPhone save quota recovery
        env:
          SAVE_QUOTA_TARGET_URL: https://yutaro-j31.github.io/capitalism-tycoon-web/
          IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/published-iphone-webkit-smoke
        run: node tests/published-save-quota-webkit-test.js
      - name: Confirm this commit stayed the live Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          PAGES_DEPLOYMENT_BRANCH: main
          PAGES_DEPLOYMENT_MODE: confirm
        run: node scripts/wait-for-pages-deployment.js
      - name: Retain published WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-iphone-webkit-smoke-${{ github.sha }}
          path: artifacts/published-iphone-webkit-smoke
          if-no-files-found: error
          overwrite: true
          retention-days: 30
