name: Executive Secretary

on:
  pull_request:
    paths:
      - 'js/executive-secretary.js'
      - 'js/app.js'
      - 'index.html'
      - 'css/app.css'
      - 'tests/executive-secretary-test.js'
      - 'tests/executive-secretary-purity-test.js'
      - 'tests/executive-secretary-ui-test.js'
      - 'tests/fixtures/extracted-css-baseline.css'
      - 'tests/fixtures/module-load-order.json'
      - 'tests/javascript-extraction-test.js'
      - 'tests/javascript-module-split-test.js'
      - 'tests/player-bank-covenants-test.js'
      - 'tests/run-all.js'
      - '.github/workflows/executive-secretary.yml'
  push:
    branches: [main]
    paths:
      - 'js/executive-secretary.js'
      - 'js/app.js'
      - 'index.html'
      - 'css/app.css'
      - 'tests/executive-secretary-test.js'
      - 'tests/executive-secretary-purity-test.js'
      - 'tests/executive-secretary-ui-test.js'
      - 'tests/fixtures/extracted-css-baseline.css'
      - 'tests/fixtures/module-load-order.json'
      - 'tests/javascript-extraction-test.js'
      - 'tests/javascript-module-split-test.js'
      - 'tests/player-bank-covenants-test.js'
      - 'tests/run-all.js'
      - '.github/workflows/executive-secretary.yml'

permissions:
  contents: read

jobs:
  executive-secretary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and extracted assets
        run: |
          npm run test:syntax
          npm run test:static
          npm run test:css
          npm run test:javascript
          npm run test:modules
      - name: Verify executive secretary logic and purity
        run: |
          node tests/executive-secretary-test.js
          node tests/executive-secretary-purity-test.js
          node tests/executive-secretary-ui-test.js
      - name: Verify debt fixture compatibility
        run: node tests/player-bank-covenants-test.js
