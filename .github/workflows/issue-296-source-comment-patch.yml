name: Apply Issue 296 macro comment
on:
  push:
    branches:
      - fix/issue-296-document-macro-canonicalization
    paths:
      - '.github/workflows/issue-296-source-comment-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-296-document-macro-canonicalization
      - name: Document intentional canonical replacement
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/deterministic-economic-foundation.js')
          s=p.read_text()
          needle="proto.updateMacro=function(){return step(this.g);};"
          replacement="/* ISSUE-296-CANONICAL-UPDATE-MACRO: Intentional non-delegating replacement. The legacy RNG-based core macro updater is superseded by step() to guarantee save-stable determinism. macro-cycle.js remains connected independently through the weekly product-innovation/advanceWeek hook and continues to own regimes, industry demand multipliers, and timed events. */proto.updateMacro=function(){return step(this.g);};"
          if replacement not in s:
              if needle not in s: raise SystemExit('updateMacro assignment signature changed')
              p.write_text(s.replace(needle,replacement,1))
          PY
          git rm .github/workflows/issue-296-source-comment-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/deterministic-economic-foundation.js
          git commit -m 'docs: explain deterministic macro canonicalization'
          git push origin HEAD:fix/issue-296-document-macro-canonicalization
