name: D UI Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d-ui-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  d-ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify D UI shell contract
        run: node tests/d-ui-shell-test.js
      - name: Verify JavaScript module boundaries
        run: node tests/javascript-module-split-test.js
      - name: Verify JavaScript extraction
        run: node tests/javascript-extraction-test.js
