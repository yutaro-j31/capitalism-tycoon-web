name: Group Capital Allocation Plan
on:
  pull_request:
    paths:
      - 'js/group-capital-allocation-plan.js'
      - 'index.html'
      - 'tests/group-capital-allocation-plan-test.js'
      - '.github/workflows/group-capital-allocation-plan.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/group-capital-allocation-plan.js
      - run: node tests/group-capital-allocation-plan-test.js
      - run: npm run test:static
      - name: Production wiring
        run: grep -q 'js/group-capital-allocation-plan.js' index.html
