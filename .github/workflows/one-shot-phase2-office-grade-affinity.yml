name: One-shot Phase 2 office grade affinity

on:
  push:
    branches:
      - feat/phase2-office-grade-affinity

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply candidate implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'js/map-phase2-canvas.js',
              "    return {id:`office:${office.id}`,kind:'office',sourceId:office.id,pref:office.prefID,label,rawID:office.id,name:label,office};",
              "    return {id:`office:${office.id}`,kind:'office',sourceId:office.id,pref:office.prefID,label,rawID:office.id,name:label,office,officeGrade:office.grade};"
          )

          old_kind = """const KIND_SURFACES={
            store:{preferred:['commercial.small','commercial.mid','commercial.hero'],allowed:['office.small','office.mid']},
            tenant:{preferred:['commercial.small','commercial.mid','commercial.hero'],allowed:['office.small','office.mid','office.hero']},
            office:{preferred:['office.hero','office.mid','office.small'],allowed:['commercial.hero','commercial.mid']}
          };"""
          new_kind = """const KIND_SURFACES={
            store:{preferred:['commercial.small','commercial.mid','commercial.hero'],allowed:['office.small','office.mid']},
            tenant:{preferred:['commercial.small','commercial.mid','commercial.hero'],allowed:['office.small','office.mid','office.hero']},
            office:{preferred:['office.hero','office.mid','office.small'],allowed:['commercial.hero','commercial.mid']}
          };
          /* Rental-office grade affinity: C=small, B=mid, A=hero. */
          const OFFICE_GRADE_SURFACES={
            C:{preferred:['office.small'],allowed:['office.mid','office.hero','commercial.mid','commercial.hero']},
            B:{preferred:['office.mid'],allowed:['office.small','office.hero','commercial.mid','commercial.hero']},
            A:{preferred:['office.hero'],allowed:['office.mid','office.small','commercial.hero','commercial.mid']}
          };"""
          replace_once('js/map-phase2-canvas.js', old_kind, new_kind)

          replace_once(
              'js/map-phase2-canvas.js',
              """function surfaceRulesFor(entity){
            if(entity.kind==='realestate')return PROPERTY_KIND_SURFACES[entity.propertyKind]||DEFAULT_PROPERTY_SURFACES;
            return KIND_SURFACES[entity.kind]||EMPTY_SURFACE_RULES;
          }""",
              """function surfaceRulesFor(entity){
            if(entity.kind==='realestate')return PROPERTY_KIND_SURFACES[entity.propertyKind]||DEFAULT_PROPERTY_SURFACES;
            if(entity.kind==='office'&&entity.officeGrade)return OFFICE_GRADE_SURFACES[entity.officeGrade]||KIND_SURFACES.office;
            return KIND_SURFACES[entity.kind]||EMPTY_SURFACE_RULES;
          }"""
          )

          replace_once(
              'tests/map-marker-building-affinity-test.js',
              "  for (let i = 0; i < 3; i++) entities.push({ id: `office:o${i}`, kind: 'office', sourceId: `o${i}` });",
              "  for (const grade of ['C', 'B', 'A']) entities.push({ id: `office:${grade}`, kind: 'office', sourceId: grade, officeGrade: grade });"
          )
          replace_once(
              'tests/map-marker-building-affinity-test.js',
              "        prefID, kind: entity.kind, propertyKind: entity.propertyKind,",
              "        prefID, kind: entity.kind, propertyKind: entity.propertyKind, officeGrade: entity.officeGrade,"
          )

          grade_checks = r'''

            await check('office view-model preserves the real A/B/C rental-office grade without mutating state', () => {
              const raw = { id: 'office-c', prefID: 'tokyo', name: '東京 スモールHQ', grade: 'C', rent: 12345 };
              const g = { selectedPref: 'tokyo', stores: [], tenants: [], rentalOffices: [raw], properties: [] };
              const view = mod.buildMapViewModel(g, null);
              assert.equal(view.entities.length, 1);
              assert.equal(view.entities[0].officeGrade, 'C');
              assert.equal(view.entities[0].office, raw, 'view-model must keep the existing read-only raw-state reference');
              assert.equal(raw.grade, 'C', 'adapter must not mutate the rental-office state');
            });

            await check('ACCEPTANCE 4b: C/B/A office candidates prefer small/mid/hero office stock respectively', () => {
              const expected = { C: 'office.small', B: 'office.mid', A: 'office.hero' };
              for (const [grade, surface] of Object.entries(expected)) {
                const sample = of(r => r.kind === 'office' && r.officeGrade === grade);
                assert.ok(sample.length >= PREFS.length, `expected one ${grade}-grade office per prefecture`);
                for (const row of sample) assert.equal(row.surface, surface, `${row.prefID}: grade ${grade} office landed on ${row.surface}`);
              }
            });

            await check('unknown office grades retain the generic office affinity fallback', () => {
              const placed = mod.placeEntityTiles([{ id: 'office:future', kind: 'office', sourceId: 'future', officeGrade: 'S' }], 'tokyo');
              assert.equal(placed.length, 1);
              assert.notEqual(placed[0].tileX, null, 'future/unknown grade must remain placeable through generic office rules');
            });
          '''
          anchor = """  await check('物流 property markers land on logistics stock or industrial open ground, never on shops or housing', () => {"""
          p = Path('tests/map-marker-building-affinity-test.js')
          text = p.read_text()
          if text.count(anchor) != 1:
              raise SystemExit('test insertion anchor not unique')
          p.write_text(text.replace(anchor, grade_checks + '\n\n' + anchor, 1))
          PY
      - name: Restamp candidate
        run: node scripts/stamp-asset-revision.js
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== node --check js/map-phase2-canvas.js ==='
            node --check js/map-phase2-canvas.js
            echo "EXIT=$?"
            echo
            echo '=== node tests/map-marker-building-affinity-test.js ==='
            node tests/map-marker-building-affinity-test.js
            echo "EXIT=$?"
          } > /tmp/office-affinity-validation.txt 2>&1
          cat /tmp/office-affinity-validation.txt
          git restore .
          cp /tmp/office-affinity-validation.txt validation-office-affinity.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation-office-affinity.txt
          git commit -m "ci: capture office affinity validation output"
          git push origin HEAD:${GITHUB_REF_NAME}
