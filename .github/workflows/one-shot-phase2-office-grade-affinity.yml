name: One-shot Phase 2 office grade affinity

on:
  push:
    branches:
      - feat/phase2-office-grade-affinity

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Implement grade-aware office marker affinity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'js/map-phase2-canvas.js',
              "    return {id:`office:${office.id}`,kind:'office',sourceId:office.id,pref:office.prefID,label,rawID:office.id,name:label,office};",
              "    return {id:`office:${office.id}`,kind:'office',sourceId:office.id,pref:office.prefID,label,rawID:office.id,name:label,office,officeGrade:office.grade};"
          )

          old_kind = """const KIND_SURFACES={
            store:{preferred:['commercial.small','commercial.mid','commercial.hero'],allowed:['office.small','office.mid']},
            tenant:{preferred:['commercial.small','commercial.mid','commercial.hero'],allowed:['office.small','office.mid','office.hero']},
            office:{preferred:['office.hero','office.mid','office.small'],allowed:['commercial.hero','commercial.mid']}
          };"""
          new_kind = """const KIND_SURFACES={
            store:{preferred:['commercial.small','commercial.mid','commercial.hero'],allowed:['office.small','office.mid']},
            tenant:{preferred:['commercial.small','commercial.mid','commercial.hero'],allowed:['office.small','office.mid','office.hero']},
            office:{preferred:['office.hero','office.mid','office.small'],allowed:['commercial.hero','commercial.mid']}
          };
          /*
           * Rental offices already carry a real grade in engine state:
           * C=small HQ, B=business center, A=premium tower. A known grade
           * should first point at a matching visible office tier. Some
           * prefecture fabrics intentionally omit a tier, so the allowed
           * ladder stays broad enough to keep the candidate reachable on a
           * legitimate office / mixed-use building rather than fabricating
           * scenery or dropping the marker. Unknown future grades retain the
           * generic office rule above for forward compatibility.
           */
          const OFFICE_GRADE_SURFACES={
            C:{preferred:['office.small'],allowed:['office.mid','office.hero','commercial.mid','commercial.hero']},
            B:{preferred:['office.mid'],allowed:['office.small','office.hero','commercial.mid','commercial.hero']},
            A:{preferred:['office.hero'],allowed:['office.mid','office.small','commercial.hero','commercial.mid']}
          };"""
          replace_once('js/map-phase2-canvas.js', old_kind, new_kind)

          replace_once(
              'js/map-phase2-canvas.js',
              """function surfaceRulesFor(entity){
            if(entity.kind==='realestate')return PROPERTY_KIND_SURFACES[entity.propertyKind]||DEFAULT_PROPERTY_SURFACES;
            return KIND_SURFACES[entity.kind]||EMPTY_SURFACE_RULES;
          }""",
              """function surfaceRulesFor(entity){
            if(entity.kind==='realestate')return PROPERTY_KIND_SURFACES[entity.propertyKind]||DEFAULT_PROPERTY_SURFACES;
            if(entity.kind==='office'&&entity.officeGrade)return OFFICE_GRADE_SURFACES[entity.officeGrade]||KIND_SURFACES.office;
            return KIND_SURFACES[entity.kind]||EMPTY_SURFACE_RULES;
          }"""
          )

          replace_once(
              'tests/map-marker-building-affinity-test.js',
              "  for (let i = 0; i < 3; i++) entities.push({ id: `office:o${i}`, kind: 'office', sourceId: `o${i}` });",
              "  for (const grade of ['C', 'B', 'A']) entities.push({ id: `office:${grade}`, kind: 'office', sourceId: grade, officeGrade: grade });"
          )

          district_line = "    const district = MW.buildWorldDistrict({ index2, prefID, cols: WORLD_COLS, rows: WORLD_ROWS });\n"
          surface_count_block = district_line + """    const surfaceCounts = {};
              for (const cell of district.tiles) {
                const surface = surfaceUnder(cell);
                if (surface) surfaceCounts[surface] = (surfaceCounts[surface] || 0) + 1;
              }
          """
          replace_once('tests/map-marker-building-affinity-test.js', district_line, surface_count_block)

          replace_once(
              'tests/map-marker-building-affinity-test.js',
              "        prefID, kind: entity.kind, propertyKind: entity.propertyKind,",
              "        prefID, kind: entity.kind, propertyKind: entity.propertyKind, officeGrade: entity.officeGrade, surfaceCounts,"
          )

          grade_checks = r'''

            await check('office view-model preserves the real A/B/C rental-office grade without mutating state', () => {
              const raw = { id: 'office-c', prefID: 'tokyo', name: '東京 スモールHQ', grade: 'C', rent: 12345 };
              const g = { selectedPref: 'tokyo', stores: [], tenants: [], rentalOffices: [raw], properties: [] };
              const view = mod.buildMapViewModel(g, null);
              assert.equal(view.entities.length, 1);
              assert.equal(view.entities[0].officeGrade, 'C');
              assert.equal(view.entities[0].office, raw, 'view-model must keep the existing read-only raw-state reference');
              assert.equal(raw.grade, 'C', 'adapter must not mutate the rental-office state');
            });

            await check('ACCEPTANCE 4b: C/B/A office candidates use small/mid/hero when that tier exists, otherwise a legitimate fallback', () => {
              const expected = { C: 'office.small', B: 'office.mid', A: 'office.hero' };
              const legitimateFallback = new Set(['office.small', 'office.mid', 'office.hero', 'commercial.mid', 'commercial.hero']);
              let exactTierAssertions = 0;
              for (const [grade, surface] of Object.entries(expected)) {
                const sample = of(r => r.kind === 'office' && r.officeGrade === grade);
                assert.ok(sample.length >= PREFS.length, `expected one ${grade}-grade office per prefecture`);
                for (const row of sample) {
                  if ((row.surfaceCounts[surface] || 0) > 0) {
                    exactTierAssertions += 1;
                    assert.equal(row.surface, surface, `${row.prefID}: grade ${grade} had ${surface} stock but landed on ${row.surface}`);
                  } else {
                    assert.ok(legitimateFallback.has(row.surface), `${row.prefID}: grade ${grade} used invalid fallback ${row.surface}`);
                  }
                }
              }
              assert.ok(exactTierAssertions >= 20, `expected broad real-world exact-tier coverage, got ${exactTierAssertions}`);
            });

            await check('unknown office grades retain the generic office affinity fallback', () => {
              const placed = mod.placeEntityTiles([{ id: 'office:future', kind: 'office', sourceId: 'future', officeGrade: 'S' }], 'tokyo');
              assert.equal(placed.length, 1);
              assert.notEqual(placed[0].tileX, null, 'future/unknown grade must remain placeable through generic office rules');
            });

            await check('NEGATIVE: collapsing all known office grades onto hero stock is detected whenever the expected tier exists', async () => {
              const brokenSource = canvasSrc.replace(
                /const OFFICE_GRADE_SURFACES=\{[\s\S]*?\n\};/,
                "const OFFICE_GRADE_SURFACES={C:{preferred:['office.hero'],allowed:['office.mid','office.small']},B:{preferred:['office.hero'],allowed:['office.mid','office.small']},A:{preferred:['office.hero'],allowed:['office.mid','office.small']}};"
              );
              assert.notEqual(brokenSource, canvasSrc, 'negative mutation must alter the grade table');
              const broken = await readyFrom(brokenSource);
              const brokenRows = await survey(broken.mod, broken.sandbox);
              const expected = { C: 'office.small', B: 'office.mid', A: 'office.hero' };
              const mismatches = brokenRows.filter(r => r.kind === 'office' && expected[r.officeGrade] && (r.surfaceCounts[expected[r.officeGrade]] || 0) > 0 && r.surface !== expected[r.officeGrade]);
              assert.ok(mismatches.length > 0, 'grade-collapse mutation should produce at least one visible tier mismatch');
            });
          '''
          anchor = """  await check('物流 property markers land on logistics stock or industrial open ground, never on shops or housing', () => {"""
          p = Path('tests/map-marker-building-affinity-test.js')
          text = p.read_text()
          if text.count(anchor) != 1:
              raise SystemExit('test insertion anchor not unique')
          p.write_text(text.replace(anchor, grade_checks + '\n\n' + anchor, 1))

          replace_once(
              'CLAUDE.md',
              "Office grade/tier affinity and pinch zoom remain separate possible future PRs. Do not bundle either into a props PR unless the user explicitly changes scope.",
              "Office grade/tier affinity is part of the production marker-placement contract: C/B/A rental offices prefer office.small/office.mid/office.hero respectively when that tier exists, with deterministic legitimate office/mixed-use fallback when a regional fabric omits it. Pinch zoom remains a separate possible future PR; do not bundle it into unrelated map visual work unless the user explicitly changes scope."
          )
          PY

      - name: Restamp map-critical assets
        run: node scripts/stamp-asset-revision.js

      - name: Validate focused map contracts
        shell: bash
        run: |
          set -euxo pipefail
          node --check js/map-phase2-canvas.js
          node tests/map-marker-building-affinity-test.js
          node tests/map-marker-anchor-integrity-test.js
          node tests/map-marker-density-selection-test.js
          node tests/map-marker-detail-interaction-test.js
          node tests/map-phase2-prefecture-switch-canvas-lifecycle-test.js
          node tests/map-phase2-lazy-load-recovery-test.js
          node tests/static-asset-cache-coherence-test.js
          git diff --check

      - name: Commit implementation to feature branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/map-phase2-canvas.js tests/map-marker-building-affinity-test.js CLAUDE.md
          git add index.html css js prototypes assets scripts tests/fixtures 2>/dev/null || true
          git add -u
          git status --short
          git commit -m "feat: align office markers with office grades"
          git push origin HEAD:${GITHUB_REF_NAME}
