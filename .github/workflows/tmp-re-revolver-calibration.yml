name: Temporary RE Revolver Calibration

on:
  push:
    branches:
      - tmp/re-revolver-calibration

permissions:
  contents: read

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        limit: [2000000, 3000000, 4000000]
        seed: [190826100,190826101,190826104,190826105,190826109,190826116,190826117]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Disable seeded founding mandates for calibration only
        run: node -e "const fs=require('fs');const p='js/real-estate-agency-pipeline.js';let s=fs.readFileSync(p,'utf8');s=s.replace('FOUNDING_INITIAL_DEALS=4','FOUNDING_INITIAL_DEALS=0');fs.writeFileSync(p,s);"
      - name: Run 500-week RE revolver calibration
        env:
          SEED: ${{ matrix.seed }}
          LINE_LIMIT: ${{ matrix.limit }}
          HORIZON: 500
        run: node tests/tmp-re-revolver-calibration.js
