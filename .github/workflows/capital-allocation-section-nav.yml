name: Capital Allocation Section Nav

on:
  pull_request:
    paths:
      - 'js/capital-allocation-management-guide.js'
      - 'css/app.css'
      - 'tests/capital-allocation-section-nav-test.js'
      - 'tests/fixtures/extracted-css-baseline.css'
      - '.github/workflows/capital-allocation-section-nav.yml'
  push:
    branches: [main]
    paths:
      - 'js/capital-allocation-management-guide.js'
      - 'css/app.css'
      - 'tests/capital-allocation-section-nav-test.js'
      - 'tests/fixtures/extracted-css-baseline.css'
      - '.github/workflows/capital-allocation-section-nav.yml'

permissions:
  contents: read

jobs:
  section-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and static assets
        run: |
          npm run test:syntax
          npm run test:static
          npm run test:css
      - name: Verify market section navigation
        run: node tests/capital-allocation-section-nav-test.js
      - name: Verify management guide integration
        run: |
          node tests/capital-allocation-management-guide-test.js
          node tests/capital-allocation-production-wiring-test.js
