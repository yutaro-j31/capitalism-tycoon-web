name: Wire Industry Event Response Plans
on:
  push:
    branches: [feat/phase-8c2-industry-event-response-plans]
    paths:
      - js/industry-event-response-plans.js
      - js/industry-event-response-plans-ui.js
      - tests/industry-event-response-plans-test.js
      - .github/workflows/wire-industry-event-response-plans.yml
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-8c2-industry-event-response-plans
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wire modules and roadmap
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='index.html';
          let html=fs.readFileSync(path,'utf8');
          const anchor='<script src="./js/industry-specific-events.js"></script>';
          const addition=anchor+'<script src="./js/industry-event-response-plans.js"></script><script src="./js/industry-event-response-plans-ui.js"></script>';
          if(!html.includes('industry-event-response-plans.js')){
            if(!html.includes(anchor))throw new Error('industry event anchor missing');
            html=html.replace(anchor,addition);
            fs.writeFileSync(path,html);
          }
          const roadmap='docs/gameplay-systems-roadmap.md';
          let text=fs.readFileSync(roadmap,'utf8');
          const old='2. Industry-specific demand, cost, regulation, technology, and supply events.';
          const next=old+' In progress: deterministic modifiers and one-per-event response plans.';
          if(text.includes(old)&&!text.includes('one-per-event response plans'))fs.writeFileSync(roadmap,text.replace(old,next));
          NODE
          node tests/industry-event-response-plans-test.js
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html docs/gameplay-systems-roadmap.md
          git diff --cached --quiet || git commit -m "chore: wire industry event response plans"
          git push
