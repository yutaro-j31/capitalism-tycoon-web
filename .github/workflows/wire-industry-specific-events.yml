name: Wire Industry Specific Events
on:
  push:
    branches: [feat/phase-8c2-industry-specific-events]
    paths:
      - js/industry-specific-events.js
      - tests/industry-specific-events-test.js
      - .github/workflows/wire-industry-specific-events.yml
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-8c2-industry-specific-events
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wire module and roadmap
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html')
          text=index.read_text()
          marker='<script src="./js/macro-cycle.js"></script>'
          addition=marker+'<script src="./js/industry-specific-events.js"></script>'
          if './js/industry-specific-events.js' not in text:
              if marker not in text: raise SystemExit('macro-cycle marker missing')
              index.write_text(text.replace(marker,addition,1))
          roadmap=Path('docs/gameplay-systems-roadmap.md')
          body=roadmap.read_text()
          old='2. Industry-specific demand, cost, regulation, technology, and supply events.'
          new=old+' In progress: deterministic per-business modifiers connected to canonical demand and unit-cost calculation paths.'
          if new not in body:
              if old not in body: raise SystemExit('roadmap marker missing')
              roadmap.write_text(body.replace(old,new,1))
          PY
      - name: Verify focused regression
        run: node tests/industry-specific-events-test.js
      - name: Verify syntax and module wiring
        run: |
          npm run test:syntax
          grep -qF './js/industry-specific-events.js' index.html
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html docs/gameplay-systems-roadmap.md
          git commit -m 'chore: wire industry-specific event module'
          git push
