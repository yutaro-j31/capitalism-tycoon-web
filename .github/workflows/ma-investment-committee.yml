name: M&A Investment Committee

on:
  pull_request:
    paths:
      - 'js/ma-investment-committee.js'
      - 'play.html'
      - 'tests/ma-investment-committee-test.js'
      - '.github/workflows/ma-investment-committee.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/ma-investment-committee.js
      - run: node tests/ma-investment-committee-test.js
