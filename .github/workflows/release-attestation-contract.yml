name: Release Attestation Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-attestation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release attestation synchronization contract
        run: node tests/release-attestation-issue-test.js