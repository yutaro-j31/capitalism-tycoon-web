name: Release Attestation Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-attestation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release attestation synchronization contract
        shell: bash
        run: |
          set +e
          node tests/release-attestation-issue-test.js > release-attestation-contract.log 2>&1
          STATUS=$?
          cat release-attestation-contract.log
          exit "$STATUS"
      - name: Retain focused contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-attestation-contract-${{ github.sha }}
          path: release-attestation-contract.log
          if-no-files-found: error
          retention-days: 30