name: iPhone WebKit Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-webkit-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  iphone-webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IPHONE_WEBKIT_ARTIFACT_DIR: artifacts/iphone-webkit-smoke
      GAME_OVER_SETTINGS_ARTIFACT_DIR: artifacts/game-over-settings-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.61.0
      - name: Install WebKit browser and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Run iPhone WebKit release smoke
        run: node tests/iphone-webkit-smoke-test.js
      - name: Verify bankruptcy settings recovery
        run: node tests/game-over-settings-webkit-test.js
      - name: Retain WebKit smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-webkit-smoke-${{ github.sha }}
          path: |
            artifacts/iphone-webkit-smoke
            artifacts/game-over-settings-webkit
          if-no-files-found: error
          retention-days: 30
