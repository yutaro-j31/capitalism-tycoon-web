name: Real Estate Security Deposits
on:
  pull_request:
    paths:
      - 'js/real-estate-security-deposits.js'
      - 'js/real-estate-security-deposits-ui.js'
      - 'js/real-estate-rent-guarantee.js'
      - 'tests/real-estate-security-deposits-test.js'
      - '.github/workflows/real-estate-security-deposits.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/real-estate-security-deposits-test.js
