name: Pages Publication Attestation

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pages-publication-attestation
  cancel-in-progress: true

jobs:
  verify-published-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out expected main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify public GitHub Pages files match main
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PAGES_VERIFY_ATTEMPTS: '16'
          PAGES_VERIFY_DELAY_MS: '15000'
        run: node scripts/verify-published-pages.js
