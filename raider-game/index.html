<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Capital</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: world-map command deck (map left, operations panel right; stacked on phones). Single deliberate night-ocean look. */
:root{
  --sea:#0e3150; --sea-deep:#071a2c; --land:#c8b27a; --land-hi:#ead7a0;
  --panel:#0f2438; --panel-2:#15314a; --line:#23435f; --ink:#e8eef2; --mute:#8fa8ba;
  --gold:#f2b632; --up:#48c48c; --down:#f06a5d; --warn:#f2a03d;
  --r1:#ff7f5c; --r2:#3cc8d1; --r3:#b994ff; --pub:#56708a;
  --f-display:'Dela Gothic One','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  --f-body:'Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sea-deep);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;line-height:1;white-space:nowrap}
.brand b{color:var(--gold);font-weight:400}
.brand small{display:block;font-family:var(--f-body);font-size:10px;letter-spacing:.18em;color:var(--mute);margin-top:4px}
.date{display:flex;flex-direction:column;font-size:11px;color:var(--mute);line-height:1.35;min-width:0}
.date b{font-size:14px;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16em}
.date span:last-child{font-family:var(--f-mono)}
.field input.txt{font-family:var(--f-body)}
.field.name label{min-width:4em}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;flex:1;min-width:0}
.stat{display:flex;flex-direction:column;min-width:74px}
.stat span{font-size:10px;letter-spacing:.12em;color:var(--mute)}
.stat b{font-family:var(--f-mono);font-size:15px;font-weight:600}
.stat.nw b{color:var(--gold)}
.speed{display:flex;gap:4px;align-items:center}
.speed button{background:var(--sea-deep);border:1px solid var(--line);border-radius:9px;min-width:44px;height:38px;padding:0 10px;font-family:var(--f-mono);font-size:13px}
.speed button.on{background:var(--gold);border-color:var(--gold);color:#1b1404;font-weight:600}
.speed .step{font-family:var(--f-body);font-size:12px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:9px;height:38px;min-width:44px;padding:0 10px;font-size:12px}

/* ticker */
.ticker{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel);height:30px;position:relative}
.tick-track{display:inline-flex;gap:26px;white-space:nowrap;padding:5px 0 0 100%;animation:tick 60s linear infinite;font-family:var(--f-mono);font-size:12px}
.tick-track i{font-style:normal;color:var(--mute)}
@keyframes tick{to{transform:translateX(-100%)}}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:10px;flex:1;min-height:0}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 40% 35%,var(--sea),var(--sea-deep));min-height:300px}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#map.drag{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(15,36,56,.88);font-size:18px}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;background:rgba(7,26,44,.8);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11px;max-width:calc(100% - 20px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.maphint{position:absolute;left:10px;top:10px;font-size:11px;color:var(--mute);background:rgba(7,26,44,.7);border-radius:8px;padding:4px 8px;pointer-events:none}

.panel{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 6px 8px;min-height:44px;font-size:13px;color:var(--mute);white-space:nowrap;position:relative}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:700}
.badge{display:inline-block;background:var(--down);color:#fff;font-size:10px;border-radius:9px;padding:0 6px;margin-left:4px;font-family:var(--f-mono)}
.pbody{padding:12px;overflow:auto;flex:1;min-height:0}
.pbody h3{font-size:12px;letter-spacing:.14em;color:var(--mute);margin:16px 0 8px;font-weight:500}
.pbody h3:first-child{margin-top:0}

/* lists */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.chip{background:var(--sea-deep);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;min-height:32px}
.chip.on{border-color:var(--gold);color:var(--gold)}
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;background:none;border:0;border-radius:10px;padding:8px 8px;width:100%}
.row:hover{background:var(--panel-2)}
.row .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.row .sub{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt.sub{max-width:62vw}
.row .rt{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.up{color:var(--up)} .down{color:var(--down)}
.tag{font-size:10px;border-radius:6px;padding:1px 6px;font-weight:700;flex:none;letter-spacing:.04em}
.tag.cheap{background:rgba(72,196,140,.16);color:var(--up)}
.row .jp{font-size:10px;border:1px solid var(--down);color:var(--down);border-radius:4px;padding:0 4px;margin-right:6px}
.tag.tob{border:1px solid;background:none}
.row .extra{grid-column:1/-1;white-space:normal;color:var(--ink);opacity:.85}
.lbl{font-size:12px;color:var(--ink);margin:10px 0 6px!important;font-weight:500}
.acct{flex:1;font-weight:500;font-size:13px}
.memo{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:rgba(242,182,50,.05)}
.memo h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:500}
.memo-i{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 0;font-size:12px;color:var(--ink);min-height:32px;line-height:1.5}
.memo-i.bad{color:var(--down)}
.tree,.tree ul{list-style:none;margin:0;padding-left:16px;font-size:13px}
.tree{padding-left:0}
.tree li{position:relative;padding:3px 0 3px 12px;border-left:1px solid var(--line)}
.tree li::before{content:"";position:absolute;left:0;top:13px;width:9px;border-top:1px solid var(--line)}
.tree small{color:var(--mute);font-size:11px}
.mis{background:var(--panel-2);border-radius:10px;padding:10px;margin-bottom:6px}
.mis-h{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mis-h span{font-size:11px;color:var(--mute);white-space:nowrap}
.mis small{font-size:11px;color:var(--mute)}
i.bar{display:block;height:6px;border-radius:3px;background:var(--sea-deep);margin:6px 0 4px;overflow:hidden}
i.bar b{display:block;height:100%;background:var(--gold)}
.lux{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.lux-i{display:flex;flex-direction:column;gap:4px;background:var(--panel-2);border-radius:10px;padding:10px;font-size:13px}
.lux-i small{color:var(--mute);font-size:11px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ach-i{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;opacity:.55;display:flex;flex-direction:column;gap:2px}
.ach-i.on{opacity:1;border-color:var(--gold)}
.ach-i.on b{color:var(--gold)}
.ach-i small{color:var(--mute);font-size:11px}
.seg button small{font-family:var(--f-body);font-size:10px;color:var(--mute)}
.rtable{display:grid;font-size:12px;margin-top:10px;overflow-x:auto}
.rtable>div{display:grid;grid-template-columns:minmax(90px,1.6fr) .6fr 1fr 1fr .8fr;gap:6px;padding:5px 0;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.rtable>div span:first-child{font-family:var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtable .rh{color:var(--mute);font-family:var(--f-body)!important;font-size:11px}
.rtree{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.rcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.rcol>b{font-size:12px;color:var(--gold);letter-spacing:.1em}
.rnode{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;display:flex;flex-direction:column;gap:4px;background:var(--panel-2)}
.rnode small{color:var(--mute);font-size:11px}
.rnode.done{border-color:var(--gold)}
.rnode.lock{opacity:.5}
.box.locked{opacity:.7;border-style:dashed}
.ul{margin:6px 0 0;padding-left:18px;font-size:13px}
@media (max-width:620px){.rtree{grid-template-columns:repeat(2,minmax(0,1fr))}}
.savetext{width:100%;min-height:96px;margin-top:8px;background:var(--sea-deep);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:var(--f-mono);font-size:12px}
.mh{font-size:12px;letter-spacing:.14em;color:var(--mute);margin:16px 0 6px;font-weight:500}
.mshare{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:12px}
.mshare>div{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(50px,1fr) auto;gap:2px 8px;align-items:center}
.mshare>div small{grid-column:1/-1;color:var(--mute);font-size:10px;margin-top:-2px}
.mshare>div.me>span:first-child{color:var(--gold);font-weight:700}
.mshare span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.attr{display:flex;flex-direction:column;gap:4px;font-size:12px}
.attr>div{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) auto;gap:8px;align-items:center}
.attr .tot{border-top:1px solid var(--line);padding-top:4px;font-weight:700}
i.pn{display:block;height:8px;position:relative;background:var(--sea-deep);border-radius:4px}
i.pn b{position:absolute;top:0;bottom:0;border-radius:4px}
i.pn b.pos{left:50%;background:var(--up)}
i.pn b.neg{right:50%;background:var(--down)}
.rtable.cm>div{grid-template-columns:.8fr 1fr 1.6fr .6fr}
.tag.priv{border:1px solid var(--mute);color:var(--mute);background:none}
.tasks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--down);border-radius:10px;padding:6px 10px;background:rgba(240,106,93,.08);font-size:12px}
.tasks b{color:var(--down);font-weight:700;margin-right:4px}
.task{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;min-height:32px;font-size:12px}
.task.bad{border-color:var(--down);color:var(--down)}
.home{width:11px;height:11px;margin-right:1px;vertical-align:-1px}
.prop{border-top:1px solid var(--line);padding:10px 0}
.prop-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}.prop-h small{color:var(--mute)}
h4.sub{margin:14px 0 4px;font-size:13px}
.subtabs{display:flex;gap:4px;margin:12px 0 4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:8px 10px;min-height:40px;font-size:13px;white-space:nowrap}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:700}
.orow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;padding:8px;font-size:12px;border-bottom:1px solid var(--line)}
.offer.tip{border-color:var(--warn);background:rgba(242,160,61,.06)}
.link{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;font-size:inherit;min-height:0}
.ownlist small{color:var(--mute);font-size:10px}
.note{font-size:12px;color:var(--mute);margin:-2px 0 8px}
.box.war{border-color:var(--down);background:rgba(240,106,93,.06)}
.shr{display:grid;grid-template-columns:auto minmax(60px,1fr) auto;gap:6px 10px;align-items:center;font-size:12px}
.shr i{display:block;height:8px;border-radius:4px;background:var(--sea-deep);overflow:hidden}
.shr i b{display:block;height:100%}
.shr span:nth-child(3n){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:11em}
.ctrl{font-size:10px;border-radius:6px;padding:1px 6px;flex:none;color:#10161c;font-weight:700}

/* company detail */
.back{background:none;border:0;color:var(--mute);padding:6px 0;min-height:36px;font-size:13px}
.cohead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cohead h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:2px 0 0;line-height:1.25;text-wrap:balance}
.cohead .meta{font-size:11px;color:var(--mute);letter-spacing:.06em}
.cohead .px{text-align:right;font-family:var(--f-mono);font-size:20px;font-weight:600;white-space:nowrap}
.cohead .px small{display:block;font-size:12px;font-weight:400}
canvas.chart{width:100%;height:120px;display:block;margin:10px 0 4px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;margin-top:6px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv span{font-size:10px;color:var(--mute);letter-spacing:.08em}
.kv b{font-family:var(--f-mono);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ownbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--pub)}
.ownbar i{display:block;height:100%}
.ownlist{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px}
.ownlist li{display:flex;align-items:center;gap:6px}
.ownlist b{margin-left:auto;font-family:var(--f-mono);font-weight:600}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;background:rgba(7,26,44,.45)}
.box h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.box h4 small{font-weight:400;color:var(--mute);font-size:11px}
.box.ceo{border-color:rgba(242,182,50,.55)}
.box p{margin:6px 0;font-size:12px;color:var(--mute)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;min-height:44px;padding:0 14px;font-size:13px;font-weight:500}
.btn.buy{background:var(--up);border-color:var(--up);color:#06261a;font-weight:700}
.btn.sell{background:var(--down);border-color:var(--down);color:#2c0703;font-weight:700}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1404;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 10px;font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:none;border-radius:8px;min-height:36px;padding:0 10px;font-size:12px;font-family:var(--f-mono)}
.seg button.on{border-color:var(--gold);color:var(--gold);background:rgba(242,182,50,.08)}
.field{display:flex;align-items:center;gap:8px;margin-top:6px}
.field label{font-size:12px;color:var(--mute);white-space:nowrap}
.field input,.field select{flex:1;min-width:0;background:var(--sea-deep);border:1px solid var(--line);border-radius:9px;color:var(--ink);height:40px;padding:0 10px;font-family:var(--f-mono);font-size:16px}
.field select{font-family:var(--f-body);font-size:14px}
.preview{font-size:12px;font-family:var(--f-mono);color:var(--ink);background:var(--sea-deep);border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.7}
.preview em{font-style:normal;color:var(--mute);font-family:var(--f-body)}

/* leaderboard / news */
.board{display:flex;flex-direction:column;gap:6px}
.lead{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px;border-radius:12px;background:var(--panel-2)}
.lead .rk{font-family:var(--f-display);font-size:18px;color:var(--mute);text-align:center}
.lead .who{font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
.lead .who small{font-weight:400;color:var(--mute);font-size:11px}
.lead .val{font-family:var(--f-mono);text-align:right;font-weight:600}
.lead .det{grid-column:2/4;font-size:11px;color:var(--mute)}
.lead.me{outline:1px solid var(--gold)}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.news li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.news .wk{font-family:var(--f-mono);font-size:11px;color:var(--mute);padding-top:2px;white-space:nowrap}
.news .k-deal{border-left:3px solid var(--r2);padding-left:8px}
.news .k-econ{border-left:3px solid var(--warn);padding-left:8px}
.news .k-you{border-left:3px solid var(--gold);padding-left:8px}
.news .k-warn{border-left:3px solid var(--down);padding-left:8px}
.news .k-earn{border-left:3px solid var(--pub);padding-left:8px}
.offer{border:1px solid var(--gold);border-radius:12px;padding:12px;margin-bottom:10px;background:rgba(242,182,50,.06)}
.offer p{margin:0 0 4px}
.empty{color:var(--mute);font-size:13px;padding:18px 4px;text-align:center}

/* toasts + modal */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:40;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--panel-2);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast.bad{border-color:var(--down)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal{position:fixed;inset:0;background:rgba(3,12,22,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:22px}
.sheet h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:0}
.sheet h1 b{color:var(--gold);font-weight:400}
.sheet .lede{color:var(--mute);margin:8px 0 14px}
.sheet ol{padding-left:20px;margin:0 0 14px;font-size:13px;display:flex;flex-direction:column;gap:6px}

'use strict';
(() => {
/* =====================================================================
   ATLAS CAPITAL — an original stock-market raiding sim.

   Money unit: $ millions. Share unit: millions of shares.
   ===================================================================== */
const SAVE_KEY = 'atlas_capital_save_v1';

/* ---------- static data (all fictional) ---------- */

];
const IPO_POOL = [

  ['Saint-Clair Biologics','SCB','pharma','par'],['風見モビリティ','J301','auto','ngo'],['桜坂ロボティクス','J302','tech','tyo'],['瀬戸内マリン','J303','ship','osa'],['Gulfstar Petrochem','GSP','energy','dxb'],
  ['Ironbark Foods','IBF','food','syd'],['Quayside Realty','QSR','realty','lon'],['Ozone Airlines','OZA','air','sao'],
  ['Cedar & Pine Bank','CPB','bank','tor'],['Monarch Telecom','MNT','telecom','bom'],['Nightjar Software','NJS','tech','sel'],
  ['Copperline Retail','CPR','retail','chi'],['Baltic Hullworks','BHW','ship','sto'],['Sierra Madre Foods','SMF','food','mex'],
];
const RIVAL_DEF = [
  {id:'R1', n:'ヴィクター・クレイン', tag:'強欲な乗っ取り屋', cash:75,  agg:.95, sell:1.30, prem:.30, style:'raider'},
  {id:'R2', n:'イゾルデ・ヴァンス',   tag:'冷徹な割安株ハンター', cash:95, agg:.65, sell:1.40, prem:.22, style:'turnaround'},
  {id:'R3', n:'天城 剛',             tag:'日本株好きの財閥系', cash:120, agg:.5,  sell:1.55, prem:.35, style:'keiretsu'},
];
const DIFF = {
  easy:   {n:'やさしい',   cash:50, rc:.7,  ra:.6,  pill:.2,  call:.8, gm:1.4, rbuy:1, rtob:1, rcnt:1, desc:'元手50億円。ライバルは控えめで、買収防衛策も少なめ。追証は評価額の80%から。'},
  normal: {n:'ふつう',     cash:30, rc:1,   ra:1,   pill:.35, call:.7, gm:1,   rbuy:1, rtob:1, rcnt:1,   desc:'元手30億円。標準のバランス。追証は評価額の70%から。'},
  hard:   {n:'むずかしい', cash:20, rc:2.0, ra:1.3, pill:.55, call:.6, gm:.6,  rbuy:1.5, rtob:1.6, rcnt:1.8, desc:'元手20億円。ライバルは資金2倍で買い集めも速く、TOBや対抗TOBを積極的に仕掛けてくる。防衛策が頻発し、追証は評価額の60%から。'},
};
const OWNC = {P:'var(--gold)', R1:'var(--r1)', R2:'var(--r2)', R3:'var(--r3)'};
const OWNHEX = {P:'#f2b632', R1:'#ff7f5c', R2:'#3cc8d1', R3:'#b994ff', PUB:'#56708a'};

/* ---------- deterministic PRNG (mulberry32, state in S.rs) ---------- */
let S = null;
function rnd(){ S.rs = (S.rs + 0x6D2B79F5) | 0; let t = S.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function gauss(){ let u = rnd(); if (u < 1e-12) u = 1e-12; return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * rnd()); }
const pickIdx = n => Math.floor(rnd() * n) % n;

/* ---------- names / formatting ---------- */
const DEF_CO = 'アトラス・キャピタル', DEF_PN = 'あなた';
const ownerName = k => k === 'P' ? S.company : k && k[0] === 'C' ? ((S.cos.find(c => c.id === k) || {name: '解散済みの会社'}).name) : (S.rivals.find(r => r.id === k) || {n: '?'}).n;
const grp = n => Math.round(n).toLocaleString('ja-JP');
// Money unit inside the engine = 1億円. Share unit = 1,000,000 shares, so a price of 1.0 = 100円/株.
const fm = v => {
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e4) return s + (a / 1e4).toFixed(a >= 1e5 ? 1 : 2) + '兆円';
  if (a >= 1) return s + (a >= 100 ? grp(a) : String(+a.toFixed(a >= 10 ? 1 : 2))) + '億円';
  if (a >= 5e-5) return s + grp(a * 1e4) + '万円';
  return s + grp(a * 1e8) + '円';
};
const fp = p => { const y = p * 100; return (y >= 10 ? grp(y) : y.toFixed(1)) + '円'; };
const pc = (x, d) => (x * 100).toFixed(d == null ? 1 : d) + '%';
const spc = x => { const t = (x * 100).toFixed(1); return (t === '-0.0' ? '+0.0' : (x >= 0 ? '+' : '') + t) + '%'; };
const fsh = n => n >= 100 ? (n / 100).toFixed(2) + '億株' : n >= .005 ? grp(n * 100) + '万株' : grp(n * 1e6) + '株';
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function dateOf(w){ const d = new Date(Date.UTC(2027, 0, 4) + w * 7 * 86400000); return `${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月${d.getUTCDate()}日`; }
function shortDate(w){ const d = new Date(Date.UTC(2027, 0, 4) + w * 7 * 86400000); return `${String(d.getUTCFullYear()).slice(2)}/${d.getUTCMonth() + 1}/${d.getUTCDate()}`; }

/* ---------- company fundamentals ---------- */
// Owner keys: 'P' (player), 'R1'..'R3' (rivals) and company ids ('C12') for corporate holdings.
// c.ctrl always stores the ultimate boss (a person key) whose whole group holds > 50%.
const coById = id => S.cos.find(c => c.id === id);
const isCo = k => typeof k === 'string' && k[0] === 'C';
const rivalBy = k => S.rivals.find(r => r.id === k);
const bossOf = k => isCo(k) ? ((coById(k) || {}).ctrl || null) : k;
const FX0 = 150;
const JP_FX = {auto: .8, tech: .4, steel: .4, ship: .5, pharma: .2, energy: -.4, air: -.5, food: -.3, retail: -.3};
function fxMult(c){ const sens = isJP(c) ? (JP_FX[c.ind] || 0) : 1; return 1 + sens * ((S.econ.fx || FX0) / FX0 - 1); }
function groupRev(ind, boss){ let s = 0; for (const x of S.cos) if (x.ind === ind && x.ctrl === boss) s += x.rev; return s; }
function indTotal(ind, extra){ let s = 0; for (const x of S.cos) if (x.ind === ind) s += x.rev; return s + (extra || 0); }
function indShare(c){ const tot = indTotal(c.ind, S.cos.includes(c) ? 0 : c.rev); return tot > 0 ? (c.ctrl ? groupRev(c.ind, c.ctrl) : c.rev) / tot : 0; }
const synergy = c => IND[c.ind].m * clamp((indShare(c) - .12) * .8, 0, .25); // pricing power from market share
/* ---------- region × industry markets (Phase 1) ----------
   Each company sells into one market: its HQ region × its industry. A market holds total demand
   (in volume at the standard price) and the volume of small firms not modelled as companies.
   Revenue = demand × share × price level. Share moves each week toward the company's
   appeal (base strength × brand × price^-elasticity) relative to rivals and small firms. */
const PRICE = {'-1': {n: '低価格'}, '0': {n: '標準'}, '1': {n: '高価格'}};
const priceStepOf = c => clamp(c.base * .5, .02, .08); // a price move a company can afford: half its structural margin, 2–8%
const levelFor = (c, ps) => 1 + (ps || 0) * priceStepOf(c);
const EL = {bank: 2, tech: 1.5, auto: 2.5, energy: 2, retail: 4, pharma: 1.2, ship: 3, food: 3, realty: 2, telecom: 2.5, steel: 3, air: 3.5}; // how strongly share reacts to price
const PHI = {bank: .3, tech: .3, auto: .35, energy: .4, retail: .25, pharma: .3, ship: .45, food: .25, realty: .4, telecom: .45, steel: .4, air: .45}; // fixed share of total costs
const OTHERS0 = .35; // share held by small firms when a market is first created
const SHARE_SPEED = .06; // weekly step toward the target share
const brandOf = c => c.brand == null ? .5 : c.brand;
// Markets are regional: in each city every listed company is in a different industry, so a city-level market
// would never contain two rivals. Region × industry puts about half the companies into contested markets.
const REGION = {jp: {n: '日本', c: 'tyo osa ngo fuk spk'}, am: {n: '米州', c: 'nyc tor chi sfo mex sao bue'}, emea: {n: '欧州・中東・アフリカ', c: 'lon par fra zur sto dxb los jnb'}, ap: {n: 'アジア太平洋', c: 'bom sin hkg sha sel syd'}};
const REGION_OF = Object.fromEntries(Object.entries(REGION).flatMap(([k, r]) => r.c.split(' ').map(c => [c, k])));
const mkKey = c => REGION_OF[c.city] + '|' + c.ind;
const mkName = key => { const [r, ind] = key.split('|'); return `${REGION[r].n}の${IND[ind].n}市場`; };
const plev = c => levelFor(c, c.ps);
const elOf = c => EL[c.ind] * (c.ctrl === 'P' && hasR('op2') ? .6 : 1);
const brandF = c => Math.exp(1.2 * (brandOf(c) - .5));
const priceF = (c, ps) => Math.pow(levelFor(c, ps == null ? c.ps : ps), -elOf(c));
const appeal = (c, ps) => (c.w || 0) * brandF(c) * priceF(c, ps);
function vertLinks(c){ // group companies upstream of c that are large enough to supply it
  if (!c.ctrl) return [];
  const out = [];
  for (const ind of SUPPLY[c.ind] || []) {
    const sup = S.cos.filter(x => x.ctrl === c.ctrl && x.ind === ind).sort((a, b) => b.rev - a.rev)[0];
    if (sup && sup.rev >= c.rev * .15) out.push(sup);
  }
  return out.slice(0, 2);
}
function vertBonus(c){ let b = 0; for (const s of vertLinks(c)) b += s.ni < 0 && s.debt > s.rev ? -.01 : .03; return b; } // cheaper, steadier inputs; a distressed supplier hurts (stored figures only: tech and telecom supply each other)
const RAW = {air: .35, ship: .25, auto: .15, steel: .3, energy: -.4, food: .15, retail: .05, pharma: .05, tech: .05, telecom: .02, bank: 0, realty: .05}; // cost sensitivity to the raw-material index (energy sells it)
const rawF = c => Math.max(.3, 1 + RAW[c.ind] * (((S && S.econ && S.econ.raw) || 1) - 1));
const vcBase = c => (1 - c.margin) * (1 - PHI[c.ind]) * (1 - vertBonus(c));
const vcOf = c => vcBase(c) * rawF(c); // variable cost per unit of volume
const fixedOf = c => c.fixed == null ? c.rev * (1 - c.margin) * PHI[c.ind] : c.fixed;
const opProfit = c => (c.rev * (1 + synergy(c)) - c.rev / plev(c) * vcOf(c) - fixedOf(c)) * fxMult(c);
const opMargin = c => c.rev > 0 ? opProfit(c) / fxMult(c) / c.rev : 0;
function mkMembers(){ const by = {}; for (const c of S.cos) { c.mk = mkKey(c); (by[c.mk] = by[c.mk] || []).push(c); } return by; }
function mkRefresh(){ // re-fit markets to current revenues after structural changes; keeps everyone's accumulated appeal
  S.mk = S.mk || {};
  const by = mkMembers();
  for (const key of Object.keys(S.mk)) if (!by[key]) delete S.mk[key];
  for (const key of Object.keys(by).sort()) {
    const list = by[key], vol = list.map(c => c.rev / plev(c)), V = vol.reduce((a, b) => a + b, 0);
    let M = S.mk[key];
    if (!M) { const D = V / (1 - OTHERS0); M = S.mk[key] = {D, ov: D - V, ovRef: D - V, ow: OTHERS0}; }
    if (M.ovRef > 0 && M.ov !== M.ovRef) M.ow *= M.ov / M.ovRef; // small firms absorbed or lost volume
    M.ovRef = M.ov; M.D = M.ov + V;
    list.forEach((c, i) => { if (c.fixed == null) c.fixed = c.rev * (1 - c.margin) * PHI[c.ind]; if (c.w > 0 && c.vol > 0) c.w *= vol[i] / c.vol; });
    const ref = M.ow + list.reduce((a, c) => a + (c.w > 0 && c.vol > 0 ? appeal(c) : 0), 0) || 1;
    list.forEach((c, i) => {
      c.sh = vol[i] / M.D;
      if (!(c.w > 0 && c.vol > 0)) { const s0 = Math.min(c.sh, .95); c.w = s0 / (1 - s0) * ref / (brandF(c) * priceF(c)); } // newcomer: aim at its current share
      c.vol = vol[i]; c.tsh = c.tsh == null ? c.sh : c.tsh;
    });
  }
}
function mkInit(){ // first build (new game or a save from before Phase 1): fits shares so revenues stay exactly as they are
  S.mk = {};
  const by = mkMembers();
  for (const key of Object.keys(by).sort()) {
    const list = by[key], vol = list.map(c => c.rev / plev(c)), V = vol.reduce((a, b) => a + b, 0), D = V / (1 - OTHERS0);
    S.mk[key] = {D, ov: D - V, ovRef: D - V, ow: OTHERS0};
    list.forEach((c, i) => { c.vol = vol[i]; c.sh = vol[i] / D; c.tsh = c.sh; c.w = c.sh / (brandF(c) * priceF(c)); if (c.fixed == null) c.fixed = c.rev * (1 - c.margin) * PHI[c.ind]; });
  }
}
function mkToOthers(c, vol){ const M = S.mk && S.mk[c.mk]; if (M) M.ov += vol; } // volume a company gives up goes to small firms
function mkTargets(key, override){ // pure: target shares in a market, optionally with one company's price changed
  const M = S.mk[key], list = S.cos.filter(c => c.mk === key);
  const a = list.map(c => override && override.id === c.id ? appeal(c, override.ps) : appeal(c));
  const tot = M.ow + a.reduce((x, y) => x + y, 0);

}
// high-growth industries mature: growth above 5% fades by 7% a year (tech 11% → about 7% after 15 years)
const indG = ind => { const g = IND[ind].g; return g > .05 ? .05 + (g - .05) * Math.pow(.93, S.week / 52) : g; };
function mkStep(){
  const e = S.econ, by = mkMembers();
  for (const key of Object.keys(by).sort()) {
    const M = S.mk[key], list = by[key], I = IND[list[0].ind];
    M.D *= 1 + (indG(list[0].ind) + I.cyc * (e.gdp - 2.5) / 100) / 52 + gauss() * .004;
    const tgt = mkTargets(key);
    let sum = 0;
    for (const c of list) {
      c.tsh = tgt[c.id]; c.sh += (c.tsh - c.sh) * SHARE_SPEED; sum += c.sh;
      c.w *= 1 + (c.growth + c.boost - indG(c.ind)) / 52; // product strength drifts with the company's own growth edge
      c.fixed *= 1 + indG(c.ind) / 52;
    }
    for (const c of list) { c.vol = M.D * c.sh; c.rev = c.vol * plev(c); }

const shareMomentum = c => c.sh > 0 && c.tsh != null ? clamp((c.tsh - c.sh) / c.sh, -.3, .3) * .15 : 0; // the market prices in where share is heading
function advertise(c, amt){

}
const equity = c => c.cash + c.assets - c.debt + (c.pv || 0);
const RATINGS = [['AAA', 1, .6], ['AA', 2, .9], ['A', 3, 1.3], ['BBB', 4, 1.8], ['BB', 5.5, 3], ['B', 7.5, 4.5], ['CCC', Infinity, 7]];
function ratingFor(debt, op){ if (debt <= 1e-9) return RATINGS[0]; if (op <= 0) return RATINGS[6]; const lev = debt / op; return RATINGS.find(r => lev < r[1]); }

const penalty = c => c.pen && c.pen.until > (S ? S.week : 0) ? c.pen.add : 0; // refinancing surcharge after a crisis
function niA(c){ const e = S.econ; return opProfit(c) - c.debt * (e.rate + rating(c)[2] + penalty(c) - (c.ctrl === 'P' && hasR('fin2') ? .5 : 0)) / 100 + c.cash * Math.max(0, e.rate - 1) / 200; }
// (10) foreign-ownership rules: airlines and telecoms are protected sectors
const NAT = {P: 'jp', R1: 'us', R2: 'eu', R3: 'jp'};
const natOfCo = c => isJP(c) ? 'jp' : 'ov';
function ownCapNat(c, nat){
  if (!nat || (c.ind !== 'air' && c.ind !== 'telecom')) return 1;
  if (isJP(c)) return nat === 'jp' ? 1 : .33;   // 外為法・業法: foreign investors max one third
  return nat === 'jp' ? .49 : 1;                // overseas carriers stay out of Japanese control
}
const ownCap = (c, boss) => ownCapNat(c, NAT[boss]);
const capNote = c => c.ind !== 'air' && c.ind !== 'telecom' ? '' : isJP(c) ? '外資規制：海外投資家（ヴィクター・イゾルデ）のグループは33%まで' : '外資規制：日本の投資家（あなた・天城）のグループは49%まで';
const held = c => { let s = 0; for (const k in c.own) s += c.own[k]; return s; };
const floatOf = c => Math.max(0, c.shares - held(c));

const frac = (c, k) => (c.own[k] || 0) / c.shares;

function fair(c){
  const ind = IND[c.ind], e = S.econ, ni = niA(c), g = c.growth + c.boost + shareMomentum(c);
  const credit = {BB: .9, B: .8, CCC: .6}[rating(c)[0]] || 1; // investors discount weak credit

function makeCompany(def){

  const assets = rev * I.bk * (.6 + rnd() * .8);
  const c = {

    base: I.m * (.6 + rnd() * .8), margin: 0, growth: I.g + gauss() * .02, boost: 0,
    cash: rev * (.05 + rnd() * .2), assets, debt: assets * (.1 + rnd() * .45),
    payout: [.2, .3, .4, .5][pickIdx(4)], brand: .5, ps: 0, shares: 1, price: 1, hist: [], own: {}, ctrl: null, disc: {}, pill: false, ni: 0, mood: 0, pv: 0,

/* ---------- money flows ---------- */
function credit(k, amt){ if (k === 'P') S.player.cash += amt; else if (isCo(k)) { const c = coById(k); if (c) c.cash += amt; } else { const r = rivalBy(k); if (r) r.cash += amt; } }
function debit(k, amt){
  if (k === 'P') return playerPay(amt);
  if (isCo(k)) { const c = coById(k); if (!c) return; c.cash -= amt; if (c.cash < 0) { c.debt += -c.cash; c.cash = 0; } return; }
  const r = rivalBy(k); if (r) r.cash -= amt;
}
function fundsOf(k){ // what an owner can spend right now (companies may draw on their borrowing room)
  if (k === 'P') return buyingPower();
  if (isCo(k)) { const c = coById(k); return c ? c.cash + Math.max(0, maxDebt(c) - c.debt) : 0; }
  const r = rivalBy(k); return r ? Math.max(0, r.cash) : 0;
}
function costMap(k){ if (k === 'P') return S.player.cost; if (isCo(k)) { const h = coById(k); return h ? (h.cost || (h.cost = {})) : null; } return null; }

function addCost(k, cid, amt){ const m = costMap(k); if (m) m[cid] = (m[cid] || 0) + amt; }
function cutCost(k, c, n){ const m = costMap(k); if (!m) return; const h = c.own[k] || 0; if (h - n < 1e-7) delete m[c.id]; else m[c.id] = (m[c.id] || 0) * (1 - n / h); }
function dropCost(c){ for (const k in c.own) { const m = costMap(k); if (m) delete m[c.id]; } }
function payDividend(c, amt){
  if (amt <= 0) return;
  for (const k in c.own) { const a = amt * c.own[k] / c.shares; credit(k, a); if (k === 'P') { S.player.divs += a; S.player.divW = (S.player.divW || 0) + a; } }
  const sp = S.player.shorts[c.id]; if (sp) playerPay(amt * sp.n / c.shares); // short sellers owe the dividend to the lender
}
function holdingsValue(k){ let v = 0; for (const c of S.cos) v += (c.own[k] || 0) * c.price; return v; }
function shortLiab(){ let v = 0; for (const id in S.player.shorts) { const c = coById(id); if (c) v += S.player.shorts[id].n * c.price; } return v; }
function grossWorth(){ return S.player.cash + holdingsValue('P') - S.player.loan - shortLiab() + optionsValue() + propEquity('P'); }
function netWorth(k){ if (k === 'P') { const g = grossWorth(); return g * (1 - (S.player.outside || 0)); } const r = rivalBy(k); return r.cash + holdingsValue(k) + propEquity(k); }

}
const shortRoom = () => Math.max(0, Math.max(0, netWorth('P')) - shortLiab());
const SHORT_CAP = .15; // lendable shares: up to 15% of shares outstanding
function playerPay(cost){ // spend cash, borrow the rest on margin
  const p = S.player; if (p.cash >= cost) { p.cash -= cost; return; }
  p.loan += cost - p.cash; p.cash = 0;
}

/* ---------- trading ---------- */
function quoteBuy(c, n){ const fl = floatOf(c); n = Math.min(n, fl); if (n <= 1e-7) return null; const np = c.price * (1 + 1.1 * n / Math.max(fl, c.shares * .05)); return {n, avg: (c.price + np) / 2, np}; }

function sharesForMoney(c, money){ // solve n*avg*(1+fee)=money
  let n = money / c.price;
  for (let i = 0; i < 6; i++) { const q = quoteBuy(c, n); if (!q) return 0; n = money / (q.avg * 1.0025); }
  return Math.min(n, floatOf(c));
}
function sharesForShort(c, money){ let n = money / c.price; for (let i = 0; i < 6; i++) { const q = quoteSell(c, n); if (!q) return 0; n = money / (q.avg * .9975); } return n; }

  if (c.priv) return null;
  const pos = S.player.shorts[c.id] || {n: 0, basis: 0};
  n = Math.min(n, c.shares * SHORT_CAP - pos.n); const q = quoteSell(c, n); if (!q) return null;
  const proceeds = q.avg * q.n * .9975;
  S.player.cash += proceeds; pos.n += q.n; pos.basis += proceeds; S.player.shorts[c.id] = pos; c.price = q.np;
  return {n: q.n, proceeds};
}
function execCover(c, n){ // buy back from the market; thin float means a squeeze
  const pos = S.player.shorts[c.id]; if (!pos) return null; n = Math.min(n, pos.n); if (n <= 1e-9) return null;
  const np = c.price * (1 + 1.1 * n / Math.max(floatOf(c), c.shares * .05)), cost = (c.price + np) / 2 * n * 1.0025;
  playerPay(cost); pos.basis *= 1 - n / pos.n; pos.n -= n; if (pos.n < 1e-7) delete S.player.shorts[c.id];
  c.price = np;
  return {n, cost};

function snapshotFracs(c){ const o = {}; for (const k in c.own) o[k] = c.own[k] / c.shares; return o; }
function buyRoom(k, c){ const boss = bossOf(k) || k; return Math.max(0, ownCap(c, boss) * c.shares - groupSh(c, boss)); }
const isBanned = c => (S.player.ban[c.id] || 0) > S.week;
function markInsider(c){ for (const t of S.tips) if (t.cid === c.id && !t.used) t.used = true; }
function execBuy(k, c, n){
  if (k === c.id || c.priv) return null;
  n = Math.min(n, buyRoom(k, c));
  const q = quoteBuy(c, n); if (!q) return null;
  if (bossOf(k) === 'P') markInsider(c);
  const before = snapshotFracs(c), cost = q.avg * q.n * 1.0025;
  debit(k, cost); addCost(k, c.id, cost);
  c.own[k] = (c.own[k] || 0) + q.n; c.price = q.np;

}
function execSell(k, c, n){
  n = Math.min(n, c.own[k] || 0); const q = quoteSell(c, n); if (!q) return null;
  const before = snapshotFracs(c), proceeds = q.avg * q.n * .9975;
  cutCost(k, c, q.n);
  credit(k, proceeds);
  c.own[k] -= q.n; if (c.own[k] < 1e-7) delete c.own[k];
  c.price = q.np;
  afterOwn(c, before);
  return {n: q.n, proceeds};
}
function transferShares(from, to, c, n, price){ // block trade between holders
  n = Math.min(n, c.own[from] || 0); if (n <= 1e-7) return 0;
  const before = snapshotFracs(c), amt = n * price;
  cutCost(from, c, n);
  credit(from, amt); debit(to, amt); addCost(to, c.id, amt);
  c.own[from] -= n; if (c.own[from] < 1e-7) delete c.own[from];
  c.own[to] = (c.own[to] || 0) + n;

const groupTag = k => isCo(k) && coById(k) && coById(k).ctrl ? `（${ownerName(coById(k).ctrl)}系）` : '';
const THRESH = [.05, .10, .20, .33];
let inTender = false; // a completed tender cannot be undone by a defensive share issue
function afterOwn(c, before){

    const f = c.own[k] / c.shares, b = before[k] || 0;
    let hit = 0;
    for (const t of THRESH) if (f >= t && b < t && !(c.disc[k] >= t)) { c.disc[k] = t; hit = t; }
    if (hit) news(`【大量保有】${ownerName(k)}${groupTag(k)}が${c.name}株を${pc(f, 1)}保有`, bossOf(k) === 'P' ? 'you' : 'deal', c.city);
    if (f >= .3 && b < .3 && !c.pill && !c.ctrl && !inTender) maybePill(c, k);
  }

}
function recomputeCtrl(){ // group control: every stake held by a person or by companies that person controls counts
  const prev = {}; for (const c of S.cos) prev[c.id] = c.ctrl;
  for (let it = 0; it < 6; it++) {
    let changed = false;
    for (const c of S.cos) {
      const tally = {};
      for (const k in c.own) { const b = bossOf(k); if (b) tally[b] = (tally[b] || 0) + c.own[k]; }
      let nc = null; for (const b in tally) if (tally[b] > c.shares * .5) nc = b;
      if (nc !== c.ctrl) { c.ctrl = nc; changed = true; }
    }
    if (!changed) break;
  }
  for (const c of S.cos) if (prev[c.id] !== c.ctrl) ctrlNews(c, prev[c.id]);
}
function ctrlNews(c, prev){

  if (c.ctrl) {
    news(`【経営権取得】${ownerName(c.ctrl)}が${c.name}を支配下に（グループ持分${pc(gfrac(c, c.ctrl), 1)}）`, c.ctrl === 'P' ? 'you' : 'deal', c.city);
    if (c.ctrl === 'P') toast(`${c.name}の経営権を取得！ CEOとして配当・自社株買い・買収・他社株の取得が可能に`);

function maybePill(c, k){

    if (bossOf(k) === 'P') toast(`${c.name}が防衛策を発動。持分が希薄化しました`, true);
  }

/* ---------- tender offers & bidding wars ---------- */
const activeTob = c => S.tobs.find(t => t.cid === c.id);
function tenderQuote(k, c, price, target, ref){
  if (c.priv) return null;
  const boss = bossOf(k) || k;
  const want = Math.min(target, ownCap(c, boss)) * c.shares - groupSh(c, boss); if (want <= 1e-6) return null;
  const fv = fair(c), base = Math.max(ref || c.price, fv * .9), p = price / base;
  const accept = boss === 'P' && hasR('ma1') ? clamp((p - 1.0) / .33, 0, 1) : clamp((p - 1.05) / .35, 0, 1);
  const fromPublic = Math.min(want, floatOf(c) * accept);
  let got = fromPublic; const blocks = [];
  for (const o of Object.keys(c.own).sort()) {
    if (got >= want - 1e-9) break;
    const ob = bossOf(o);
    if (ob === boss || ob === 'P' || o === 'P') continue; // the player's group always decides personally
    const need = c.ctrl && c.ctrl === ob ? 1.5 : 1.28;
    if (price >= fv * need) { const n = Math.min(c.own[o], want - got); blocks.push([o, n]); got += n; }
  }
  return {price, want, fromPublic, blocks, total: got, cost: got * price, accept, after: (groupSh(c, boss) + got) / c.shares};
}
function execTender(k, c, price, target, ref, lbo){
  const q = tenderQuote(k, c, price, target, ref); if (!q || q.total <= 1e-7) return null;
  const before = snapshotFracs(c), base = ref || c.price, boss = bossOf(k) || k;
  // LBO: the bidder puts up 35%; the rest is borrowed and loaded onto the target's balance sheet
  const pay = amt => { if (lbo) { debit(k, amt * (1 - LBO_DEBT)); c.debt += amt * LBO_DEBT; } else debit(k, amt); addCost(k, c.id, lbo ? amt * (1 - LBO_DEBT) : amt); };
  pay(q.fromPublic * price);
  c.own[k] = (c.own[k] || 0) + q.fromPublic;
  for (const [o, n0] of q.blocks) {
    const n = Math.min(n0, c.own[o] || 0); if (n <= 1e-9) continue;
    cutCost(o, c, n);
    credit(o, n * price); pay(n * price);
    c.own[o] -= n; if (c.own[o] < 1e-7) delete c.own[o];
    c.own[k] = (c.own[k] || 0) + n;
  }
  if (lbo) news(`【LBO】${c.name}の買収資金${fm(q.cost * LBO_DEBT)}は同社の借入で調達（格付け${rating(c)[0]}）`, boss === 'P' ? 'you' : 'deal', c.city);
  const prem = price / base - 1;
  c.price = base * (1 + Math.max(0, prem) * (q.after > .5 ? .35 : .2)); // premium only partly sticks

function drawChart(cv, series, fmt){
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  let lo = Infinity, hi = -Infinity, len = 0;
  for (const s of series) for (const v of s.d) { lo = Math.min(lo, v); hi = Math.max(hi, v); len = Math.max(len, s.d.length); }
  if (!isFinite(lo) || len < 2) return;
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * .08; lo -= pad; hi += pad;
  x.font = '10px JetBrains Mono, monospace';
  let R = 0; for (let i = 0; i <= 3; i++) R = Math.max(R, x.measureText(fmt(lo + (hi - lo) * i / 3)).width);
  R = Math.min(W * .4, R + 12);
  const L = 4, T = 6, B = 6, py = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo)), px = i => L + (W - L - R) * i / (len - 1);
  x.font = '10px JetBrains Mono, monospace'; x.fillStyle = '#8fa8ba'; x.strokeStyle = 'rgba(143,168,186,.14)'; x.lineWidth = 1;
  for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3, y = py(v); x.beginPath(); x.moveTo(L, y); x.lineTo(W - R, y); x.stroke(); x.fillText(fmt(v), W - R + 8, y + 3); }
  for (const s of series) {
    const off = len - s.d.length; if (s.d.length < 2) continue;
    x.beginPath(); s.d.forEach((v, i) => { const X = px(i + off), Y = py(v); i ? x.lineTo(X, Y) : x.moveTo(X, Y); });
    x.strokeStyle = s.col; x.lineWidth = s.w || 2; x.lineJoin = 'round'; x.stroke();
    if (series.length === 1) { x.lineTo(px(len - 1), H - B); x.lineTo(px(off), H - B); x.closePath(); x.globalAlpha = .12; x.fillStyle = s.col; x.fill(); x.globalAlpha = 1; }
    const ex = px(len - 1), ey = py(s.d[s.d.length - 1]); x.beginPath(); x.arc(ex, ey, 3, 0, 7); x.fillStyle = s.col; x.fill();
  }
}
