<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0c1118" />
<title>PE Firm Tycoon</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><h1>PE Firm Tycoon</h1><p>PRIVATE EQUITY CONTROL CENTER</p></div>
    <div class="turnbox"><div class="turn" id="turnLabel"></div><small id="fundAge"></small></div>
  </div>
  <div id="runtimeStatus" class="runtime bad">ゲームエンジン起動確認中… この表示が残る場合、このプレビューではJavaScriptが実行されていません。</div>
  <div class="stats" id="topStats"></div>
  <section id="dashboard" class="view active"></section>
  <section id="deals" class="view"></section>
  <section id="ic" class="view"></section>
  <section id="portfolio" class="view"></section>
  <section id="funds" class="view"></section>
  <section id="ecosystem" class="view"></section>
  <section id="org" class="view"></section>
  <section id="strategy" class="view"></section>
  <section id="records" class="view"></section>
  <div class="nav" id="nav">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="deals">Deal Room</button>
    <button data-view="ic">IC</button>
    <button data-view="funds">Funds</button>
    <button data-view="portfolio">Portfolio</button>
    <button data-view="ecosystem">Ecosystem</button>
    <button data-view="org">Org</button>
    <button data-view="strategy">Strategy</button>
    <button data-view="records">実績</button>
  </div>
</div>
<div class="footerbar"><button class="btn primary" id="advanceBtn">▶ 次の四半期へ</button><button class="btn" id="saveBtn">▣ 保存</button><button class="btn danger" id="resetBtn">↻ リセット</button></div>
<div class="toast" id="toast"></div>
<div class="modal" id="memoModal"><div class="modal-card"><div class="modal-head"><h3>Investment Memo</h3><button class="modal-close" id="modalClose" aria-label="close">×</button></div><div class="modal-body" id="memoContent"></div></div></div>
<script src="bootstrap.js"></script>
</body>
</html>
